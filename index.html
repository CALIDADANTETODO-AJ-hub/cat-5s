<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>CAT · Calidad Ante Todo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* el archivo descargado se abre sin la hoja base del sistema: fijamos el reset acá */
[hidden]{display:none!important}

:root{
  --ground:#F7F5EF; --surface:#FFFFFF; --surface-2:#F1EFE6; --surface-3:#E6E3D7;
  --line:#E1DDD0; --line-strong:#C5BFAE;
  --ink:#153731; --ink-2:#41615A; --ink-3:#7B8E87;
  --accent:#0E4B43; --accent-2:#0A3A33; --accent-soft:#DEEDE8;
  --coral:#DC7455; --coral-soft:#FBE7DF;
  --ok:#2E7D57; --ok-soft:#E1F1E8;
  --warn:#B07406; --warn-soft:#FBEED9;
  --crit:#C0483A; --crit-soft:#FBE5E0;
  --hazard:#DFA33C;
  --seq-1:#DCE9E4; --seq-2:#AFCFC6; --seq-3:#78B0A3; --seq-4:#3F8578; --seq-5:#12564C;
  --shadow:0 1px 2px rgba(21,55,49,.04), 0 12px 32px -18px rgba(21,55,49,.24);
  --radius:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E2A26; --surface:#143830; --surface-2:#1B443B; --surface-3:#245046;
    --line:#275147; --line-strong:#3D6C60;
    --ink:#F4EBD8; --ink-2:#C4D6CE; --ink-3:#8DA79F;
    --accent:#74D6C0; --accent-2:#A8E7D8; --accent-soft:#1B443B;
    --coral:#EE9376; --coral-soft:#3A2620;
    --ok:#63C08C; --ok-soft:#16342A;
    --warn:#DDAB4E; --warn-soft:#332A15;
    --crit:#EC8570; --crit-soft:#3A211C;
    --hazard:#DFA33C;
    --seq-1:#1F3F39; --seq-2:#2D5C53; --seq-3:#3F8577; --seq-4:#59AC98; --seq-5:#7BD1BB;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E2A26; --surface:#143830; --surface-2:#1B443B; --surface-3:#245046;
  --line:#275147; --line-strong:#3D6C60;
  --ink:#F4EBD8; --ink-2:#C4D6CE; --ink-3:#8DA79F;
  --accent:#74D6C0; --accent-2:#A8E7D8; --accent-soft:#1B443B;
  --coral:#EE9376; --coral-soft:#3A2620;
  --ok:#63C08C; --ok-soft:#16342A;
  --warn:#DDAB4E; --warn-soft:#332A15;
  --crit:#EC8570; --crit-soft:#3A211C;
  --hazard:#DFA33C;
  --seq-1:#1F3F39; --seq-2:#2D5C53; --seq-3:#3F8577; --seq-4:#59AC98; --seq-5:#7BD1BB;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.75);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Figtree,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1,.serif{font-family:"Cormorant Garamond",Georgia,serif; font-weight:600; letter-spacing:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

.app{display:grid; grid-template-columns:238px 1fr; min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px; padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 16px}
.brand .mark{width:40px;height:40px;flex:none;display:grid;place-items:center}
.brand .mark img{width:100%;height:100%;object-fit:contain;display:block}
.tv .tvhead .mk img{width:100%;height:100%;object-fit:contain;display:block}
.brand b{font-family:Figtree;font-weight:700;font-size:15px;display:block;line-height:1.15}
.brand span{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.navfold{display:flex;align-items:center;gap:8px;width:100%;padding:10px 8px 6px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--ink);margin-top:8px}
.navfold .car{display:inline-block;width:14px;transition:transform .15s;color:var(--ink-3)}
.navfold[aria-expanded="false"] .car{transform:rotate(-90deg)}
.navfold svg{flex:none;color:var(--accent)}
.foldbody{margin-left:9px;padding-left:6px;border-left:1px solid var(--line)}
.navfold.site{font-size:12.5px;text-transform:none;letter-spacing:0;padding:8px 8px 4px;margin-top:4px;color:var(--ink-2)}
.navfold.site.sel{color:var(--accent-2)}
.navfold.lvl{font-size:11px;padding:8px 8px 4px;margin-top:2px;color:var(--ink-3)}
.navfold.lvl svg{color:var(--ink-3)}
.foldbody .eyebrow2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-2);font-weight:700;margin-bottom:4px}
.navlabel{padding-top:10px}
.nav.sub{padding:6px 10px;font-size:13.5px}
.nav.sub .pn{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;color:var(--ink-3);width:22px;flex:none}
.navlabel{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:14px 8px 6px;font-weight:600}
.nav{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;
  background:transparent;cursor:pointer;text-align:left;font-weight:500;color:var(--ink-2);
}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav svg{flex:none;opacity:.9}
.nav .badge{margin-left:auto}
.railfoot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.railfoot label{display:block;margin-bottom:4px}
.railfoot input{
  width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:12px
}

main{min-width:0;padding:22px 26px 60px;max-width:1340px}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.head h1{font-size:34px;font-weight:600;line-height:1.1}
.head p{margin:4px 0 0;color:var(--ink-3);font-size:13px;max-width:66ch}
.headbtns{display:flex;gap:8px;flex-wrap:wrap}

.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;
  background:var(--surface-3);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap
}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.a{background:var(--accent-soft);color:var(--accent-2)}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.out{background:transparent;border:1px solid currentColor}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);cursor:pointer;font-weight:500;transition:background .12s
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
select,input[type=text],input[type=date],textarea{
  padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);width:100%
}
textarea{resize:vertical;min-height:52px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px}
.filters .field{min-width:168px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel>header h3{font-size:14px;font-weight:600}
.panel>header .sub{font-size:11.5px;color:var(--ink-3);text-align:right}
.panel .body{padding:16px}
.grid{display:grid;gap:14px}
.grid.start{align-items:start}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1150px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.kpi .v{font-weight:800;font-size:35px;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:16px;font-weight:700;color:var(--ink-3)}
.kpi .m{margin-top:7px;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi.tint{background:var(--coral-soft);border-color:color-mix(in srgb,var(--coral) 32%,transparent)}
.kpi.tint .v{color:var(--crit)}
.kpi.tintok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.kpi.tintok .v{color:var(--ok)}
.kpi.alert{border-color:color-mix(in srgb,var(--hazard) 60%,var(--line))}
.kpi.alert::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:repeating-linear-gradient(135deg,var(--hazard) 0 7px,transparent 7px 14px)}

/* módulos: acceso rápido tipo Suite Retail */
.mods{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:1100px){.mods{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.mods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mod{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;transition:transform .12s,box-shadow .12s;
  box-shadow:var(--shadow);position:relative
}
.mod:hover{transform:translateY(-2px);box-shadow:0 6px 14px -6px rgba(21,55,49,.28)}
.mod .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.mod b{font-size:12.5px;font-weight:600;line-height:1.25}
.mod .pill{position:absolute;top:9px;right:9px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--crit);color:#fff}
.secTitle{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:22px;margin:26px 0 12px}
.soft2{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink-3)}
.money{font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rowline:last-child{border-bottom:0}
.rowline b{font-variant-numeric:tabular-nums}
.exec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}

/* ---------- reconocimiento y copa entre sectores ---------- */
.podio{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:14px;align-items:end;margin-bottom:16px}
.pod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center;position:relative;overflow:hidden}
.pod .pl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.pod b{display:block;font-size:17px;margin:8px 0 2px;line-height:1.2}
.pod .pp{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;line-height:1}
.pod .ps{font-size:12px;color:var(--ink-3);margin-top:6px}
.pod.p1{border-color:#C9A227;box-shadow:0 6px 22px color-mix(in srgb,#C9A227 18%,transparent);padding:26px 16px}
.pod.p1 .pp{font-size:40px}
.pod .medal{font-size:22px;line-height:1;margin-bottom:8px}
.trofeo{background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 72%,#000) 100%);
  color:var(--cream,#F3EFE3);border-radius:16px;padding:26px 24px;margin-bottom:16px;position:relative;overflow:hidden}
.trofeo::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.10;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 10 L36 32 L14 54' fill='none' stroke='%23F6D901' stroke-width='11'/%3E%3C/svg%3E");
  background-size:64px 64px}
.trofeo .k{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
.trofeo h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:38px;margin:6px 0 0;font-weight:700;line-height:1.05}
.trofeo .por{font-size:14.5px;opacity:.9;margin-top:10px;max-width:62ch;line-height:1.55}
.trofeo .nums{display:flex;gap:26px;flex-wrap:wrap;margin-top:16px}
.trofeo .nums div span{display:block;font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:500}
.trofeo .nums div small{font-size:11.5px;opacity:.72;letter-spacing:.06em;text-transform:uppercase}
.liga td.pos{font-family:'IBM Plex Mono',monospace;font-weight:600;width:52px;color:var(--ink-3)}
.liga tr.top1 td{background:color-mix(in srgb,#C9A227 9%,transparent)}
.liga td.pts{font-family:'IBM Plex Mono',monospace;font-weight:600}
.delta{font-family:'IBM Plex Mono',monospace;font-size:12.5px}
.delta.up{color:var(--ok)} .delta.dn{color:var(--crit)} .delta.eq{color:var(--ink-3)}
.tv .podio{gap:1.6vw;margin-bottom:0}
.tv .pod{padding:2.4vh 1.4vw;border-radius:1vw}
.tv .pod b{font-size:2.1vw} .tv .pod .pp{font-size:4vw} .tv .pod .pl{font-size:1vw} .tv .pod .ps{font-size:1.1vw}
.tv .pod.p1{padding:3.4vh 1.6vw} .tv .pod.p1 .pp{font-size:5.4vw}
.tv .pod .medal{font-size:2.6vw;line-height:1;margin-bottom:1vh}
.tv .campeon{text-align:center}
.tv .campeon .nm{font-family:'Cormorant Garamond',Georgia,serif;font-size:6.4vw;line-height:1.02;font-weight:700}
.tv .campeon .pc{font-family:'IBM Plex Mono',monospace;font-size:7vw;font-weight:500;line-height:1}
.tv .campeon .mot{font-size:1.8vw;color:var(--ink-3);margin-top:1.6vh;max-width:70%;margin-left:auto;margin-right:auto;line-height:1.4}

/* ---------- expedientes: fotos y adjuntos ---------- */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.foto{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.foto img{width:100%;height:180px;object-fit:cover;display:block;cursor:zoom-in;background:var(--surface-3)}
.foto figcaption{padding:10px;display:flex;flex-direction:column;gap:8px}
.foto figcaption input{font-size:12.5px;padding:6px 8px}

/* ---------- interactividad ---------- */
.kpi[data-jump]{cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi[data-jump]:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(21,55,49,.3)}
.kpi[data-jump]::after{content:"→";position:absolute;right:14px;bottom:12px;color:var(--ink-3);font-weight:700;opacity:0;transition:opacity .12s}
.kpi[data-jump]:hover::after{opacity:1}
.bar[data-secjump]{cursor:pointer;border-radius:8px;padding:4px 6px;margin:-4px -6px;transition:background .12s}
.bar[data-secjump]:hover{background:var(--surface-2)}
.help{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-3);font-size:12px;font-weight:700;cursor:help;display:inline-grid;place-items:center;vertical-align:middle;margin-left:6px}
.help:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- tour guiado ---------- */
.tour{position:fixed;inset:0;z-index:130;background:rgba(10,33,29,.72);display:grid;place-items:center;padding:24px}
.tourcard{background:var(--surface);border-radius:22px;max-width:520px;width:100%;padding:28px;box-shadow:0 30px 70px -24px rgba(0,0,0,.6)}
.tourcard .tn{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;color:var(--coral);text-transform:uppercase}
.tourcard h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:30px;margin:8px 0 10px;line-height:1.1}
.tourcard p{margin:0 0 12px;color:var(--ink-2);font-size:14.5px;line-height:1.6}
.tourcard .tic{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:16px}
.tourdots{display:flex;gap:6px;margin:18px 0}
.tourdots i{width:26px;height:4px;border-radius:99px;background:var(--surface-3)}
.tourdots i.on{background:var(--accent)}
.tourbtns{display:flex;gap:8px;flex-wrap:wrap}
.tourbtns .btn{min-height:42px}

/* ---------- pilares CAT ---------- */
.pilgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:8px}
@media (max-width:1100px){.pilgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.pilgrid{grid-template-columns:1fr}}
.pilcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;transition:transform .12s,box-shadow .12s}
.pilcard:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(21,55,49,.3)}
.pilcard .pt{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pilcard .pnum{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;background:var(--accent);color:#fff;padding:2px 8px;border-radius:6px}
.pilcard b{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:600;line-height:1.1}
.pilcard i{font-style:italic;font-size:12px;color:var(--ink-3)}
.pilcard .pv{font-weight:800;font-size:38px;letter-spacing:-.02em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.pilcard .pv small{font-size:16px;color:var(--ink-3);font-weight:700}
.pilcard .pm{font-size:12px;color:var(--ink-3);margin-top:6px}
.pilcard .pl{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
table.heat td.r .badge{min-width:64px;justify-content:center}
/* ---------- evolución por sector ---------- */
.evogrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1150px){.evogrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.evogrid{grid-template-columns:1fr}}
.evocard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.evocard:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(21,55,49,.3)}
.evocard.mio{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}

tbody tr.clickable{cursor:pointer}

td.r,th.r{text-align:right}
td input,td select,td textarea{padding:5px 7px;font-size:12.5px}
tr.esc td{background:color-mix(in srgb,var(--crit-soft) 55%,transparent)}

.empty{padding:34px 16px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);font-family:Figtree;font-size:15px;margin-bottom:5px}

.auditgrid{display:grid;grid-template-columns:1fr 272px;gap:16px;align-items:start}
@media (max-width:1000px){.auditgrid{grid-template-columns:1fr}}
.score{position:sticky;top:18px}
.sec{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:12px;overflow:hidden}
.sec>header{display:flex;align-items:center;gap:11px;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);flex-wrap:wrap}

.sec>header i{font-style:normal;color:var(--ink-3);font-size:11.5px}

.item{padding:12px 14px;border-bottom:1px solid var(--line)}

.tags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.scale{display:flex;gap:5px;flex-wrap:wrap}
.scale button{
  min-width:38px;padding:5px 10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;

}
.scale button:hover{border-color:var(--line-strong)}

.obs{margin-top:9px}
.wfotos{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.wfotos figure{margin:0;position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.wfotos figure img{width:100%;height:100%;object-fit:cover;display:block}
.wfotos .wfx{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer}
.wfoto{cursor:pointer}
.flag{margin-top:9px;padding:8px 10px;border-radius:7px;background:var(--crit-soft);color:var(--crit);font-size:12px;font-weight:500;display:flex;gap:7px;align-items:flex-start}
.flag.b{background:var(--warn-soft);color:var(--warn)}
.sscore{display:flex;flex-direction:column;gap:9px}

.bigscore{text-align:center;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.bigscore .v{font-weight:800;font-size:50px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.bigscore .v small{font-size:20px;color:var(--ink-3)}
.klab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 5px 3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--ink-3);padding:0 3px;line-height:1;font-size:14px}
.chip button:hover{color:var(--crit)}
.hab{display:inline-flex;gap:3px;vertical-align:middle}
.hab i{width:8px;height:8px;border-radius:2px;background:var(--surface-3);display:inline-block}

.checkline{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13px}
.checkline input{margin-top:3px;flex:none}

.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--ground);padding:7px 9px;border-radius:7px;font-size:12px;max-width:260px;box-shadow:var(--shadow);line-height:1.35}
.tip b{color:var(--surface)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius);background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);margin-bottom:16px;font-size:13px}
.notice.info{background:var(--accent-soft);color:var(--accent-2);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:14px}

/* ---------- modo pantalla (televisor) ---------- */
.tv{
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;padding:3.2vh 3.6vw;
  /* la pantalla del pasillo va siempre en la identidad oscura: se lee mejor a distancia */
  --ground:#0E2A26; --surface:#16382F; --surface-2:#1D453C; --surface-3:#265146;
  --line:#2C574C; --ink:#F5ECDA; --ink-2:#C6D8D0; --ink-3:#95AFA7;
  --accent:#7BD9C3; --ok:#68C692; --warn:#E2B257; --crit:#F09077; --coral:#EE9376;
  background:#0E2A26; color:#F5ECDA;
}
.tv .slide.center{align-items:center;text-align:center}
.tv .meter{width:46vw;height:1.6vh;background:#265146;border-radius:99px;overflow:hidden;margin-top:1vh}
.tv .meter i{display:block;height:100%;border-radius:99px}
.tv .tvhead{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid var(--line);padding-bottom:1.6vh}
.tv .tvhead .l{display:flex;align-items:center;gap:14px}
.tv .tvhead .mk{width:3.2vw;height:3.2vw;min-width:42px;min-height:42px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:Figtree;font-weight:800;font-size:1.3vw}
.tv h2{font-family:Figtree;font-weight:800;font-size:2.1vw;letter-spacing:-.02em}
.tv .tvhead .r{text-align:right;color:var(--ink-3);font-size:1.05vw;font-family:"IBM Plex Mono",monospace}
.tv .slide{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.6vh;padding:2vh 0;min-height:0}
.tv .slide h3{font-family:Figtree;font-weight:700;font-size:1.5vw;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.tv .huge{font-family:Figtree;font-weight:800;font-size:10vw;line-height:.95;font-variant-numeric:tabular-nums}
.tv .huge small{font-size:3.4vw;color:var(--ink-3)}
.tv .tvbars{display:flex;flex-direction:column;gap:1.5vh}
.tv .tvbar{display:grid;grid-template-columns:22vw 1fr 6vw;gap:1.4vw;align-items:center;font-size:1.35vw}
.tv .tvbar b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv .tvbar .tr{height:2.2vh;background:var(--surface-3);border-radius:0 6px 6px 0;position:relative}
.tv .tvbar .fl{height:100%;border-radius:0 5px 5px 0}
.tv .tvbar .vv{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
.tv .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw}
.tv .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2.4vh 1.8vw}
.tv .card .cv{font-family:Figtree;font-weight:800;font-size:5vw;line-height:1;font-variant-numeric:tabular-nums}
.tv .card .ck{font-size:1.05vw;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase;font-weight:600;margin-top:.8vh}
.tv .foco{font-family:Figtree;font-weight:700;font-size:3.6vw;line-height:1.15;text-wrap:balance}
.tv .recon{font-size:1.7vw;line-height:1.5;max-width:60ch}
.tv .tvfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);padding-top:1.4vh;color:var(--ink-3);font-size:.95vw}
.tv .dots{display:flex;gap:7px}
.tv .dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-3);display:block}
.tv .dots i.on{background:var(--accent)}
.tv .tvexit{position:absolute;top:1.4vh;right:1.4vw;z-index:2}
.tv ul{margin:0;padding-left:1.4em;font-size:1.4vw;line-height:1.7}

.backbtn{margin:-6px 0 10px -6px;color:var(--ink-2)}
@media print{.backbtn{display:none!important}}
.mbar{display:none}
.railclose{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  /* barra superior del celular: logo + botón Menú. El menú completo se abre como cajón a pantalla completa */

  .nav{padding:11px 10px;font-size:15px}

  .navfold{padding:12px 8px 6px}
  .railfoot{padding:16px 8px 0}
  main{padding:16px 14px 50px}
  .head h1{font-size:26px}
  .tv h2,.tv .tvbar,.tv .card .ck,.tv .tvhead .r{font-size:15px}
  .tv .huge{font-size:22vw}.tv .foco{font-size:8vw}.tv .recon{font-size:16px}

/* ================= pantalla de entrada ================= */
.gate{position:fixed;inset:0;z-index:200;overflow:auto;display:flex;align-items:flex-start;justify-content:center;
  background:radial-gradient(1100px 620px at 50% -10%,#1d5c46 0%,#124334 46%,#0d3227 100%)}
.gate::before,.gate::after{content:'';position:absolute;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 10 L36 32 L14 54' fill='none' stroke='%23F6D901' stroke-width='11' stroke-linecap='square'/%3E%3C/svg%3E");
  background-size:64px 64px;background-repeat:repeat}
.gate::before{top:-14px;right:-14px;width:256px;height:256px;opacity:.11}
.gate::after{bottom:-14px;left:-14px;width:200px;height:200px;opacity:.07;transform:rotate(180deg)}
.gate .gin{position:relative;width:100%;max-width:452px;padding:52px 20px 34px;text-align:center}
.gate .lock{width:132px;height:132px;margin:0 auto;background:#fff;border-radius:22px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 18px 44px rgba(0,0,0,.26)}
.gate .lock img{width:96px;height:auto;display:block}
.gate h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;color:#fff;
  font-size:clamp(30px,7vw,42px);line-height:1.08;margin:22px 0 0;letter-spacing:-.01em}
.gate .gsub{color:#F6D901;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;margin-top:9px}
.gate .rule{width:96px;height:5px;border-radius:3px;background:#F6D901;margin:16px auto 0}
.gate .gcard{background:#fff;border-radius:16px;padding:24px 22px;margin-top:30px;text-align:left;
  box-shadow:0 22px 54px rgba(0,0,0,.24)}
.gate .gcard h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;color:#124334;margin:0;font-weight:700}
.gate .gcard .gp{color:#5d6b63;font-size:13.5px;margin:5px 0 18px;line-height:1.5}
.gate .gf{margin-bottom:14px}
.gate .gf label{display:block;font-size:12.5px;font-weight:600;color:#2b3a33;margin-bottom:6px}
.gate .gf input,.gate .gf select{width:100%;padding:11px 12px;border:1px solid #cfd8d3;border-radius:9px;
  font:inherit;font-size:14.5px;color:#16241e;background:#fff;box-sizing:border-box}
.gate .gf input:focus,.gate .gf select:focus{outline:2px solid #1d5c46;outline-offset:-1px;border-color:#1d5c46}
.gate .gf .hint{font-size:12px;color:#6d7a73;margin-top:6px;line-height:1.45}
.gate .gbtn{width:100%;padding:13px;border:0;border-radius:9px;background:#124334;color:#fff;
  font:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.gate .gbtn:hover{background:#1d5c46}
.gate .gerr{background:#fdeceb;border:1px solid #f3c7c2;color:#9e2b1c;border-radius:9px;
  padding:10px 12px;font-size:13px;margin-bottom:14px;line-height:1.45}
.gate .gnote{border-top:1px solid #e6ece9;margin-top:20px;padding-top:16px;font-size:12.5px;color:#6d7a73;line-height:1.55}
.gate .gfoot{color:rgba(255,255,255,.62);font-size:12.5px;margin-top:24px}
.gate .roles{display:grid;gap:8px;margin-bottom:14px}
.gate .rolopt{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid #cfd8d3;
  border-radius:10px;cursor:pointer;background:#fff;text-align:left;font:inherit;width:100%}
.gate .rolopt:hover{border-color:#1d5c46;background:#f6faf8}
.gate .rolopt[aria-pressed="true"]{border-color:#124334;background:#eef5f1;box-shadow:inset 0 0 0 1px #124334}
.gate .rolopt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid #a9b7b0;flex:0 0 auto;margin-top:2px}
.gate .rolopt[aria-pressed="true"] .rd{border-color:#124334;background:radial-gradient(circle,#124334 42%,#fff 46%)}
.gate .rolopt b{display:block;font-size:14px;color:#16241e;font-weight:600}
.gate .rolopt span{display:block;font-size:12.5px;color:#6d7a73;line-height:1.45;margin-top:2px}
.railfoot .who b{display:block;font-size:13px;color:var(--ink);font-weight:600;line-height:1.3}
.railfoot .who i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin:2px 0 9px}
</style>

/* checklists que le sirven a un sector: primero las armadas para ese sector puntual (campo sectores);
   si no hay ninguna, las de su tipo (depósito, oficina, cocina…); si tampoco, las generales */
function checklistsAptas(cls,sec){
  const propias=cls.filter(c=>c.sectores&&c.sectores.length&&c.sectores.indexOf(sec.id)>=0);
  const porTipo=cls.filter(c=>!(c.sectores&&c.sectores.length)&&(!c.tipos||!c.tipos.length||c.tipos.indexOf(sec.tipo||'general')>=0));
  if(!propias.length)return porTipo;
  /* las del sector, y además las de tipo que sean de pilar (Seguridad) o que no tengan su equivalente propio */
  return propias.concat(porTipo.filter(c=>c.pilar&&!propias.some(x=>x.pilar===c.pilar)));
}

function localDb(){
  const KEY='cat5s.store';
  let S={};
  try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
  if(!S||!Object.keys(S).length){S=JSON.parse(JSON.stringify(SEMILLA||{}))}
  /* usuarios que vienen con el archivo: se agregan si el navegador ya tenía datos de una versión anterior */
  Object.keys(SEMILLA||{}).forEach(k=>{if(k.indexOf('usuarios/')===0&&!(k in S))S[k]=JSON.parse(JSON.stringify(SEMILLA[k]))});
  const subs=[];
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Este navegador se quedó sin espacio: exportá el respaldo y quitá fotos viejas')}};
  const fire=()=>subs.forEach(f=>f());
  save();
  return {
    esLocal:true,
    exportar:()=>JSON.stringify({app:'CAT 5S',version:1,exportado:new Date().toISOString(),datos:S},null,1),
    importar:(txt)=>{
      const o=JSON.parse(txt);const d=(o&&o.datos)?o.datos:o;
      if(!d||typeof d!=='object')throw new Error('formato');
      S=d;save();fire();return Object.keys(d).length;
    },
    doc:p=>({path:p,id:p.split('/').pop(),
      get:async()=>({exists:p in S,id:p.split('/').pop(),data:()=>S[p],metadata:{}}),
      set:async d=>{S[p]=d;save();fire()},
      update:async d=>{S[p]=Object.assign({},S[p]||{},d);save();fire()},
      delete:async()=>{delete S[p];save();fire()},
      onSnapshot:(next)=>{const f=()=>next({exists:p in S,id:p.split('/').pop(),data:()=>S[p],metadata:{}});subs.push(f);f();return()=>{}},
      collection:()=>null}),
    collection:c=>({path:c,
      onSnapshot:(next)=>{const f=()=>{
        const docs=Object.keys(S).filter(k=>k.indexOf(c+'/')===0&&k.slice(c.length+1).indexOf('/')<0)
          .map(k=>({id:k.slice(c.length+1),exists:true,data:()=>S[k],metadata:{}}));
        next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}})};subs.push(f);f();return()=>{}},
      doc:()=>null})
  };
}

function firebaseDb(){
  if(typeof firebase==='undefined'||!firebase.firestore||!FIREBASE_CONFIG.projectId)return null;
  if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
  const fs=firebase.firestore();
  try{fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  /* Firestore rechaza valores undefined: se limpian antes de guardar */
  const limpio=d=>JSON.parse(JSON.stringify(d===undefined?{}:d));
  return {
    esNube:true,
    doc:p=>{const r=fs.doc(p);return {id:r.id,path:p,get:()=>r.get(),set:d=>r.set(limpio(d)),update:d=>r.update(limpio(d)),delete:()=>r.delete(),onSnapshot:(n,e)=>r.onSnapshot(n,e)}},
    collection:c=>fs.collection(c),
    /* respaldo exportado desde otra copia (Claude o archivo local) → se sube completo */
    importar:async txt=>{
      const o=JSON.parse(txt);const d=(o&&o.datos)?o.datos:o;
      if(!d||typeof d!=='object')throw new Error('formato');
      const keys=Object.keys(d).filter(k=>k.split('/').length===2&&k!=='config/acceso'); /* la clave de administración de esta base no se pisa */
      for(let i=0;i<keys.length;i+=200){
        const b=fs.batch();keys.slice(i,i+200).forEach(k=>b.set(fs.doc(k),limpio(d[k])));await b.commit();
      }
      return keys.length;
    }
  };
}
async function entrarNube(){
  if(typeof firebase==='undefined'||!firebase.auth)return true;
  try{
    const a=firebase.auth();
    if(a.currentUser)return true;
    await Promise.race([a.signInAnonymously(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),12000))]);
    return true;
  }catch(e){state.nubeErr=(e&&e.code)||(e&&e.message)||'error';return false}
}

const maxItem=cl=>(cl&&cl.modo==='escala')?4:1;
const esFalla=(cl,v)=>(cl&&cl.modo==='escala')?Number(v)<=1:Number(v)===0;

function calcular(cl,resp){
  resp=resp||{};
  const M=maxItem(cl);
  let G=0,MX=0,FA=0,FB=0,EV=0,TOT=0;
  const secciones=(cl.secciones||[]).map(sec=>{
    let g=0,m=0,f=0,ev=0,tot=0;
    (sec.items||[]).forEach(it=>{
      const esA=(it.bloque||'A')==='A';
      if(esA)tot++;TOT+=esA?1:0;
      const r=resp[it.id];
      if(!r||r.v==null||r.v==='na')return;
      const peso=Number(it.peso)||1,v=Number(r.v);
      if(esA){g+=v*peso;m+=M*peso;ev++;if(esFalla(cl,v))f++}
      else if(esFalla(cl,v))FB++;
    });
    G+=g;MX+=m;FA+=f;EV+=ev;
    return{codigo:sec.codigo,nombre:sec.nombre,jp:sec.jp||'',pct:m?Math.round(g/m*1000)/10:null,fallas:f,evaluados:ev,total:tot};
  });
  return{pct:MX?Math.round(G/MX*1000)/10:null,fallas:FA,fallasB:FB,evaluados:EV,total:TOT,secciones};
}

   Cada sector tiene su jefe (o jefes). La auditoría interna la hace un jefe, y la regla
   es que ningún jefe audita un sector propio. La rotación reparte los sectores entre los
   jefes, cambia de quincena en quincena y equilibra la carga; Calidad puede fijar a mano
   una asignación puntual (por vacaciones o licencia) sin romper el resto. */
const JEFES_DEF=[
  {id:'j-cesar',nombre:'Cesar Alegre',cargo:'Jefatura de depósitos y operaciones',activo:true},

const jefesDeSector=s=>(Array.isArray(s.jefes)?s.jefes:[]).filter(id=>jefeDe(id));

function auditadoDe(s){
  if(String(s.referente||'').trim())return {nombre:s.referente.trim(),rol:'Líder 5S'};
  const j=jefesDeSector(s);
  if(j.length)return {nombre:j.map(nombreJefe).join(' · '),rol:'Jefe del sector'};
  return {nombre:'',rol:''};
}
const sectoresRotacion=()=>todosSectores().filter(s=>state.f.sitio==='all'||s.sitioId===state.f.sitio);
const claveRot=(q,sid)=>'q'+q+'|'+sid;
/* el cronograma completo (quién audita cada sector) lo ven Calidad y Gerencia.
   Cada jefe ve solo lo que le toca a él: el resto es información reservada. */
const veRotacionCompleta=()=>esAdmin()||!!(state.sesion&&state.sesion.rol==='gerencia');
/* reparte los sectores de la quincena entre los jefes: nunca el propio, carga pareja */
function rotacionJefes(q){
  const J=jefesActivos(),secs=sectoresRotacion();
  if(!J.length||!secs.length)return [];
  const ov=jefesCfg().overrides;
  const carga={};J.forEach(j=>carga[j.id]=0);
  const res=[],pend=[];
  secs.forEach(s=>{
    const o=ov[claveRot(q,s.id)];
    if(o&&J.some(j=>j.id===o)&&jefesDeSector(s).indexOf(o)<0){carga[o]++;res.push({sector:s,jefeId:o,fijo:true})}
    else if(o==='-'){res.push({sector:s,jefeId:'',fijo:true})}
    else pend.push(s);
  });
  pend.forEach(s=>{
    const own=jefesDeSector(s),idx=secs.indexOf(s);
    let best='',bl=Infinity;
    for(let k=0;k<J.length;k++){
      const j=J[(idx+q+k)%J.length];
      if(own.indexOf(j.id)>=0)continue;
      if(carga[j.id]<bl){bl=carga[j.id];best=j.id;if(bl===0)break}
    }
    if(best)carga[best]++;
    res.push({sector:s,jefeId:best});
  });
  return res.sort((a,b)=>secs.indexOf(a.sector)-secs.indexOf(b.sector));
}
const cargaJefes=q=>{const m={};jefesActivos().forEach(j=>m[j.id]=[]);rotacionJefes(q).forEach(p=>{if(p.jefeId&&m[p.jefeId])m[p.jefeId].push(p.sector)});return m};

    if(doc.activo===false){state.gateErr='Ese usuario está desactivado. Hablá con Calidad.';render();return}
    if(!coincide(mias,doc.hashes)){state.gateErr='La clave no es correcta.';render();return}
    const sec=doc.sectorId?sectorDe(doc.sectorId):null;
    const sitioId=doc.sitioId||(sec?sec.sitioId:'');
    guardarSesion({nombre:doc.nombre,usuario:u,rol:doc.rol,sitioId,sectorId:doc.sectorId||'',sectorNombre:sec?sec.nombre:'',jefeId:doc.jefeId||'',debeCambiar:!!doc.debeCambiar,desde:new Date().toISOString()});
    aplicarSesion();state.gateErr='';
    state.view=doc.rol==='gerencia'?'gerencia':(doc.rol==='admin'?'resumen':(doc.rol==='planta'?'etiquetas':'piso'));
    registrar('ingresó','Ingreso al sistema');render();return;
  }
  if(u==='admin'){
    const g=(state.acceso&&state.acceso.hashes)||[];
    if(!g.length){
      if(clave.length<6){state.gateErr='La clave tiene que tener al menos 6 caracteres.';render();return}
      const d={hashes:mias,titular:'Administración CAT',definidaPor:'admin',temporal:false,actualizado:new Date().toISOString()};
      if(!await guardarDoc('config/acceso',d)){state.gateErr='No se pudo guardar la clave: tu usuario no tiene permiso de edición en esta página.';render();return}
      state.acceso=d;
    }else if(!coincide(mias,g)){state.gateErr='Esa no es la clave de administración.';render();return}
    guardarSesion({nombre:(state.acceso&&state.acceso.titular)||'Administración',usuario:'admin',rol:'admin',sitioId:'',sectorId:'',sectorNombre:'',desde:new Date().toISOString()});
    aplicarSesion();state.gateErr='';state.view='resumen';registrar('ingresó','Ingreso al sistema');render();return;
  }
  state.gateErr='Ese usuario no existe. Pedile a Calidad que te lo cree.';render();
}
function aplicarSesion(){
  const s=state.sesion;if(!s)return;
  if(s.sitioId){elegirSitio(s.sitioId)}
  if(s.rol==='sector'&&s.sectorId){
    state.fh.sector=s.sectorId;
    state.wiz={step:0,sectorId:s.sectorId,checklistId:'',tipo:'interna',fecha:todayISO(),idx:0,resp:{}};
  }
}

async function crearUsuario(form){
  const nombre=form.nombre.value.trim(),clave=form.clave.value,rol=form.rol.value;

}

function resumenSitio(st){
  const secs=todosSectores().filter(s=>s.sitioId===st.id);
  const ids=secs.map(s=>s.id);
  const ext=state.auditorias.filter(a=>ids.indexOf(a.sectorId)>=0&&tipoAud(a)!=='interna'&&validada(a)&&es5S(a)&&enPeriodo(a.fecha)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const ult=ultimaPorSector(ext),vig=Object.values(ult);
  const prom=pooled(vig),pOper=pooled(vig.filter(a=>a.zona==='operativa')),pApoyo=pooled(vig.filter(a=>a.zona==='apoyo'));
  const cat={ok:0,warn:0,crit:0};vig.forEach(a=>{const k=nivel(a.pct).k;if(cat[k]!=null)cat[k]++});
  const hs=state.hallazgos.filter(h=>ids.indexOf(h.sectorId)>=0),ab=hs.filter(abierto),crit=ab.filter(h=>h.severidad==='critico').length,ve=hs.filter(vencido).length;
  const per=state.pil.per;
  const pil=pilCfg().pilares.map(p=>Object.assign({p},pondPilarCD(p,per,secs)));
  const conD=pil.filter(x=>x.v!=null);
  const pilProm=conD.length?Math.round(conD.reduce((s,x)=>s+x.v,0)/conD.length*10)/10:null;
  const int=state.auditorias.filter(a=>ids.indexOf(a.sectorId)>=0&&tipoAud(a)==='interna'&&validada(a)&&enPeriodo(a.fecha)).length;
  return{st,secs,ext,vig,prom,pOper,pApoyo,cat,ab:ab.length,crit,ve,pil,pilProm,int,ultFecha:ext[0]?ext[0].fecha:null};
}

/* la clave se guarda cifrada: nunca se escribe en claro en la base */
async function hashesDe(clave){
  const t='cat5s·'+String(clave);
  const out=[];
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
    out.push('s:'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''));
  }catch(e){}
  let h=5381,g=52711;
  for(let i=0;i<t.length;i++){h=((h<<5)+h+t.charCodeAt(i))|0;g=((g<<5)^(g>>2)^t.charCodeAt(i))|0}
  out.push('f:'+(h>>>0).toString(36)+'-'+(g>>>0).toString(36));
  return out;
}

function resumen(){
  const auds=auditoriasFiltradas();
  const ult=ultimaPorSector(auds);
  const vig=Object.values(ult);
  const prom=pooled(vig);
  const oper=vig.filter(a=>a.zona==='operativa'),apoyo=vig.filter(a=>a.zona==='apoyo');
  const pOper=pooled(oper);
  const pApoyo=pooled(apoyo);
  const cat={ok:0,warn:0,crit:0};
  vig.forEach(a=>{const k=nivel(a.pct).k;if(cat[k]!=null)cat[k]++});
  const hs=hallazgosSitio(),ab=hs.filter(abierto),ve=hs.filter(vencido);
  const cerr=hs.filter(h=>h.estado==='cerrado');
  const enPlazo=cerr.length?cerr.filter(cerradoEnPlazo).length/cerr.length*100:null;
  const reinc=ab.filter(h=>(h.reincidencia||1)>=2).length;
  const crit=ab.filter(h=>h.severidad==='critico').length;
  // internas: cumplimiento de la rutina y brecha contra la externa
  const int=internasFiltradas();
  const ultInt=ultimaPorSector(int);
  const pares=Object.keys(ultInt).filter(k=>ult[k]&&ult[k].pct!=null&&ultInt[k].pct!=null);
  const brecha=pares.length?pares.reduce((s,k)=>s+(ultInt[k].pct-ult[k].pct),0)/pares.length:null;
  const secTot=todosSectores().filter(s=>state.f.sitio==='all'||s.sitioId===state.f.sitio).length;
  const qAct=quincenaDe(todayISO());
  const intQ=int.filter(a=>quincenaDe(a.fecha)===qAct);
  return{auds,ult,vig,prom,pOper,pApoyo,cat,hs,ab,ve,cerr,enPlazo,reinc,crit,int,ultInt,brecha,pares,secTot,qAct,intQ};
}

/* ================= impacto monetario ================= */
function impacto(){
  const p=Object.assign({},IMPD,state.impacto||{});
  const e=ESCEN[p.escenario]||1;
  const pc=v=>Math.max(0,Math.min(100,(Number(v)||0)*e))/100;
  const dot=todosSectores().reduce((n,s)=>n+(Number(s.dotacion)||0),0);
  const ch=Number(p.costoHora)||0;
  const hBusqueda=dot*((Number(p.minBusqueda)||0)/60)*(Number(p.diasMes)||0);
  const aBusqueda=hBusqueda*ch*pc(p.redBusqueda);
  const aMerma=(Number(p.mermaMensual)||0)*pc(p.redMerma);
  const aAcc=((Number(p.accidentesAnio)||0)/12)*(Number(p.costoAccidente)||0)*pc(p.redAccidentes);
  const ahorro=aBusqueda+aMerma+aAcc;
  const hCharlas=dot*((Number(p.minCharla)||0)/60)*(Number(p.diasMes)||0)*(Number(p.turnos)||1)/(Number(p.turnos)||1);
  const cCharlas=hCharlas*ch;
  const cAud=(Number(p.horasAudMes)||0)*ch;
  const costoMes=cCharlas+cAud;
  const inv=(Number(p.invCompras)||0)+(Number(p.horasCapac)||0)*ch;
  const neto=ahorro-costoMes;
  const payback=neto>0?inv/neto:null;
  const anual=neto*12;
  const roi=inv>0?((anual-inv)/inv)*100:null;
  const faltan=[];
  if(!ch)faltan.push('costo de la hora de trabajo');
  if(!dot)faltan.push('dotación por sector');
  if(!Number(p.minBusqueda))faltan.push('minutos por persona por día perdidos en búsqueda');
  if(!Number(p.mermaMensual))faltan.push('merma mensual en guaraníes');
  if(!Number(p.invCompras))faltan.push('inversión prevista en recursos');
  return{p,e,dot,hBusqueda,aBusqueda,aMerma,aAcc,ahorro,hCharlas,cCharlas,cAud,costoMes,inv,neto,payback,anual,roi,faltan};
}

    secciones:r.secciones.map(s=>({codigo:s.codigo,nombre:s.nombre,pct:s.pct,fallas:s.fallas,evaluados:s.evaluados,total:s.total})),
    respuestas:d.resp,creado:new Date().toISOString()
  });
  if(!ok)return;
  let n=0,escal=0;
  for(const s of (cl.secciones||[])){
    for(const it of (s.items||[])){
      const rr=d.resp[it.id];
      if(!rr||rr.v==null||rr.v==='na'||!esFalla(cl,rr.v))continue;
      const prev=state.hallazgos.filter(h=>h.sectorId===sec.id&&h.itemId===it.id).length;
      const reinc=prev+1;
      let sev=it.severidad||'menor';
      if(reinc>=3)sev='critico';
      const B=(it.bloque||'A')==='B';
      const hid=uid('h-');
      await guardarDoc(COL.ha+'/'+hid,{
        auditoriaId:id,sitioId:sec.sitioId,sitioNombre:sec.sitioNombre,sectorId:sec.id,sectorNombre:sec.nombre,
        seccionCodigo:s.codigo,seccionNombre:s.nombre,itemId:it.id,item:it.texto,
        bloque:B?'B':'A',severidad:sev,reincidencia:reinc,escalado:reinc>=3,sinFoto:!!it.sinFoto,
        descripcion:(rr.obs||'').trim(),responsable:'',area:B?(it.area||'mantenimiento'):'sector',
        fechaLimite:addDaysISO(SEV[sev].dias),estado:'abierto',causaRaiz:'',accionPreventiva:'',
        detectadoPor:state.auditor.trim(),fecha:d.fecha,creado:new Date().toISOString()
      });
      n++;if(reinc>=3)escal++;
    }
  }
  state.draft=null;
  toast(`Informe generado · ${n1(r.pct)}%${n?` · ${n} hallazgo${n===1?'':'s'}`:''}${escal?` · ${escal} escalado${escal===1?'':'s'} a crítico`:''}`);
  state.firma=null;
  state.openInf=id;state.view='informe';window.scrollTo(0,0);render();
  toast('Informe generado · ahora firmen el auditor y el líder del sector');
}

      obs:a.firmaObs||'',

  }
  return state.firma;
}

/* cómo viene la firma de una auditoría: sin firmar, a medias, o firmada por los dos */
function estadoFirma(a){
  const A=!!a.firmaAuditor,L=!!a.firmaAuditado;
  if(A&&L)return {k:'ok',l:'Firmada',d:'Firmada por el auditor y por el auditado'};
  if(A||L)return {k:'warn',l:'Falta una firma',d:A?'Firmó el auditor; falta la firma del auditado':'Firmó el auditado; falta la firma del auditor'};
  return {k:'crit',l:'Sin firmar',d:'Todavía no firmaron el auditor ni el auditado'};
}

/* el lápiz sobre el recuadro: sirve con el dedo y con el mouse */
function activarFirmas(){
  document.querySelectorAll('canvas[data-pad]').forEach(cv=>{
    if(cv.dataset.listo)return;cv.dataset.listo='1';
    const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);
    cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));
    const cx=cv.getContext('2d');cx.scale(d,d);
    cx.lineWidth=2;cx.lineCap='round';cx.lineJoin='round';cx.strokeStyle='#16211d';
    let dib=false,lx=0,ly=0,trazo=false;
    const pos=ev=>{const b=cv.getBoundingClientRect();return[ev.clientX-b.left,ev.clientY-b.top]};
    cv.addEventListener('pointerdown',ev=>{ev.preventDefault();dib=true;const q=pos(ev);lx=q[0];ly=q[1];
      try{cv.setPointerCapture(ev.pointerId)}catch(e){}});
    cv.addEventListener('pointermove',ev=>{if(!dib)return;const q=pos(ev);
      cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(q[0],q[1]);cx.stroke();lx=q[0];ly=q[1];trazo=true;cv.classList.add('trazada')});
    const fin=()=>{if(!dib)return;dib=false;if(!trazo||!state.firma)return;
      try{state.firma[cv.dataset.pad]=cv.toDataURL('image/png')}catch(e){}
      const b=document.getElementById('btnFirmaGuardar');if(b)b.disabled=false;};
    cv.addEventListener('pointerup',fin);cv.addEventListener('pointercancel',fin);cv.addEventListener('pointerleave',fin);
  });
}
async function guardarFirmas(){
  const f=state.firma;if(!f)return;
  const a=state.auditorias.find(x=>x.id===f.id);if(!a){toast('Esa auditoría ya no existe');return}
  if(!f.auditor&&!f.auditado){toast('Falta firmar: pasá el dedo o el mouse por el recuadro');return}
  if(f.auditor&&!String(f.auditorNombre||'').trim()){toast('Poné el nombre de quien auditó');return}
  if(f.auditado&&!String(f.auditadoNombre||'').trim()){toast('Poné el nombre de quien fue auditado');return}
  const peso=(f.auditor||'').length+(f.auditado||'').length;
  if(peso>MAXB64){toast('Las firmas quedaron muy pesadas: borralas y firmá con trazos más cortos');return}
  const doc=Object.assign({},a,{
    firmaAuditor:f.auditor||'',firmaAuditado:f.auditado||'',
    firmaAuditorNombre:String(f.auditorNombre||'').trim(),firmaAuditorCargo:String(f.auditorCargo||'').trim(),
    firmaAuditadoNombre:String(f.auditadoNombre||'').trim(),firmaAuditadoCargo:String(f.auditadoCargo||'').trim(),
    firmaObs:String(f.obs||'').trim(),
    firmadoEl:new Date().toLocaleString('es-PY'),
    firmadoPor:(state.sesion&&state.sesion.nombre)||state.auditor||''
  });
  delete doc.id;
  if(!await guardarDoc(COL.au+'/'+f.id,doc))return;
  const dos=f.auditor&&f.auditado;
  toast(dos?'Auditoría firmada por las dos partes · ya podés descargar el informe':'Firma guardada: falta la otra firma');
  render();
  if(dos){const b=document.querySelector('[data-dl-exp]');if(b)b.scrollIntoView({block:'center',behavior:'smooth'})}
}

async function guardarEditAud(){
  const e=state.editAud;if(!e)return;
  if(!String(e.auditor||'').trim()){toast('Completá el nombre del auditor');return}
  const cl=state.checklists.find(c=>c.id===e.checklistId);
  const detalle=!!(cl&&e.respuestas);
  const r=detalle?calcular(cl,e.respuestas):null;
  if(detalle&&!r.evaluados&&!r.fallasB){toast('Tiene que quedar al menos un ítem calificado');return}
  const prev=state.auditorias.find(x=>x.id===e.id)||{};
  const doc=Object.assign({},prev,{
    fecha:e.fecha,auditor:String(e.auditor).trim(),tipoAuditoria:e.tipoAuditoria,estado:e.estado,
    quincena:quincenaDe(e.fecha),
    editadoPor:(state.sesion&&state.sesion.nombre)||state.auditor||'',editadoEl:new Date().toISOString()
  });
  delete doc.id;
  if(detalle){
    doc.respuestas=e.respuestas;doc.pct=r.pct;doc.fallas=r.fallas;doc.fallasB=r.fallasB;
    doc.evaluados=r.evaluados;doc.cumple=Math.max(0,r.evaluados-r.fallas);doc.total=r.total;
    doc.secciones=r.secciones.map(s=>({codigo:s.codigo,nombre:s.nombre,pct:s.pct,fallas:s.fallas,evaluados:s.evaluados,total:s.total}));
  }else{
    const p=Number(String(e.pct).replace(',','.'));
    if(!isFinite(p)||p<0||p>100){toast('El puntaje tiene que ser un número entre 0 y 100');return}
    doc.pct=Math.round(p*10)/10;
  }
  if(!await guardarDoc(COL.au+'/'+e.id,doc))return;
  let nuevos=0,bajas=0;
  if(detalle){
    const sec=sectorDe(e.sectorId)||{id:e.sectorId,nombre:e.sectorNombre,sitioId:e.sitioId,sitioNombre:e.sitioNombre};
    const mios=state.hallazgos.filter(h=>h.auditoriaId===e.id);
    const falla={};
    for(const s of (cl.secciones||[])){
      for(const it of (s.items||[])){
        const rr=(e.respuestas||{})[it.id];
        if(!rr||rr.v==null||rr.v==='na'||!esFalla(cl,rr.v))continue;
        falla[it.id]=true;
        const ya=mios.find(h=>h.itemId===it.id);
        if(ya){
          const d=(rr.obs||'').trim();
          if((ya.descripcion||'')!==d){const hd=Object.assign({},ya,{descripcion:d});delete hd.id;await guardarDoc(COL.ha+'/'+ya.id,hd)}
          continue;
        }
        const prevN=state.hallazgos.filter(h=>h.sectorId===sec.id&&h.itemId===it.id).length;
        const reinc=prevN+1;let sev=it.severidad||'menor';if(reinc>=3)sev='critico';
        const B=(it.bloque||'A')==='B';
        await guardarDoc(COL.ha+'/'+uid('h-'),{
          auditoriaId:e.id,sitioId:sec.sitioId,sitioNombre:sec.sitioNombre,sectorId:sec.id,sectorNombre:sec.nombre,
          seccionCodigo:s.codigo,seccionNombre:s.nombre,itemId:it.id,item:it.texto,
          bloque:B?'B':'A',severidad:sev,reincidencia:reinc,escalado:reinc>=3,sinFoto:!!it.sinFoto,
          descripcion:(rr.obs||'').trim(),responsable:'',area:B?(it.area||'mantenimiento'):'sector',
          fechaLimite:addDaysISO(SEV[sev].dias),estado:'abierto',causaRaiz:'',accionPreventiva:'',
          detectadoPor:String(e.auditor).trim(),fecha:e.fecha,creado:new Date().toISOString()
        });
        nuevos++;
      }
    }
    for(const h of mios){
      if(falla[h.itemId]||h.estado==='cerrado')continue;
      await borrarDoc(COL.ha+'/'+h.id);bajas++;
    }
  }
  state.editAud=null;
  toast(`Auditoría corregida · ${n1(doc.pct)}%${nuevos?` · ${nuevos} hallazgo${nuevos===1?'':'s'} nuevo${nuevos===1?'':'s'}`:''}${bajas?` · ${bajas} dado${bajas===1?'':'s'} de baja`:''}`);
  state.openAudit=e.id;state.view='auditorias';window.scrollTo(0,0);render();
}

const SLUGIFY=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function baseTipo5S(tipo){
  const cands=state.checklists.filter(c=>c.activa!==false&&!c.pilar&&!(c.sectores&&c.sectores.length)&&c.tipos&&c.tipos.indexOf(tipo)>=0&&(c.secciones||[]).length>=5);
  cands.sort((a,b)=>String(b.version||'').localeCompare(String(a.version||'')));
  return cands[0]||null;
}
function armarChecklistSector(sid){
  const def=SECTOR_5S_EXTRA[sid];if(!def)return null;
  const [nombre,tipo,resp,extra]=def;
  const base=baseTipo5S(tipo);if(!base)return null;
  const pref=sid.replace(/^s-/,'');
  const secciones=(base.secciones||[]).map(sec=>{
    const its=(sec.items||[]).map(it=>Object.assign({},it));
    let n=0;extra.filter(x=>x[0]===sec.codigo).forEach(x=>{n++;const d={id:pref+'-'+sec.codigo.toLowerCase()+'-x'+n,bloque:x[1],severidad:x[2],texto:x[3],peso:x[2]==='critico'?2:1};if(x[4])d.pilar=x[4];its.push(d)});
    return Object.assign({},sec,{items:its});
  });
  const id='c-5s-sec-'+SLUGIFY(nombre.split(' ·')[0])+'-v1';
  return {id,doc:{nombre:'5S · '+nombre+' · CAT v1.0',version:'1.0',modo:'binario',activa:true,tipos:[tipo],sectores:[sid],responsable:resp,secciones,
    creado:new Date().toISOString(),nota:'Checklist 5S propia del sector '+nombre+': base '+base.nombre+' + '+extra.length+' ítems del sector. Sirve para la auditoría interna del líder y la externa de Calidad.'}};
}
async function generarChecklistsSector(){
  if(!esAdmin()){toast('Esa parte la maneja Calidad');return}
  const secs=todosSectores();let n=0,sin=[];
  for(const sid of Object.keys(SECTOR_5S_EXTRA)){
    if(state.checklists.some(c=>c.sectores&&c.sectores.indexOf(sid)>=0))continue;
    const r=armarChecklistSector(sid);if(!r){sin.push(sid);continue}
    if(await guardarDoc(COL.cl+'/'+r.id,r.doc))n++;
  }
  toast(n?n+' checklists por sector creadas':'No había checklists por sector pendientes'+(sin.length?' · sin base de tipo: '+sin.join(', '):''));
  render();
}

/* ================= diagnóstico: por qué un sector está fallando =================
   Junta en un solo lugar lo que explica el resultado de cada sector: puntaje y en qué
   se movió, hallazgos abiertos, vencidos, críticos y reincidentes, hace cuánto que no
   se audita y qué desvío se le repite. Lo usa la vista gerencial. */
function diagnostico(){
  const auds=state.auditorias.filter(a=>validada(a)&&es5S(a));
  const ult=ultimaPorSector(auds);
  const hoy=new Date(todayISO()+'T12:00:00').getTime();
  return todosSectores().map(s=>{
    const a=ult[s.id];
    const prev=auds.filter(x=>x.sectorId===s.id&&(!a||x.id!==a.id)).sort((x,y)=>String(y.fecha).localeCompare(String(x.fecha)))[0];
    const delta=(a&&prev&&a.pct!=null&&prev.pct!=null)?Math.round((a.pct-prev.pct)*10)/10:null;
    const hs=state.hallazgos.filter(h=>h.sectorId===s.id);
    const ab=hs.filter(abierto);
    const vn=ab.filter(vencido),cr=ab.filter(h=>h.severidad==='critico');
    const rein=ab.filter(h=>(h.reincidencia||1)>=2);
    const sinAcc=ab.filter(h=>!String(h.accionCorrectiva||'').trim());
    const derivados=ab.filter(h=>(h.area||'sector')!=='sector');
    const dias=a?Math.round((hoy-new Date(String(a.fecha)+'T12:00:00').getTime())/86400000):null;
    const cnt={};ab.forEach(h=>{const k=String(h.item||'').trim();if(k)cnt[k]=(cnt[k]||0)+1});
    const top=Object.keys(cnt).map(k=>[k,cnt[k]]).sort((x,y)=>y[1]-x[1]).slice(0,3);
    const nv=nivel(a?a.pct:null);
    let riesgo=0;
    if(nv.k==='crit')riesgo+=40;else if(nv.k==='warn')riesgo+=18;else if(nv.k==='na')riesgo+=26;
    riesgo+=cr.length*12+vn.length*6+rein.length*5+Math.min(18,ab.length*1.5);
    if(dias!=null&&dias>45)riesgo+=14;else if(dias==null)riesgo+=10;
    if(delta!=null&&delta<0)riesgo+=Math.min(14,Math.abs(delta)/2);
    return {s,a,prev,delta,nv,hs:hs.length,ab:ab.length,vn:vn.length,cr:cr.length,rein:rein.length,sinAcc:sinAcc.length,der:derivados.length,dias,top,riesgo:Math.round(riesgo)};
  }).sort((x,y)=>y.riesgo-x.riesgo||String(x.s.nombre).localeCompare(String(y.s.nombre)));
}
function motivosDe(d){
  const m=[];
  if(!d.a)m.push('Todavía no tiene ninguna auditoría 5S validada.');
  else{
    if(d.nv.k==='crit')m.push(`Está en rojo: ${n1(d.a.pct)} % en la auditoría del ${fmtDate(d.a.fecha)}.`);
    else if(d.nv.k==='warn')m.push(`Está en amarillo: ${n1(d.a.pct)} % en la auditoría del ${fmtDate(d.a.fecha)}.`);
    if(d.delta!=null&&d.delta<0)m.push(`Bajó ${n1(Math.abs(d.delta))} puntos respecto de la auditoría anterior.`);
    if(d.dias!=null&&d.dias>45)m.push(`Hace ${d.dias} días que no se lo audita.`);
  }
  if(d.cr)m.push(`${d.cr} hallazgo${d.cr===1?'':'s'} crítico${d.cr===1?'':'s'} sin cerrar.`);
  if(d.vn)m.push(`${d.vn} hallazgo${d.vn===1?'':'s'} vencido${d.vn===1?'':'s'} pasada la fecha comprometida.`);
  if(d.rein)m.push(`${d.rein} desvío${d.rein===1?'':'s'} que ya se había${d.rein===1?'':'n'} corregido y volvió${d.rein===1?'':'eron'} a aparecer.`);
  if(d.sinAcc)m.push(`${d.sinAcc} hallazgo${d.sinAcc===1?'':'s'} sin acción correctiva escrita.`);
  if(d.der)m.push(`${d.der} depende${d.der===1?'':'n'} de otra área (ya derivados).`);
  if(!m.length)m.push('Sin señales de alerta: puntaje en verde y plan de acción al día.');
  return m;
}

/* ================= layouts por sector ================= */
function ultimasLayout(){
  const sit=state.sitioSel||state.f.sitio;
  const base=state.auditorias.filter(a=>validada(a)&&es5S(a)&&(!sit||sit==='all'||a.sitioId===sit));
  return {ext:ultimaPorSector(base.filter(a=>tipoAud(a)!=='interna')),int:ultimaPorSector(base.filter(a=>tipoAud(a)==='interna'))};
}
function semSector(s,U){
  const e=U.ext[s.id],i=U.int[s.id];
  const ref=e||i;const nv=nivel(ref?ref.pct:null);
  return {e,i,ref,nv,origen:e?'externa':(i?'interna':'')};
}
/* Las zonas que se ven: las que editó Calidad (config/zonas) si existen, si no las que
   vienen medidas de fábrica. Mientras se está editando manda el borrador en pantalla. */
const zonasCfg=()=>((state.zonas&&state.zonas.planos)||{});
function zonasDe(slug){const c=zonasCfg();return Array.isArray(c[slug])?c[slug]:(ZPLANO[slug]||[])}
function zonasVista(slug){
  const L=state.lay||{};
  return (L.edit===slug&&Array.isArray(L.draft))?L.draft:zonasDe(slug);
}
const editandoZonas=slug=>!!(esAdmin()&&state.lay&&state.lay.edit===slug);
const guardarZonas=cfg=>guardarDoc('config/zonas',Object.assign({},cfg,{actualizado:new Date().toISOString()}));
const r2=n=>Math.round(n*100)/100;
function zonasEdit(fn){
  const L=state.lay;if(!L||!Array.isArray(L.draft))return;
  fn(L.draft);
}
/* nombre del sector aunque todavía no esté en la estructura del sitio */
function nombreSector(id){
  const s=todosSectores().find(x=>x.id===id);if(s)return s.nombre;
  const d=SECTORES_PLANO.find(x=>x.id===id);return d?d.nombre:id;
}

/* dibuja las zonas del plano y las pinta con el color del semáforo del sector */
function capaZonas(slug,U,secs){
  const ed=editandoZonas(slug);
  const zs=zonasVista(slug);if(!zs.length&&!ed)return '';
  const map={};secs.forEach(s=>map[s.id]=s);
  /* editando se ven todas, aunque el sector no esté en la lista de esta lámina */
  let pares=zs.map((z,i)=>({z:z,i:i})).filter(p=>ed||map[p.z.sec]);
  if(!pares.length&&!ed)return '';
  /* las chicas van arriba: si no, una zona grande tapa a la de al lado y no se puede tocar */
  pares=pares.slice().sort((a,b)=>(b.z.w*b.z.h)-(a.z.w*a.z.h));
  const big={};pares.forEach(p=>{const a=p.z.w*p.z.h;if(!big[p.z.sec]||a>big[p.z.sec].a)big[p.z.sec]={a:a,i:p.i}});
  const solo=!!(state.lay&&state.lay.solo),sel=(state.lay||{}).sel,zi=(state.lay||{}).zi;
  return `<div class="zcapa">${pares.map(p=>{
    const z=p.z,s=map[z.sec],S=s?semSector(s,U):null,k=S?S.nv.k:'na';
    const nom=s?s.nombre:nombreSector(z.sec);
    const apagada=!ed&&solo&&(k==='ok'||k==='na');
    const tit=ed?`${nom} · arrastrá para moverla, tirá del cuadrito para agrandarla`
                :`${nom} · ${S.nv.l}${S.ref?' · '+n1(S.ref.pct)+'%':''}`;
    const marca=ed?(zi===p.i):(sel===z.sec);
    const et=ed?`<b>${esc(nom)}</b>`
      :((big[z.sec].i===p.i&&z.w>=9&&z.h>=4.5&&!apagada)?`<b>${esc(nom)}${S.ref?' · '+n1(S.ref.pct)+'%':''}</b>`:'');
    const attr=ed?`data-zmove="1" data-zi="${p.i}"`:`data-zsec="${z.sec}"`;
    return `<button type="button" class="zona ${k}${apagada?' off':''}${marca?' sel':''}${s?'':' hue'}" ${attr} title="${esc(tit)}" aria-label="${esc(tit)}" style="left:${z.x}%;top:${z.y}%;width:${z.w}%;height:${z.h}%">${et}${ed?'<i class="zh" data-zres="1"></i>':''}</button>`;
  }).join('')}</div>`;
}
/* barra de edición de zonas: agregar, borrar, restaurar, guardar */
function barraZonas(slug){
  const L=state.lay,zs=zonasVista(slug),z=(L.zi!=null)?zs[L.zi]:null;
  const secs=todosSectores().slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const propio=Array.isArray(zonasCfg()[slug]);
  return `<div class="zbar">
    <span class="badge warn dot">Editando zonas</span>
    <div class="field" style="margin:0"><select id="zNuevoSec" aria-label="Sector para la zona nueva">
      <option value="">Elegí el sector…</option>
      ${secs.map(s=>`<option value="${s.id}"${L.zsec===s.id?' selected':''}>${esc(s.nombre)}</option>`).join('')}</select></div>
    <button class="btn sm" id="btnZAdd">＋ Agregar zona</button>
    ${z?`<span class="soft2" style="margin:0;padding:0;border:0">Seleccionada: <b>${esc(nombreSector(z.sec))}</b></span>
      <button class="btn sm" id="btnZDel" style="color:var(--crit)">Borrar la zona seleccionada</button>`
      :'<span class="soft2" style="margin:0;padding:0;border:0">Tocá una zona para seleccionarla. Con las flechas del teclado la movés fino.</span>'}
    <span class="zsp"></span>
    <button class="btn sm" id="btnZReset" data-ck="zreset:${slug}">${state.confirmKey==='zreset:'+slug?'¿Volver a las zonas originales? Tocá de nuevo':'Restaurar originales'}</button>
    <button class="btn sm" id="btnZCancel">Cancelar</button>
    <button class="btn primary sm" id="btnZSave">Guardar zonas</button>
    ${propio?'':'<span class="soft2" style="margin:0;padding:0;border:0;width:100%">Todavía no se editó este plano: se están mostrando las zonas de fábrica.</span>'}
  </div>`;
}
function vLayouts(){
  state.lay=state.lay||{plano:'all'};
  const sit=state.sitios.find(p=>p.id===state.sitioSel)||state.sitios[0];
  const secs=todosSectores().filter(s=>!sit||s.sitioId===sit.id);
  const U=ultimasLayout();
  const faltan=sit?SECTORES_PLANO.filter(d=>!(sit.sectores||[]).some(s=>s.id===d.id||String(s.nombre).trim().toLowerCase()===d.nombre.toLowerCase())):[];

      <td class="num mono">${S.ref?n1(S.ref.pct)+'%':'—'}${S.ref?`<br><span style="color:var(--ink-3);font-size:11px">${S.origen} · ${fmtDate(S.ref.fecha)}</span>`:''}</td>
      <td class="num mono">${S.e?n1(S.e.pct)+'%<br><span style="color:var(--ink-3);font-size:11px">'+fmtDate(S.e.fecha)+'</span>':'<span style="color:var(--ink-3)">sin auditoría</span>'}</td>
      <td class="num mono">${S.i?n1(S.i.pct)+'%<br><span style="color:var(--ink-3);font-size:11px">'+fmtDate(S.i.fecha)+'</span>':'<span style="color:var(--ink-3)">sin auditoría</span>'}</td>
      <td>${s.referente?esc(s.referente):(esAdmin()?'<button class="btn ghost sm" data-go="sectores" style="padding:2px 6px">Asignar</button>':'<span class="badge warn">sin responsable</span>')}</td>
      <td class="num">${ab.length?`<span class="badge ${vn?'crit':'warn'}">${ab.length}${vn?' · '+vn+' venc.':''}</span>`:'<span class="badge ok">0</span>'}</td></tr>`};
  return `${avisoDb()}
  <div class="head"><div><h1>Layouts y semáforo 5S</h1><p>Los planos del CD sector por sector, con el color de la última auditoría 5S validada y el responsable de cada sector. El plano viene pintado: cada sector queda del color de su última auditoría, así el incumplimiento se ve en el dibujo y no hay que leer la tabla. Tocá una zona del plano y se marca la fila del sector. Verde ≥ ${VERDE} % · Amarillo ${ROJO+1}–${VERDE-1} % · Rojo ≤ ${ROJO} %.</p></div>

  <div class="grid g5" style="margin-bottom:16px">

    <div class="kpi"><div class="k">En amarillo</div><div class="v">${cnt.warn}</div></div>

  </div>
  ${faltan.length?`<div class="notice"><div><b>${faltan.length} sector${faltan.length===1?'':'es'} del plano todavía no está${faltan.length===1?'':'n'} en la estructura:</b> ${faltan.map(f=>esc(f.nombre)).join(', ')}. ${esAdmin()?'Con el botón de arriba se agregan y quedan listos para auditar (interna y externa).':'Calidad los agrega desde Sitios y sectores.'}</div></div>`:''}
  <div class="filters">

    <div class="field"><label>Qué pintar</label><label class="zsolo"><input type="checkbox" id="laySolo"${state.lay.solo?' checked':''}> Pintar solo los sectores que no cumplen</label></div>

  ${planos.map(p=>{
    const del=p.slug==='plano-general'?secs:secs.filter(s=>planosDeSector(s).indexOf(p.slug)>=0);

        ${(()=>{const dib=new Set((ZPLANO[p.slug]||[]).map(z=>z.sec));const sin=del.filter(s=>!dib.has(s.id));

document.addEventListener('pointerdown',e=>{
  const h=e.target.closest&&e.target.closest('[data-zres],[data-zmove]');if(!h)return;
  const box=h.closest('.layimg');if(!box||!box.classList.contains('zedit'))return;

  e.preventDefault();
  ZD={i:i,res:res,el:el,r:box.getBoundingClientRect(),x0:e.clientX,y0:e.clientY,z:{x:z.x,y:z.y,w:z.w,h:z.h},cur:null};
  if(state.lay.zi!==i){state.lay.zi=i;render();ZD.el=document.querySelector('.layimg.zedit [data-zi="'+i+'"]')||ZD.el}

document.addEventListener('pointermove',e=>{
  if(!ZD)return;
  const dx=(e.clientX-ZD.x0)/ZD.r.width*100,dy=(e.clientY-ZD.y0)/ZD.r.height*100;
  let x=ZD.z.x,y=ZD.z.y,w=ZD.z.w,h=ZD.z.h;
  if(ZD.res){w=Math.max(1.5,Math.min(w+dx,100-x));h=Math.max(1.5,Math.min(h+dy,100-y))}
  else{x=Math.min(Math.max(x+dx,0),100-w);y=Math.min(Math.max(y+dy,0),100-h)}
  ZD.cur={x:x,y:y,w:w,h:h};
  ZD.el.style.left=x+'%';ZD.el.style.top=y+'%';ZD.el.style.width=w+'%';ZD.el.style.height=h+'%';

});

/* ================= reconocimiento y copa entre sectores =================
   Tres cosas distintas que la gente confunde y conviene separar:
   · el PUNTAJE dice cómo está el sector hoy;
   · el AVANCE dice si mejoró respecto de la ronda anterior;
   · el CIERRE dice si se hace cargo de lo que le levantaron.
   Un sector puede estar en amarillo y ser el mejor del mes si subió 20 puntos
   y cerró todo. Por eso la copa suma las tres y no solo el puntaje. */
const CIERRE_TOPE=10;
function copa(){
  const secs=todosSectores().filter(s=>state.f.sitio==='all'||s.sitioId===state.f.sitio);
  const ext=auditoriasFiltradas();               /* externas validadas, más nueva primero */
  const filas=secs.map(sec=>{
    const suyas=ext.filter(a=>a.sectorId===sec.id);
    const ult=suyas[0]||null, prev=suyas[1]||null;
    const pct=ult&&ult.pct!=null?ult.pct:null;
    const pctPrev=prev&&prev.pct!=null?prev.pct:null;
    const avance=(pct!=null&&pctPrev!=null)?Math.round((pct-pctPrev)*10)/10:null;
    const hs=state.hallazgos.filter(h=>h.sectorId===sec.id);
    const abiertos=hs.filter(abierto).length;
    const cerrados=hs.filter(h=>h.estado==='cerrado');
    const enPlazo=cerrados.filter(cerradoEnPlazo).length;
    const cierre=Math.min(CIERRE_TOPE,enPlazo);
    const buenas=state.buenas.filter(b=>b.sectorId===sec.id).length;
    const puntos=pct==null?null:Math.round((pct+(avance||0)+cierre)*10)/10;
    /* racha: rondas seguidas en verde, de la más nueva hacia atrás */
    let racha=0;for(const a of suyas){if(a.pct!=null&&a.pct>=VERDE)racha++;else break}
    return{sec,ult,prev,pct,pctPrev,avance,abiertos,cerradas:cerrados.length,enPlazo,cierre,buenas,puntos,racha,rondas:suyas.length};
  });
  const clasificados=filas.filter(f=>f.puntos!=null).sort((a,b)=>b.puntos-a.puntos||b.pct-a.pct);
  clasificados.forEach((f,i)=>{f.pos=i+1});
  const sinDato=filas.filter(f=>f.puntos==null);
  const conAvance=clasificados.filter(f=>f.avance!=null);
  const mejorAvance=conAvance.length?conAvance.slice().sort((a,b)=>b.avance-a.avance)[0]:null;
  const hayAvance=conAvance.length>0;
  /* el destacado puede fijarse a mano: el reconocimiento no siempre es del que más puntúa */
  const fijo=(state.pantalla||{}).destacado;
  const campeon=(fijo&&clasificados.find(f=>f.sec.id===fijo))||clasificados[0]||null;
  return{filas,clasificados,sinDato,mejorAvance,hayAvance,campeon,manual:!!(fijo&&clasificados.some(f=>f.sec.id===fijo))};
}
function motivoAuto(f){
  if(!f)return '';
  const t=[];
  if(f.pct>=VERDE)t.push(`cerró la ronda en verde con ${n1(f.pct)}%`);
  else t.push(`quedó en ${n1(f.pct)}% y es el puntaje más alto del período`);
  if(f.avance!=null&&f.avance>0)t.push(`subió ${n1(f.avance)} puntos respecto de la ronda anterior`);
  if(f.enPlazo)t.push(`cerró ${f.enPlazo} hallazgo${f.enPlazo===1?'':'s'} en plazo`);
  if(f.racha>=2)t.push(`lleva ${f.racha} rondas seguidas en verde`);
  return t.join(', ')+'.';
}

  if(oper.length)slides.push({t:'Puntaje por sector · operativas',h:`<div class="tvbars">${oper.slice(0,9).map(x=>{

    return `<div class="tvbar"><b>${esc(x.s.nombre)}</b><div class="tr"><div class="fl ${nv.k}" style="width:${Math.max(1.5,x.a.pct)}%"></div></div><span class="vv" style="color:var(--${nv.k})">${n1(x.a.pct)}%</span></div>`}).join('')}</div>`});
  const acc={};R.vig.forEach(a=>(a.secciones||[]).forEach(s=>{if(s.pct==null)return;acc[s.codigo]=acc[s.codigo]||{n:s.nombre,su:0,c:0};acc[s.codigo].su+=s.pct;acc[s.codigo].c++}));

  if(ax.length)slides.push({t:'Dónde estamos flojos · por cada S',h:`<div class="tvbars">${ax.map(([c,o])=>{
    const v=o.su/o.c,nv=nivel(v);
    return `<div class="tvbar"><b>${esc(c)} · ${esc(o.n)}</b><div class="tr"><div class="fl ${nv.k}" style="width:${Math.max(1.5,v)}%"></div></div><span class="vv" style="color:var(--${nv.k})">${n1(v)}%</span></div>`}).join('')}</div>`});
  slides.push({t:'Plan de acción',h:`<div class="cards">
    <div class="card"><div class="cv" style="color:var(--crit)">${R.crit}</div><div class="ck">Críticos abiertos</div></div>
    <div class="card"><div class="cv" style="color:var(--warn)">${R.reinc}</div><div class="ck">Reincidencias</div></div>
    <div class="card"><div class="cv" style="color:var(--${R.enPlazo!=null&&R.enPlazo>=80?'ok':'warn'})">${R.enPlazo==null?'—':n0(R.enPlazo)}<small style="font-size:2vw">%</small></div><div class="ck">Cerrados en plazo</div></div>
  </div><div style="font-size:1.3vw;color:var(--ink-3);margin-top:1.5vh">${R.ab.length} hallazgos sin cerrar · ${R.ve.length} vencidos</div>`});
  if(p.foco)slides.push({t:'Foco de la semana',c:true,h:`<div class="foco">${esc(p.foco)}</div>`});
  const bs=state.buenas.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).slice(0,3);
  if(p.reconocimiento||bs.length)slides.push({t:'Lo que se hizo bien',h:`${p.reconocimiento?`<div class="recon" style="font-family:Figtree;font-weight:700;font-size:2.6vw;line-height:1.2">${esc(p.reconocimiento)}</div>`:''}
    ${bs.length?`<ul>${bs.map(b=>`<li><b>${esc(b.sectorNombre)}</b> — ${esc(b.descripcion)}</li>`).join('')}</ul>`:''}`});
  /* el lado que felicita: campeón, podio y el que más avanzó */
  const C=copa();
  if(C.campeon){
    const c=C.campeon;const nvc=nivel(c.pct);
    const motivo=(p.motivoDestacado||'').trim()||motivoAuto(c);
    slides.push({t:'Sector del mes',c:true,h:`<div class="campeon">
      <div style="font-size:3.4vw;line-height:1">🏆</div>
      <div class="nm">${esc(c.sec.nombre)}</div>
      <div class="pc" style="color:var(--${nvc.k})">${n1(c.pct)}<small style="font-size:3vw">%</small></div>
      <div class="mot">${esc(motivo)}</div></div>`});
  }
  if(C.clasificados.length>=3){
    const pod=C.clasificados.slice(0,3);
    slides.push({t:'Copa CAT · podio de la ronda',h:`<div class="podio">
      ${[pod[1],pod[0],pod[2]].map((f,i)=>{const real=i===1?0:(i===0?1:2);const nv=nivel(f.pct);
        return `<div class="pod ${real===0?'p1':''}"><div class="medal">${MEDALLA[real]}</div>
          <div class="pl">${real+1}º</div><b>${esc(f.sec.nombre)}</b>
          <div class="pp" style="color:var(--${nv.k})">${n1(f.puntos)}</div>
          <div class="ps">${n1(f.pct)}% de cumplimiento</div></div>`}).join('')}
      </div><div style="font-size:1.2vw;color:var(--ink-3);margin-top:2vh;text-align:center">Puntos = puntaje + avance + hallazgos cerrados en plazo</div>`});
    slides.push({t:'Tabla de posiciones',h:`<div class="tvbars">${C.clasificados.slice(0,8).map(f=>{
      const nv=nivel(f.pct);
      return `<div class="tvbar"><b>${f.pos<=3?MEDALLA[f.pos-1]+' ':f.pos+'. '}${esc(f.sec.nombre)}</b>
        <div class="tr"><div class="fl ${nv.k}" style="width:${Math.max(1.5,Math.min(100,f.puntos))}%"></div></div>
        <span class="vv" style="color:var(--${nv.k})">${n1(f.puntos)}</span></div>`}).join('')}</div>`});
  }
  if(C.mejorAvance&&C.mejorAvance.avance>0){
    const m=C.mejorAvance;
    slides.push({t:'El que más avanzó',c:true,h:`<div class="campeon">
      <div class="nm">${esc(m.sec.nombre)}</div>
      <div class="pc" style="color:var(--ok)">+${n1(m.avance)}</div>
      <div class="mot">Pasó de ${n1(m.pctPrev)}% a ${n1(m.pct)}% entre las dos últimas auditorías externas.</div></div>`});
  }
  const peores=oper.slice(-3).reverse().filter(x=>x.a.pct<VERDE);
  if(peores.length)slides.push({t:'Sectores que necesitan ayuda esta semana',h:`<div class="tvbars">${peores.map(x=>{
    const nv=nivel(x.a.pct),ca=criticosAbiertosDe(x.s.id);
    return `<div class="tvbar"><b>${esc(x.s.nombre)}</b><div class="tr"><div class="fl ${nv.k}" style="width:${Math.max(1.5,x.a.pct)}%"></div></div><span class="vv" style="color:var(--${nv.k})">${n1(x.a.pct)}%</span></div>`+
    (ca?`<div style="font-size:1.1vw;color:var(--crit);margin-top:-.6vh">${ca} hallazgo${ca===1?'':'s'} crítico${ca===1?'':'s'} abierto${ca===1?'':'s'}</div>`:'')}).join('')}</div>`});
  return slides.length?slides:[{t:'CAT 5S',h:'<div class="foco">Todavía no hay datos cargados.</div>'}];
}
function renderTV(){
  const slides=tvSlides();
  if(state.tv.i>=slides.length)state.tv.i=0;
  const s=slides[state.tv.i];
  const seg=Number((state.pantalla||{}).segundos||18);
  $('#app').style.display='none';
  $('#tvroot').innerHTML=`<div class="tv">
    <div class="tvhead"><div class="l"><div class="mk" style="background:transparent;padding:4px"><img src="${LOGO}" alt="CAT"></div><h2>Calidad Ante Todo · 5S</h2></div>
      <div class="r">Centro de Distribución<br>${fmtDate(todayISO())}</div></div>
    <div class="slide${s.c?' center':''}"><h3>${esc(s.t)}</h3>${s.h}</div>
    <div class="tvfoot"><span>${state.tv.pausa?'En pausa · barra espaciadora para seguir':'Rota cada '+seg+' s · espacio pausa · Esc sale'}</span>
      <span class="dots">${slides.map((_,i)=>`<i class="${i===state.tv.i?'on':''}"></i>`).join('')}</span>
      <button class="btn ghost sm" id="btnTvExit">Salir ✕</button></div>
  </div>`;
  clearTimeout(state.tv.timer);
  if(!state.tv.pausa)state.tv.timer=setTimeout(()=>{state.tv.i=(state.tv.i+1)%slides.length;renderTV()},seg*1000);
}
function tvOn(){state.tv.on=true;state.tv.i=0;state.tv.pausa=false;render()}
function tvOff(){state.tv.on=false;clearTimeout(state.tv.timer);render()}

const MANUAL=[
 {t:'Objetivo del sistema',c:`<p>El sistema CAT convierte cada desvío detectado en una <b>acción con responsable y fecha</b>, y mantiene el registro hasta su cierre. El puntaje es el resultado de ese proceso.</p>
 <p>Ciclo de trabajo:</p><ol><li>Auditar el sector.</li><li>Cada "no cumple" genera un hallazgo con severidad y plazo.</li><li>Asignar responsable y cerrar.</li><li>Publicar resultados: tablero del sector y pantalla del CD.</li></ol>`},
 {t:'Reglas de evaluación',c:`<ul>
 <li><b>Un desvío observado = no cumple.</b> Criterio binario; elimina la subjetividad del auditor.</li>
 <li><b>Bloque A puntúa; bloque B no.</b> Bloque A: lo que el sector controla (orden, limpieza, lugar definido, disciplina). Bloque B: infraestructura y recursos (mobiliario, basureros, señalética). El bloque B se registra con responsable y fecha, se deriva a Mantenimiento o Compras y <b>no afecta el puntaje del sector</b>.</li>
 <li><b>Reincidencia.</b> Segunda ocurrencia del mismo ítem en el mismo sector: causa raíz obligatoria. Tercera ocurrencia: el sistema eleva la severidad a crítico.</li></ul>`},
 {t:'Auditoría interna quincenal',c:`<p>Cruzada y rotativa entre sectores. <b>No puntúa para el resultado oficial</b>: mide participación y calibra el criterio.</p>
 <ol><li>Ingresar desde el celular a <b>5S → Auditar</b>.</li>
 <li>Verificar el nombre en el campo <b>Auditor</b>.</li>
 <li>Seleccionar tipo <b>Interna</b> y el sector asignado.</li>

 {t:'Auditoría externa oficial',c:`<p>Mensual, no anunciada. Es la que puntúa. La administra Calidad.</p>

 <p>Opciones adicionales:</p>

 {t:'Validación (Calidad)',c:`<p>Las auditorías cargadas por el equipo ingresan a <b>Por validar</b>. Su puntaje <b>no se computa</b> en tablero, resumen ni pantalla hasta ser validado.</p>

 {t:'Plan de acción',c:`<p><b>5S → Plan de acción</b> lista los hallazgos abiertos por urgencia: vencidos primero, luego críticos.</p>

 {t:'Informe de auditoría',c:`<p>Al guardar, el sistema genera el informe (ejemplo: <b>"Auditoría interna · Boston · 08/09/2026"</b>): puntaje y categoría, resultado por S, hallazgos con severidad, responsable y vencimiento, fotos con descripción, adjuntos, detalle ítem por ítem y firmas de auditor y líder 5S.</p>

 {t:'Expedientes y evidencia',c:`<p>Cada auditoría queda en <b>Auditorías realizadas</b> como expediente.</p>
