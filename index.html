:root{
  --ground:#F7F5EF; --surface:#FFFFFF; --surface-2:#F1EFE6; --surface-3:#E6E3D7;
  --line:#E1DDD0; --line-strong:#C5BFAE;
  --ink:#153731; --ink-2:#41615A; --ink-3:#7B8E87;
  --accent:#0E4B43; --accent-2:#0A3A33; --accent-soft:#DEEDE8;
  --coral:#DC7455; --coral-soft:#FBE7DF;
  --ok:#2E7D57; --ok-soft:#E1F1E8;
  --warn:#B07406; --warn-soft:#FBEED9;
  --crit:#C0483A; --crit-soft:#FBE5E0;
  --hazard:#DFA33C;
  --seq-1:#DCE9E4; --seq-2:#AFCFC6; --seq-3:#78B0A3; --seq-4:#3F8578; --seq-5:#12564C;
  --shadow:0 1px 2px rgba(21,55,49,.04), 0 12px 32px -18px rgba(21,55,49,.24);
  --radius:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E2A26; --surface:#143830; --surface-2:#1B443B; --surface-3:#245046;
    --line:#275147; --line-strong:#3D6C60;
    --ink:#F4EBD8; --ink-2:#C4D6CE; --ink-3:#8DA79F;
    --accent:#74D6C0; --accent-2:#A8E7D8; --accent-soft:#1B443B;
    --coral:#EE9376; --coral-soft:#3A2620;
    --ok:#63C08C; --ok-soft:#16342A;
    --warn:#DDAB4E; --warn-soft:#332A15;
    --crit:#EC8570; --crit-soft:#3A211C;
    --hazard:#DFA33C;
    --seq-1:#1F3F39; --seq-2:#2D5C53; --seq-3:#3F8577; --seq-4:#59AC98; --seq-5:#7BD1BB;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 34px -20px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E2A26; --surface:#143830; --surface-2:#1B443B; --surface-3:#245046;
  --line:#275147; --line-strong:#3D6C60;
  --ink:#F4EBD8; --ink-2:#C4D6CE; --ink-3:#8DA79F;
  --accent:#74D6C0; --accent-2:#A8E7D8; --accent-soft:#1B443B;
  --coral:#EE9376; --coral-soft:#3A2620;
  --ok:#63C08C; --ok-soft:#16342A;
  --warn:#DDAB4E; --warn-soft:#332A15;

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Figtree,sans-serif; margin:0; text-wrap:balance; letter-spacing:-.01em}
h1,.serif{font-family:"Cormorant Garamond",Georgia,serif; font-weight:600; letter-spacing:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

.app{display:grid; grid-template-columns:238px 1fr; min-height:100vh}
.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:2px; padding:18px 12px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:4px 8px 16px}
.brand .mark{width:40px;height:40px;flex:none;display:grid;place-items:center}
.brand .mark img{width:100%;height:100%;object-fit:contain;display:block}
.tv .tvhead .mk img{width:100%;height:100%;object-fit:contain;display:block}
.brand b{font-family:Figtree;font-weight:700;font-size:15px;display:block;line-height:1.15}
.brand span{font-size:10.5px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.navlabel{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:14px 8px 6px;font-weight:600}
.nav{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:8px;
  background:transparent;cursor:pointer;text-align:left;font-weight:500;color:var(--ink-2);
}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="true"]{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav svg{flex:none;opacity:.9}
.nav .badge{margin-left:auto}
.railfoot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3)}
.railfoot label{display:block;margin-bottom:4px}
.railfoot input{
  width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);font-size:12px
}

main{min-width:0;padding:22px 26px 60px;max-width:1340px}
.head{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.head h1{font-size:34px;font-weight:600;line-height:1.1}
.head p{margin:4px 0 0;color:var(--ink-3);font-size:13px;max-width:66ch}
.headbtns{display:flex;gap:8px;flex-wrap:wrap}

.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;
  background:var(--surface-3);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap
}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.a{background:var(--accent-soft);color:var(--accent-2)}
.badge.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.out{background:transparent;border:1px solid currentColor}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:8px;border:1px solid var(--line-strong);
  background:var(--surface);cursor:pointer;font-weight:500;transition:background .12s
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
select,input[type=text],input[type=date],textarea{
  padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--surface);width:100%
}
textarea{resize:vertical;min-height:52px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px}
.filters .field{min-width:168px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel>header h3{font-size:14px;font-weight:600}
.panel>header .sub{font-size:11.5px;color:var(--ink-3);text-align:right}
.panel .body{padding:16px}
.grid{display:grid;gap:14px}
.grid.start{align-items:start}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1150px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3{grid-template-columns:1fr}}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.kpi .v{font-weight:800;font-size:35px;line-height:1.05;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .v small{font-size:16px;font-weight:700;color:var(--ink-3)}
.kpi .m{margin-top:7px;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi.tint{background:var(--coral-soft);border-color:color-mix(in srgb,var(--coral) 32%,transparent)}
.kpi.tint .v{color:var(--crit)}
.kpi.tintok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}

.kpi.alert{border-color:color-mix(in srgb,var(--hazard) 60%,var(--line))}
.kpi.alert::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:repeating-linear-gradient(135deg,var(--hazard) 0 7px,transparent 7px 14px)}

/* módulos: acceso rápido tipo Suite Retail */
.mods{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:1100px){.mods{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.mods{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mod{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center;transition:transform .12s,box-shadow .12s;
  box-shadow:var(--shadow);position:relative
}
.mod:hover{transform:translateY(-2px);box-shadow:0 6px 14px -6px rgba(21,55,49,.28)}
.mod .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.mod b{font-size:12.5px;font-weight:600;line-height:1.25}
.mod .pill{position:absolute;top:9px;right:9px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--crit);color:#fff}
.secTitle{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:22px;margin:26px 0 12px}
.soft2{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--ink-3)}
.money{font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rowline{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rowline:last-child{border-bottom:0}
.rowline b{font-variant-numeric:tabular-nums}
.exec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}

/* ---------- expedientes: fotos y adjuntos ---------- */
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.foto{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.foto img{width:100%;height:180px;object-fit:cover;display:block;cursor:zoom-in;background:var(--surface-3)}
.foto figcaption{padding:10px;display:flex;flex-direction:column;gap:8px}
.foto figcaption input{font-size:12.5px;padding:6px 8px}

/* ---------- interactividad ---------- */
.kpi[data-jump]{cursor:pointer;transition:transform .12s,box-shadow .12s}
.kpi[data-jump]:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(21,55,49,.3)}
.kpi[data-jump]::after{content:"→";position:absolute;right:14px;bottom:12px;color:var(--ink-3);font-weight:700;opacity:0;transition:opacity .12s}
.kpi[data-jump]:hover::after{opacity:1}
.bar[data-secjump]{cursor:pointer;border-radius:8px;padding:4px 6px;margin:-4px -6px;transition:background .12s}
.bar[data-secjump]:hover{background:var(--surface-2)}
.help{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-3);font-size:12px;font-weight:700;cursor:help;display:inline-grid;place-items:center;vertical-align:middle;margin-left:6px}
.help:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- tour guiado ---------- */
.tour{position:fixed;inset:0;z-index:130;background:rgba(10,33,29,.72);display:grid;place-items:center;padding:24px}
.tourcard{background:var(--surface);border-radius:22px;max-width:520px;width:100%;padding:28px;box-shadow:0 30px 70px -24px rgba(0,0,0,.6)}
.tourcard .tn{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;color:var(--coral);text-transform:uppercase}
.tourcard h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:30px;margin:8px 0 10px;line-height:1.1}
.tourcard p{margin:0 0 12px;color:var(--ink-2);font-size:14.5px;line-height:1.6}
.tourcard .tic{width:54px;height:54px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:16px}
.tourdots{display:flex;gap:6px;margin:18px 0}
.tourdots i{width:26px;height:4px;border-radius:99px;background:var(--surface-3)}
.tourdots i.on{background:var(--accent)}
.tourbtns{display:flex;gap:8px;flex-wrap:wrap}
.tourbtns .btn{min-height:42px}

/* ---------- manual ---------- */
.acc{border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.acc>button{width:100%;display:flex;align-items:center;gap:12px;padding:15px 18px;background:transparent;border:0;cursor:pointer;text-align:left;font-size:15px;font-weight:600}
.acc>button:hover{background:var(--surface-2)}
.acc>button .num2{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.acc>button .cx{margin-left:auto;color:var(--ink-3);font-size:18px;transition:transform .15s}
.acc[open-acc] > button .cx{transform:rotate(45deg)}
.accbody{padding:0 18px 18px 56px;font-size:14px;color:var(--ink-2);line-height:1.65}
.accbody ol,.accbody ul{margin:8px 0 12px;padding-left:20px}
.accbody li{margin-bottom:6px}
.accbody b{color:var(--ink)}
.rolecard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.rolecard h4{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;font-weight:600;margin-bottom:4px}
.rolecard .rw{font-size:12px;color:var(--coral);font-weight:700;letter-spacing:.08em;text-transform:uppercase}

.rolecard li{margin-bottom:5px}
.foto .fm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--ink-3)}
/* ---------- informe de auditoría: pensado para imprimir ---------- */
.inf{max-width:900px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:34px 38px;box-shadow:var(--shadow)}
.inf .ih{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--accent);padding-bottom:18px;margin-bottom:22px;flex-wrap:wrap}

.inf .ik div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.inf .ik b{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.inf .ik span{font-size:11px;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase;font-weight:700}

.inf .fotoinf{break-inside:avoid;page-break-inside:avoid;margin-bottom:18px}
.inf .fotoinf img{width:100%;max-width:420px;border-radius:10px;border:1px solid var(--line);display:block}
.inf .fotoinf figcaption{font-size:13px;color:var(--ink-2);margin-top:7px;max-width:520px}

.inf .firma{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.inf .firma div{border-top:1px solid var(--ink-3);padding-top:8px;font-size:12.5px;color:var(--ink-3)}
.infbar{max-width:900px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
@media print{
  .rail,.infbar,.notice,#tvroot,#lbroot{display:none!important}
  .app{display:block}
  main{padding:0;max-width:none}
  body{background:#fff}
  .inf{border:0;box-shadow:none;border-radius:0;padding:0;max-width:none}
  .inf .fotoinf img{max-width:300px}
}

.upm{position:fixed;inset:0;z-index:125;background:rgba(10,33,29,.8);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}

.lb{position:fixed;inset:0;z-index:120;background:rgba(10,33,29,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:var(--shadow);margin:16px 0}

.bigopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}

.bigopt{
  display:flex;align-items:center;justify-content:center;gap:10px;min-height:72px;border-radius:16px;
  border:2px solid var(--line);background:var(--surface);cursor:pointer;font-size:17px;font-weight:700;color:var(--ink-2);

}
.bigopt:hover{transform:translateY(-1px)}

.bigopt.no{border-color:color-mix(in srgb,var(--crit) 45%,var(--line))}

.obsbox{margin-top:16px}

.pnav{display:flex;gap:10px;margin-top:18px}

  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left;
  box-shadow:var(--shadow);transition:transform .1s;display:flex;flex-direction:column;gap:8px
}

.bars{display:flex;flex-direction:column;gap:11px}

.bar .top .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-weight:500}
.track{height:9px;background:var(--surface-3);border-radius:0 5px 5px 0;position:relative}

.fill.ok{background:var(--ok)}.fill.warn{background:var(--warn)}.fill.crit{background:var(--crit)}.fill.na{background:var(--surface-3)}

.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--ground);padding:7px 9px;border-radius:7px;font-size:12px;max-width:260px;box-shadow:var(--shadow);line-height:1.35}
.tip b{color:var(--surface)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--radius);background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);margin-bottom:16px;font-size:13px}
.notice.info{background:var(--accent-soft);color:var(--accent-2);border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);font-weight:500}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---------- modo pantalla (televisor) ---------- */
.tv{
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;padding:3.2vh 3.6vw;
  /* la pantalla del pasillo va siempre en la identidad oscura: se lee mejor a distancia */
  --ground:#0E2A26; --surface:#16382F; --surface-2:#1D453C; --surface-3:#265146;
  --line:#2C574C; --ink:#F5ECDA; --ink-2:#C6D8D0; --ink-3:#95AFA7;
  --accent:#7BD9C3; --ok:#68C692; --warn:#E2B257; --crit:#F09077; --coral:#EE9376;
  background:#0E2A26; color:#F5ECDA;
}
.tv .slide.center{align-items:center;text-align:center}
.tv .meter{width:46vw;height:1.6vh;background:#265146;border-radius:99px;overflow:hidden;margin-top:1vh}
.tv .meter i{display:block;height:100%;border-radius:99px}
.tv .tvhead{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:2px solid var(--line);padding-bottom:1.6vh}
.tv .tvhead .l{display:flex;align-items:center;gap:14px}
.tv .tvhead .mk{width:3.2vw;height:3.2vw;min-width:42px;min-height:42px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:Figtree;font-weight:800;font-size:1.3vw}
.tv h2{font-family:Figtree;font-weight:800;font-size:2.1vw;letter-spacing:-.02em}
.tv .tvhead .r{text-align:right;color:var(--ink-3);font-size:1.05vw;font-family:"IBM Plex Mono",monospace}
.tv .slide{flex:1;display:flex;flex-direction:column;justify-content:center;gap:1.6vh;padding:2vh 0;min-height:0}
.tv .slide h3{font-family:Figtree;font-weight:700;font-size:1.5vw;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.tv .huge{font-family:Figtree;font-weight:800;font-size:10vw;line-height:.95;font-variant-numeric:tabular-nums}
.tv .huge small{font-size:3.4vw;color:var(--ink-3)}
.tv .tvbars{display:flex;flex-direction:column;gap:1.5vh}
.tv .tvbar{display:grid;grid-template-columns:22vw 1fr 6vw;gap:1.4vw;align-items:center;font-size:1.35vw}
.tv .tvbar b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tv .tvbar .tr{height:2.2vh;background:var(--surface-3);border-radius:0 6px 6px 0;position:relative}
.tv .tvbar .fl{height:100%;border-radius:0 5px 5px 0}
.tv .tvbar .vv{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
.tv .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw}
.tv .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2.4vh 1.8vw}
.tv .card .cv{font-family:Figtree;font-weight:800;font-size:5vw;line-height:1;font-variant-numeric:tabular-nums}
.tv .card .ck{font-size:1.05vw;color:var(--ink-3);letter-spacing:.07em;text-transform:uppercase;font-weight:600;margin-top:.8vh}
.tv .foco{font-family:Figtree;font-weight:700;font-size:3.6vw;line-height:1.15;text-wrap:balance}
.tv .recon{font-size:1.7vw;line-height:1.5;max-width:60ch}
.tv .tvfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);padding-top:1.4vh;color:var(--ink-3);font-size:.95vw}
.tv .dots{display:flex;gap:7px}
.tv .dots i{width:8px;height:8px;border-radius:50%;background:var(--surface-3);display:block}
.tv .dots i.on{background:var(--accent)}
.tv .tvexit{position:absolute;top:1.4vh;right:1.4vw;z-index:2}
.tv ul{margin:0;padding-left:1.4em;font-size:1.4vw;line-height:1.7}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{
    position:sticky;top:0;z-index:20;height:auto;flex-direction:row;flex-wrap:nowrap;align-items:center;
    border-right:0;border-bottom:1px solid var(--line);gap:6px;overflow-x:auto;overflow-y:hidden;padding:10px 12px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none
  }
  .rail::-webkit-scrollbar{display:none}
  .brand{padding:0 10px 0 2px;flex:none}
  .brand div:last-child{display:none}
  .navlabel{display:none}
  .nav{width:auto;padding:7px 12px;flex:none;white-space:nowrap;border:1px solid var(--line);border-radius:99px}
  .railfoot{flex:none;border-top:0;padding:0 0 0 8px;min-width:170px}
  .railfoot label{display:none}
  main{padding:16px 14px 50px}
  .tv h2,.tv .tvbar,.tv .card .ck,.tv .tvhead .r{font-size:15px}
  .tv .huge{font-size:22vw}.tv .foco{font-size:8vw}.tv .recon{font-size:16px}
  .tv .tvbar{grid-template-columns:34vw 1fr 14vw}
  .tv .cards{grid-template-columns:1fr}
  .tv .card .cv{font-size:14vw}
}

/* ================= pantalla de entrada ================= */
.gate{position:fixed;inset:0;z-index:200;overflow:auto;display:flex;align-items:flex-start;justify-content:center;
  background:radial-gradient(1100px 620px at 50% -10%,#1d5c46 0%,#124334 46%,#0d3227 100%)}
.gate::before,.gate::after{content:'';position:absolute;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 10 L36 32 L14 54' fill='none' stroke='%23F6D901' stroke-width='11' stroke-linecap='square'/%3E%3C/svg%3E");
  background-size:64px 64px;background-repeat:repeat}
.gate::before{top:-14px;right:-14px;width:256px;height:256px;opacity:.11}
.gate::after{bottom:-14px;left:-14px;width:200px;height:200px;opacity:.07;transform:rotate(180deg)}
.gate .gin{position:relative;width:100%;max-width:452px;padding:52px 20px 34px;text-align:center}
.gate .lock{width:132px;height:132px;margin:0 auto;background:#fff;border-radius:22px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 18px 44px rgba(0,0,0,.26)}
.gate .lock img{width:96px;height:auto;display:block}
.gate h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;color:#fff;
  font-size:clamp(30px,7vw,42px);line-height:1.08;margin:22px 0 0;letter-spacing:-.01em}
.gate .gsub{color:#F6D901;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;margin-top:9px}
.gate .rule{width:96px;height:5px;border-radius:3px;background:#F6D901;margin:16px auto 0}
.gate .gcard{background:#fff;border-radius:16px;padding:24px 22px;margin-top:30px;text-align:left;
  box-shadow:0 22px 54px rgba(0,0,0,.24)}
.gate .gcard h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;color:#124334;margin:0;font-weight:700}
.gate .gcard .gp{color:#5d6b63;font-size:13.5px;margin:5px 0 18px;line-height:1.5}
.gate .gf{margin-bottom:14px}
.gate .gf label{display:block;font-size:12.5px;font-weight:600;color:#2b3a33;margin-bottom:6px}
.gate .gf input,.gate .gf select{width:100%;padding:11px 12px;border:1px solid #cfd8d3;border-radius:9px;
  font:inherit;font-size:14.5px;color:#16241e;background:#fff;box-sizing:border-box}
.gate .gf input:focus,.gate .gf select:focus{outline:2px solid #1d5c46;outline-offset:-1px;border-color:#1d5c46}
.gate .gf .hint{font-size:12px;color:#6d7a73;margin-top:6px;line-height:1.45}
.gate .gbtn{width:100%;padding:13px;border:0;border-radius:9px;background:#124334;color:#fff;
  font:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.gate .gbtn:hover{background:#1d5c46}
.gate .gerr{background:#fdeceb;border:1px solid #f3c7c2;color:#9e2b1c;border-radius:9px;
  padding:10px 12px;font-size:13px;margin-bottom:14px;line-height:1.45}
.gate .gnote{border-top:1px solid #e6ece9;margin-top:20px;padding-top:16px;font-size:12.5px;color:#6d7a73;line-height:1.55}
.gate .gfoot{color:rgba(255,255,255,.62);font-size:12.5px;margin-top:24px}
.gate .roles{display:grid;gap:8px;margin-bottom:14px}
.gate .rolopt{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid #cfd8d3;
  border-radius:10px;cursor:pointer;background:#fff;text-align:left;font:inherit;width:100%}
.gate .rolopt:hover{border-color:#1d5c46;background:#f6faf8}
.gate .rolopt[aria-pressed="true"]{border-color:#124334;background:#eef5f1;box-shadow:inset 0 0 0 1px #124334}
.gate .rolopt .rd{width:16px;height:16px;border-radius:50%;border:1.5px solid #a9b7b0;flex:0 0 auto;margin-top:2px}
.gate .rolopt[aria-pressed="true"] .rd{border-color:#124334;background:radial-gradient(circle,#124334 42%,#fff 46%)}
.gate .rolopt b{display:block;font-size:14px;color:#16241e;font-weight:600}
.gate .rolopt span{display:block;font-size:12.5px;color:#6d7a73;line-height:1.45;margin-top:2px}
.railfoot .who b{display:block;font-size:13px;color:var(--ink);font-weight:600;line-height:1.3}
.railfoot .who i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);margin:2px 0 9px}
</style>

<script>
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const todayISO=()=>iso(new Date());
const addDaysISO=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const fmtDate=d=>{if(!d)return '—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d};
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
const fmtMes=k=>{const[y,m]=k.split('-');return `${MESES[+m-1]} ${y.slice(2)}`};
const n1=v=>v==null?'—':(Math.round(v*10)/10).toLocaleString('es-PY',{minimumFractionDigits:1,maximumFractionDigits:1});
const n0=v=>v==null?'—':String(Math.round(v));

const VERDE=75, ROJO=50;
function nivel(p){
  if(p==null)return{k:'na',l:'Sin dato'};
  if(p>=VERDE)return{k:'ok',l:'Verde'};
  if(p>ROJO)return{k:'warn',l:'Amarillo'};
  return{k:'crit',l:'Rojo'};
}
/* consolidado ponderado: cumple / evaluados, como en la planilla de auditoría */
function pooled(list){
  const con=list.filter(a=>Number(a.evaluados)>0&&a.cumple!=null);
  if(con.length===list.length&&con.length){
    const c=con.reduce((s,a)=>s+Number(a.cumple),0),e=con.reduce((s,a)=>s+Number(a.evaluados),0);
    return e?Math.round(c/e*1000)/10:null;
  }
  const v=list.filter(a=>a.pct!=null);
  return v.length?Math.round(v.reduce((s,a)=>s+a.pct,0)/v.length*10)/10:null;
}
const SEV={critico:{l:'Crítico',dias:3,k:'crit'},mayor:{l:'Mayor',dias:15,k:'warn'},menor:{l:'Menor',dias:30,k:''}};
const ESTADOS=[{v:'abierto',l:'Abierto'},{v:'proceso',l:'En proceso'},{v:'cerrado',l:'Cerrado'}];
const TIPOAUD=[
  {v:'externa',l:'Externa · oficial (Calidad)',d:'Mensual, no anunciada. Es la que puntúa.'},
  {v:'interna',l:'Interna · cruzada quincenal',d:'Entre sectores, rotativa. No puntúa: mide participación y calibración.'}
];
const tipoAud=a=>{const t=a&&a.tipoAuditoria;if(t==='auto')return 'interna';if(t==='oficial')return 'externa';return t||'externa'};
const labelTipo=a=>{const t=tipoAud(a);return t==='importada'?'Importada':(t==='interna'?'Interna':'Externa')};
const IMPD={costoHora:0,minBusqueda:0,diasMes:24,minCharla:5,turnos:2,

function localDb(){
  const KEY='cat5s.store';
  let S={};
  try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
  if(!S||!Object.keys(S).length){S=JSON.parse(JSON.stringify(SEMILLA||{}))}
  const subs=[];
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Este navegador se quedó sin espacio: exportá el respaldo y quitá fotos viejas')}};
  const fire=()=>subs.forEach(f=>f());
  save();
  return {
    esLocal:true,
    exportar:()=>JSON.stringify({app:'CAT 5S',version:1,exportado:new Date().toISOString(),datos:S},null,1),
    importar:(txt)=>{
      const o=JSON.parse(txt);const d=(o&&o.datos)?o.datos:o;
      if(!d||typeof d!=='object')throw new Error('formato');
      S=d;save();fire();return Object.keys(d).length;
    },
    doc:p=>({path:p,id:p.split('/').pop(),
      get:async()=>({exists:p in S,id:p.split('/').pop(),data:()=>S[p],metadata:{}}),
      set:async d=>{S[p]=d;save();fire()},
      update:async d=>{S[p]=Object.assign({},S[p]||{},d);save();fire()},
      delete:async()=>{delete S[p];save();fire()},
      onSnapshot:(next)=>{const f=()=>next({exists:p in S,id:p.split('/').pop(),data:()=>S[p],metadata:{}});subs.push(f);f();return()=>{}},
      collection:()=>null}),
    collection:c=>({path:c,
      onSnapshot:(next)=>{const f=()=>{
        const docs=Object.keys(S).filter(k=>k.indexOf(c+'/')===0&&k.slice(c.length+1).indexOf('/')<0)
          .map(k=>({id:k.slice(c.length+1),exists:true,data:()=>S[k],metadata:{}}));
        next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}})};subs.push(f);f();return()=>{}},
      doc:()=>null})
  };
}

const COL={cl:'checklists',au:'auditorias',ha:'hallazgos',bu:'buenas',ev:'evidencias'};
/* límite por documento de la base: dejamos margen para los metadatos */
const MAXB64=180*1024;
async function conectar(){
  let db=null;
  try{db=(typeof claude!=='undefined'&&claude.use)?await claude.use('db'):null}catch(e){db=null}
  if(!db){try{db=localDb();state.local=true}catch(e){db=null}}
  state.db=db;state.dbTried=true;
  if(!db){render();return}
  db.doc('config/estructura').onSnapshot(s=>{
    const d=s.exists?s.data():null;
    state.sitios=(d&&Array.isArray(d.sitios))?d.sitios:((d&&Array.isArray(d.plantas))?d.plantas:[]);
    state.loaded.est=true;render();
  },()=>{state.loaded.est=true;render()});
  db.doc('config/pantalla').onSnapshot(s=>{
    state.pantalla=s.exists?s.data():{};state.loaded.pa=true;render();
  },()=>{state.loaded.pa=true;render()});
  db.doc('config/acceso').onSnapshot(s=>{
    state.acceso=s.exists?s.data():null;state.loaded.ac=true;render();
  },()=>{state.acceso=null;state.loaded.ac=true;render()});
  db.doc('config/impacto').onSnapshot(s=>{
    state.impacto=Object.assign({},IMPD,s.exists?s.data():{});state.loaded.im=true;render();
  },()=>{state.loaded.im=true;render()});
  const sub=(col,key,lk)=>db.collection(col).onSnapshot(s=>{
    state[key]=s.docs.map(d=>Object.assign({id:d.id},d.data()));
    state.loaded[lk]=true;render();
  },()=>{state.loaded[lk]=true;render()});
  sub('claves','claves','cv');
  sub(COL.cl,'checklists','cl');sub(COL.au,'auditorias','au');sub(COL.ha,'hallazgos','ha');sub(COL.bu,'buenas','bu');sub(COL.ev,'evidencias','ev');
}
async function guardarDoc(path,data){
  if(!state.db){toast('Sin almacenamiento: el cambio no se guardó');return false}
  try{await state.db.doc(path).set(data);return true}
  catch(e){
    const cfg=/^(config|checklists)\//.test(path);
    if(cfg&&e&&e.code==='invalid_argument')toast('Esta parte solo la puede cambiar Calidad. Pedí el cambio y seguí trabajando normalmente.');
    else if(e&&e.code==='quota_exceeded')toast('La base llegó al límite: descargá expedientes viejos y quitá sus fotos');
    else toast('No se pudo guardar: '+(e&&e.message?e.message:'error'));
    return false;
  }
}
async function borrarDoc(path){
  if(!state.db)return false;
  try{await state.db.doc(path).delete();return true}catch(e){toast('No se pudo eliminar');return false}
}

/* ================= cálculo ================= */
const maxItem=cl=>(cl&&cl.modo==='escala')?4:1;
const esFalla=(cl,v)=>(cl&&cl.modo==='escala')?Number(v)<=1:Number(v)===0;

function calcular(cl,resp){
  resp=resp||{};
  const M=maxItem(cl);
  let G=0,MX=0,FA=0,FB=0,EV=0,TOT=0;
  const secciones=(cl.secciones||[]).map(sec=>{
    let g=0,m=0,f=0,ev=0,tot=0;
    (sec.items||[]).forEach(it=>{
      const esA=(it.bloque||'A')==='A';
      if(esA)tot++;TOT+=esA?1:0;
      const r=resp[it.id];
      if(!r||r.v==null||r.v==='na')return;
      const peso=Number(it.peso)||1,v=Number(r.v);
      if(esA){g+=v*peso;m+=M*peso;ev++;if(esFalla(cl,v))f++}
      else if(esFalla(cl,v))FB++;
    });
    G+=g;MX+=m;FA+=f;EV+=ev;
    return{codigo:sec.codigo,nombre:sec.nombre,jp:sec.jp||'',pct:m?Math.round(g/m*1000)/10:null,fallas:f,evaluados:ev,total:tot};
  });

/* rotación de auditoría cruzada quincenal: round-robin sobre los sectores activos */
const Q0='2026-09-01';
function quincenaDe(fecha){
  const d=(new Date(String(fecha).slice(0,10)+'T12:00:00')-new Date(Q0+'T12:00:00'))/86400000;
  return Math.max(0,Math.floor(d/15));
}
function rotacion(q){
  const secs=todosSectores().filter(s=>state.f.sitio==='all'||s.sitioId===state.f.sitio);
  const n=secs.length;if(n<2)return [];
  return secs.map((s,i)=>({audita:s,auditado:secs[(i+1+((q%(n-1))+(n-1))%(n-1))%n]}))
    .filter(p=>p.audita.id!==p.auditado.id);
}
function fechaQuincena(q){
  const d=new Date(Q0+'T12:00:00');d.setDate(d.getDate()+q*15);return iso(d);
}

/* la clave se guarda cifrada: nunca se escribe en claro en la base */
async function hashesDe(clave){
  const t='cat5s·'+String(clave);
  const out=[];
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
    out.push('s:'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''));
  }catch(e){}
  let h=5381,g=52711;
  for(let i=0;i<t.length;i++){h=((h<<5)+h+t.charCodeAt(i))|0;g=((g<<5)^(g>>2)^t.charCodeAt(i))|0}
  out.push('f:'+(h>>>0).toString(36)+'-'+(g>>>0).toString(36));
  return out;
}

async function entrarGate(){
  const d=String(($('#gDest')||{}).value||'');
  const nombre=String(($('#gNombre')||{}).value||'').trim();
  const clave=String(($('#gClave')||{}).value||'');
  if(!d){state.gateErr='Elegí tu sector o Calidad · administración.';render();return}
  if(nombre.length<4){state.gateErr='Escribí tu nombre y apellido completos.';render();return}
  if(!clave){state.gateErr='Poné tu clave. La primera vez es tu correo corporativo.';render();return}
  const mias=await hashesDe(clave);

  if(d==='admin'){
    const g=(state.acceso&&state.acceso.hashes)||[];
    if(!g.length){
      if(clave.length<6){state.gateErr='La clave tiene que tener al menos 6 caracteres.';render();return}
      const doc={hashes:mias,titular:nombre,definidaPor:nombre,temporal:false,actualizado:new Date().toISOString()};
      if(!await guardarDoc('config/acceso',doc)){state.gateErr='No se pudo guardar la clave: tu usuario no tiene permiso de edición en esta página.';render();return}
      state.acceso=doc;
    }else if(!coincide(mias,g)){
      state.gateErr='Esa no es la clave de administración. Si la olvidaste, se reinicia desde el archivo descargado.';render();return;
    }
    guardarSesion({nombre,rol:'admin',sectorId:'',sectorNombre:'',desde:new Date().toISOString()});
    aplicarSesion();state.gateErr='';state.view='resumen';render();return;
  }

  const sec=sectorDe(d);
  if(!sec){state.gateErr='Ese sector ya no existe. Elegí otro.';render();return}
  const c=claveDe(d);
  if(!c||!(c.hashes||[]).length){
    if(clave.length<6){state.gateErr='La clave tiene que tener al menos 6 caracteres. La primera vez usá tu correo corporativo.';render();return}
    if(!await guardarDoc('claves/'+d,{hashes:mias,definidaPor:nombre,sectorNombre:sec.nombre,actualizado:new Date().toISOString()})){
      state.gateErr='No se pudo guardar la clave de este sector. Avisale a Calidad.';render();return}
  }else if(!coincide(mias,c.hashes)){
    state.gateErr='Esa no es la clave de '+sec.nombre+'. Si la olvidaste, Calidad la puede reiniciar.';render();return;
  }
  guardarSesion({nombre,rol:'sector',sectorId:d,sectorNombre:sec.nombre,desde:new Date().toISOString()});
  aplicarSesion();state.gateErr='';state.view='piso';render();
}

function lineHTML(pts){
  if(pts.length<2)return `<div class="empty">Se necesitan al menos dos meses con auditorías para ver la tendencia.</div>`;
  const W=560,H=210,L=34,R=30,T=14,B=30,iw=W-L-R,ih=H-T-B;
  const x=i=>L+i*iw/(pts.length-1),y=v=>T+ih-(v/100)*ih;
  const d=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');

/* ================= tablero ================= */
function resumen(){
  const auds=auditoriasFiltradas();
  const ult=ultimaPorSector(auds);
  const vig=Object.values(ult);
  const prom=pooled(vig);
  const oper=vig.filter(a=>a.zona==='operativa'),apoyo=vig.filter(a=>a.zona==='apoyo');
  const pOper=pooled(oper);
  const pApoyo=pooled(apoyo);
  const cat={ok:0,warn:0,crit:0};
  vig.forEach(a=>{const k=nivel(a.pct).k;if(cat[k]!=null)cat[k]++});
  const hs=hallazgosSitio(),ab=hs.filter(abierto),ve=hs.filter(vencido);
  const cerr=hs.filter(h=>h.estado==='cerrado');
  const enPlazo=cerr.length?cerr.filter(cerradoEnPlazo).length/cerr.length*100:null;
  const reinc=ab.filter(h=>(h.reincidencia||1)>=2).length;
  const crit=ab.filter(h=>h.severidad==='critico').length;
  // internas: cumplimiento de la rutina y brecha contra la externa
  const int=internasFiltradas();
  const ultInt=ultimaPorSector(int);
  const pares=Object.keys(ultInt).filter(k=>ult[k]&&ult[k].pct!=null&&ultInt[k].pct!=null);
  const brecha=pares.length?pares.reduce((s,k)=>s+(ultInt[k].pct-ult[k].pct),0)/pares.length:null;
  const secTot=todosSectores().filter(s=>state.f.sitio==='all'||s.sitioId===state.f.sitio).length;
  const qAct=quincenaDe(todayISO());
  const intQ=int.filter(a=>quincenaDe(a.fecha)===qAct);
  return{auds,ult,vig,prom,pOper,pApoyo,cat,hs,ab,ve,cerr,enPlazo,reinc,crit,int,ultInt,brecha,pares,secTot,qAct,intQ};
}

/* ================= impacto monetario ================= */
function impacto(){
  const p=Object.assign({},IMPD,state.impacto||{});
  const e=ESCEN[p.escenario]||1;
  const pc=v=>Math.max(0,Math.min(100,(Number(v)||0)*e))/100;
  const dot=todosSectores().reduce((n,s)=>n+(Number(s.dotacion)||0),0);
  const ch=Number(p.costoHora)||0;
  const hBusqueda=dot*((Number(p.minBusqueda)||0)/60)*(Number(p.diasMes)||0);
  const aBusqueda=hBusqueda*ch*pc(p.redBusqueda);
  const aMerma=(Number(p.mermaMensual)||0)*pc(p.redMerma);
  const aAcc=((Number(p.accidentesAnio)||0)/12)*(Number(p.costoAccidente)||0)*pc(p.redAccidentes);
  const ahorro=aBusqueda+aMerma+aAcc;
  const hCharlas=dot*((Number(p.minCharla)||0)/60)*(Number(p.diasMes)||0)*(Number(p.turnos)||1)/(Number(p.turnos)||1);
  const cCharlas=hCharlas*ch;
  const cAud=(Number(p.horasAudMes)||0)*ch;
  const costoMes=cCharlas+cAud;
  const inv=(Number(p.invCompras)||0)+(Number(p.horasCapac)||0)*ch;
  const neto=ahorro-costoMes;
  const payback=neto>0?inv/neto:null;
  const anual=neto*12;
  const roi=inv>0?((anual-inv)/inv)*100:null;
  const faltan=[];
  if(!ch)faltan.push('costo de la hora de trabajo');
  if(!dot)faltan.push('dotación por sector');
  if(!Number(p.minBusqueda))faltan.push('minutos por persona por día perdidos en búsqueda');
  if(!Number(p.mermaMensual))faltan.push('merma mensual en guaraníes');
  if(!Number(p.invCompras))faltan.push('inversión prevista en recursos');
  return{p,e,dot,hBusqueda,aBusqueda,aMerma,aAcc,ahorro,hCharlas,cCharlas,cAud,costoMes,inv,neto,payback,anual,roi,faltan};
}

async function guardarAuditoria(){
  const d=state.draft;if(!d)return;
  if(!state.auditor.trim()){toast('Completá el nombre del auditor');focoAuditor();return}
  const sec=sectorDe(d.sectorId);const cl=state.checklists.find(c=>c.id===d.checklistId);
  const r=calcular(cl,d.resp);
  if(!r.evaluados&&!r.fallasB){toast('Calificá al menos un ítem');return}
  const id=uid('a-');
  const ok=await guardarDoc(COL.au+'/'+id,{
    sitioId:sec.sitioId,sitioNombre:sec.sitioNombre,sectorId:sec.id,sectorNombre:sec.nombre,zona:sec.zona||'operativa',tipo:sec.tipo||'general',
    checklistId:cl.id,checklistNombre:cl.nombre,checklistVersion:cl.version||'',modo:cl.modo||'binario',
    auditor:state.auditor.trim(),fecha:d.fecha,tipoAuditoria:tipoAud(d),
    estado:'pendiente',validadaPor:'',validadaEl:'',obsValidacion:'',
    auditorSector:d.auditorSector||'',auditorSectorNombre:(sectorDe(d.auditorSector)||{}).nombre||'',
    quincena:quincenaDe(d.fecha),
    pct:r.pct,fallas:r.fallas,fallasB:r.fallasB,evaluados:r.evaluados,cumple:Math.max(0,r.evaluados-r.fallas),total:r.total,
    secciones:r.secciones.map(s=>({codigo:s.codigo,nombre:s.nombre,pct:s.pct,fallas:s.fallas,evaluados:s.evaluados,total:s.total})),
    respuestas:d.resp,creado:new Date().toISOString()
  });
  if(!ok)return;
  let n=0,escal=0;
  for(const s of (cl.secciones||[])){
    for(const it of (s.items||[])){
      const rr=d.resp[it.id];
      if(!rr||rr.v==null||rr.v==='na'||!esFalla(cl,rr.v))continue;
      const prev=state.hallazgos.filter(h=>h.sectorId===sec.id&&h.itemId===it.id).length;
      const reinc=prev+1;
      let sev=it.severidad||'menor';
      if(reinc>=3)sev='critico';
      const B=(it.bloque||'A')==='B';
      const hid=uid('h-');
      await guardarDoc(COL.ha+'/'+hid,{
        auditoriaId:id,sitioId:sec.sitioId,sitioNombre:sec.sitioNombre,sectorId:sec.id,sectorNombre:sec.nombre,
        seccionCodigo:s.codigo,seccionNombre:s.nombre,itemId:it.id,item:it.texto,
        bloque:B?'B':'A',severidad:sev,reincidencia:reinc,escalado:reinc>=3,sinFoto:!!it.sinFoto,
        descripcion:(rr.obs||'').trim(),responsable:'',area:B?(it.area||'mantenimiento'):'sector',
        fechaLimite:addDaysISO(SEV[sev].dias),estado:'abierto',causaRaiz:'',accionPreventiva:'',
        detectadoPor:state.auditor.trim(),fecha:d.fecha,creado:new Date().toISOString()
      });
      n++;if(reinc>=3)escal++;
    }
  }
  state.draft=null;
  toast(`Informe generado · ${n1(r.pct)}%${n?` · ${n} hallazgo${n===1?'':'s'}`:''}${escal?` · ${escal} escalado${escal===1?'':'s'} a crítico`:''}`);
  state.openInf=id;state.view='informe';window.scrollTo(0,0);render();
}

function vHallazgos(){

  if(state.fh.area!=='all')hs=hs.filter(h=>(h.area||'sector')===state.fh.area);
  if(state.fh.estado==='pendientes')hs=hs.filter(abierto);
  else if(state.fh.estado==='vencidos')hs=hs.filter(vencido);
  else if(state.fh.estado==='reincidentes')hs=hs.filter(h=>abierto(h)&&(h.reincidencia||1)>=2);
  else if(state.fh.estado==='criticos')hs=hs.filter(h=>abierto(h)&&h.severidad==='critico');
  else if(state.fh.estado!=='all')hs=hs.filter(h=>h.estado===state.fh.estado);
  const ord={critico:0,mayor:1,menor:2};
  hs.sort((a,b)=>{
    const va=vencido(a)?0:1,vb=vencido(b)?0:1;if(va!==vb)return va-vb;
    const sa=ord[a.severidad||'menor'],sb=ord[b.severidad||'menor'];if(sa!==sb)return sa-sb;
    return String(a.fechaLimite||'9999').localeCompare(String(b.fechaLimite||'9999'));

      <div class="m">${sinResp?'<span class="badge warn dot">Asignar</span>':'<span>Todos asignados</span>'}</div></div>

  </div>
  <div class="filters">
    <div class="field"><label for="hSector">Sector</label><select id="hSector">
      <option value="all"${state.fh.sector==='all'?' selected':''}>Todos</option>
      ${secs.map(s=>`<option value="${esc(s.id)}"${state.fh.sector===s.id?' selected':''}>${esc(s.nombre)}</option>`).join('')}</select></div>

function tvSlides(){
  const R=resumen();
  const secs=todosSectores().filter(s=>state.f.sitio==='all'||s.sitioId===state.f.sitio);
  const conDato=secs.map(s=>({s,a:R.ult[s.id]})).filter(x=>x.a&&x.a.pct!=null);
  const oper=conDato.filter(x=>(x.s.zona||'operativa')==='operativa').sort((a,b)=>b.a.pct-a.a.pct);
  const p=state.pantalla||{};
  const nvO=nivel(R.pOper);
  const slides=[];
  slides.push({t:'Cumplimiento 5S · zonas operativas',c:true,h:`<div class="huge" style="color:var(--${nvO.k==='na'?'ink':nvO.k})">${R.pOper==null?'—':n1(R.pOper)}<small>%</small></div>
    <div class="meter"><i style="width:${Math.max(1,Math.min(100,R.pOper||0))}%;background:var(--${nvO.k==='na'?'ink-3':nvO.k})"></i></div>
    <div style="font-size:1.6vw;color:var(--ink-3);margin-top:1.2vh">Meta ${VERDE}% · ${oper.length} sectores medidos · zonas de apoyo ${R.pApoyo==null?'—':n1(R.pApoyo)+'%'}</div>`});
  if(oper.length)slides.push({t:'Puntaje por sector · operativas',h:`<div class="tvbars">${oper.slice(0,9).map(x=>{
    const nv=nivel(x.a.pct);
    return `<div class="tvbar"><b>${esc(x.s.nombre)}</b><div class="tr"><div class="fl ${nv.k}" style="width:${Math.max(1.5,x.a.pct)}%"></div></div><span class="vv" style="color:var(--${nv.k})">${n1(x.a.pct)}%</span></div>`}).join('')}</div>`});
  const acc={};R.vig.forEach(a=>(a.secciones||[]).forEach(s=>{if(s.pct==null)return;acc[s.codigo]=acc[s.codigo]||{n:s.nombre,su:0,c:0};acc[s.codigo].su+=s.pct;acc[s.codigo].c++}));
  const ax=Object.entries(acc).sort((a,b)=>a[0].localeCompare(b[0]));
  if(ax.length)slides.push({t:'Dónde estamos flojos · por cada S',h:`<div class="tvbars">${ax.map(([c,o])=>{
    const v=o.su/o.c,nv=nivel(v);
    return `<div class="tvbar"><b>${esc(c)} · ${esc(o.n)}</b><div class="tr"><div class="fl ${nv.k}" style="width:${Math.max(1.5,v)}%"></div></div><span class="vv" style="color:var(--${nv.k})">${n1(v)}%</span></div>`}).join('')}</div>`});
  slides.push({t:'Plan de acción',h:`<div class="cards">
    <div class="card"><div class="cv" style="color:var(--crit)">${R.crit}</div><div class="ck">Críticos abiertos</div></div>
    <div class="card"><div class="cv" style="color:var(--warn)">${R.reinc}</div><div class="ck">Reincidencias</div></div>
    <div class="card"><div class="cv" style="color:var(--${R.enPlazo!=null&&R.enPlazo>=80?'ok':'warn'})">${R.enPlazo==null?'—':n0(R.enPlazo)}<small style="font-size:2vw">%</small></div><div class="ck">Cerrados en plazo</div></div>
  </div><div style="font-size:1.3vw;color:var(--ink-3);margin-top:1.5vh">${R.ab.length} hallazgos sin cerrar · ${R.ve.length} vencidos</div>`});
  if(p.foco)slides.push({t:'Foco de la semana',c:true,h:`<div class="foco">${esc(p.foco)}</div>`});
  const bs=state.buenas.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).slice(0,3);
  if(p.reconocimiento||bs.length)slides.push({t:'Lo que se hizo bien',h:`${p.reconocimiento?`<div class="recon" style="font-family:Figtree;font-weight:700;font-size:2.6vw;line-height:1.2">${esc(p.reconocimiento)}</div>`:''}
    ${bs.length?`<ul>${bs.map(b=>`<li><b>${esc(b.sectorNombre)}</b> — ${esc(b.descripcion)}</li>`).join('')}</ul>`:''}`});
  const peores=oper.slice(-3).reverse().filter(x=>x.a.pct<VERDE);
  if(peores.length)slides.push({t:'Sectores que necesitan ayuda esta semana',h:`<div class="tvbars">${peores.map(x=>{
    const nv=nivel(x.a.pct),ca=criticosAbiertosDe(x.s.id);
    return `<div class="tvbar"><b>${esc(x.s.nombre)}</b><div class="tr"><div class="fl ${nv.k}" style="width:${Math.max(1.5,x.a.pct)}%"></div></div><span class="vv" style="color:var(--${nv.k})">${n1(x.a.pct)}%</span></div>`+
    (ca?`<div style="font-size:1.1vw;color:var(--crit);margin-top:-.6vh">${ca} hallazgo${ca===1?'':'s'} crítico${ca===1?'':'s'} abierto${ca===1?'':'s'}</div>`:'')}).join('')}</div>`});
  return slides.length?slides:[{t:'CAT 5S',h:'<div class="foco">Todavía no hay datos cargados.</div>'}];
}
function renderTV(){
  const slides=tvSlides();
  if(state.tv.i>=slides.length)state.tv.i=0;
  const s=slides[state.tv.i];
  const seg=Number((state.pantalla||{}).segundos||18);
  $('#app').style.display='none';
  $('#tvroot').innerHTML=`<div class="tv">
    <div class="tvhead"><div class="l"><div class="mk" style="background:transparent;padding:4px"><img src="'+LOGO+'" alt="CAT"></div><h2>Calidad Ante Todo · 5S</h2></div>
      <div class="r">Centro de Distribución<br>${fmtDate(todayISO())}</div></div>
    <div class="slide${s.c?' center':''}"><h3>${esc(s.t)}</h3>${s.h}</div>
    <div class="tvfoot"><span>${state.tv.pausa?'En pausa · barra espaciadora para seguir':'Rota cada '+seg+' s · espacio pausa · Esc sale'}</span>
      <span class="dots">${slides.map((_,i)=>`<i class="${i===state.tv.i?'on':''}"></i>`).join('')}</span>
      <button class="btn ghost sm" id="btnTvExit">Salir ✕</button></div>
  </div>`;
  clearTimeout(state.tv.timer);
  if(!state.tv.pausa)state.tv.timer=setTimeout(()=>{state.tv.i=(state.tv.i+1)%slides.length;renderTV()},seg*1000);
}
function tvOn(){state.tv.on=true;state.tv.i=0;state.tv.pausa=false;render()}
function tvOff(){state.tv.on=false;clearTimeout(state.tv.timer);render()}

/* comprime una imagen en el navegador hasta que entre en un documento de la base */
function comprimirImagen(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('No se pudo leer el archivo'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('El archivo no parece ser una imagen'));
      img.onload=()=>{
        const dims=[1400,1100,900,720],cals=[.72,.6,.5,.4,.32];
        for(const d of dims){
          const esc2=Math.min(1,d/Math.max(img.width,img.height));
          const cv=document.createElement('canvas');
          cv.width=Math.round(img.width*esc2);cv.height=Math.round(img.height*esc2);
          const cx=cv.getContext('2d');
          cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
          cx.drawImage(img,0,0,cv.width,cv.height);
          for(const q of cals){
            const url=cv.toDataURL('image/jpeg',q);
            if(url.length<=MAXB64)return res({data:url,w:cv.width,h:cv.height,bytes:Math.round(url.length*0.75)});
          }
        }
        rej(new Error('grande'));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function leerArchivo(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('No se pudo leer el archivo'));
    fr.onload=()=>{
      if(String(fr.result).length>MAXB64)return rej(new Error('grande'));
      res({data:fr.result,bytes:file.size});
    };
    fr.readAsDataURL(file);
  });
}
/* prepara los archivos y abre la ventana donde se escribe por qué se sacó cada foto */
async function prepararSubida(files,ctx){
  if(!state.auditor.trim()){toast('Poné tu nombre en el campo Auditor antes de subir');focoAuditor();return}
  toast('Preparando '+files.length+' archivo'+(files.length===1?'':'s')+'…');
  const items=[],grandes=[];
  for(const f of files){
    const esImg=/^image\//.test(f.type);
    let out=null;
    try{out=esImg?await comprimirImagen(f):await leerArchivo(f)}
    catch(e){grandes.push(f.name);continue}
    items.push({nombre:f.name,mime:f.type||'application/octet-stream',esImagen:esImg,
      data:out.data,bytes:out.bytes,ancho:out.w||0,alto:out.h||0,nota:'',hallazgoId:ctx.hallazgoId||''});
  }
  if(grandes.length)toast(`${grandes.length} archivo${grandes.length===1?'':'s'} muy grande${grandes.length===1?'':'s'}: guardalo en la carpeta de red y dejá la referencia`);
  if(!items.length)return;
  state.subida={ctx,items};render();
}

async function accionValidacion(cmd){
  const [op,id]=cmd.split(':');
  const a=state.auditorias.find(x=>x.id===id);if(!a)return;
  if(!state.auditor.trim()){toast('Poné tu nombre en el campo Auditor para dejar constancia de quién validó');focoAuditor();return}
  const obsEl=$('#valObs');const obs=obsEl?obsEl.value.trim():'';
  const d=Object.assign({},a);delete d.id;
  if(op==='validar'){
    const sin=$('#valSinDoc');
    if(!evidenciasDe(id).length&&!(sin&&sin.checked)){
      toast('Esta auditoría no tiene documento cargado: pedí la evidencia o marcá que no la requiere');return;
    }
    d.estado='validada';d.validadaPor=state.auditor.trim();d.validadaEl=new Date().toISOString();d.obsValidacion=obs;
    if(await guardarDoc(COL.au+'/'+id,d))toast('Puntaje validado: ya cuenta en el tablero y en el resumen');
  }else if(op==='devolver'){
    if(!obs){toast('Escribí qué falta antes de devolverla');if(obsEl)obsEl.focus();return}
    d.estado='devuelta';d.validadaPor=state.auditor.trim();d.validadaEl=new Date().toISOString();d.obsValidacion=obs;
    if(await guardarDoc(COL.au+'/'+id,d))toast('Devuelta al sector: el puntaje no cuenta');
  }else if(op==='pendiente'){
    d.estado='pendiente';d.validadaPor='';d.validadaEl='';
    if(await guardarDoc(COL.au+'/'+id,d))toast('Vuelve a quedar pendiente de validación');
  }
}

function ringHTML(pct){
  const nv=nivel(pct),R=54,C=2*Math.PI*R;
  const p=Math.max(0,Math.min(100,pct||0));
  return `<div class="ring"><svg width="140" height="140" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="13"/>
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--${nv.k==='na'?'ink-3':nv.k})" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p/100)).toFixed(1)}" transform="rotate(-90 70 70)"/>
    <text x="70" y="72" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)" font-family="Figtree,sans-serif">${pct==null?'—':n1(pct)}</text>
    <text x="70" y="92" text-anchor="middle" font-size="13" fill="var(--ink-3)" font-family="Figtree,sans-serif">por ciento</text>
  </svg></div>`;
}

async function guardarWiz(){
  const w=state.wiz;if(!w)return;
  if(!state.auditor.trim()){toast('Poné tu nombre en el campo Auditor');focoAuditor();return}
  const sec=sectorDe(w.sectorId);const cl=state.checklists.find(c=>c.id===w.checklistId);
  const r=calcular(cl,w.resp);
  if(!r.evaluados){toast('Contestá al menos una pregunta');return}
  const id=uid('a-');
  const ok=await guardarDoc(COL.au+'/'+id,{
    sitioId:sec.sitioId,sitioNombre:sec.sitioNombre,sectorId:sec.id,sectorNombre:sec.nombre,
    zona:sec.zona||'operativa',tipo:sec.tipo||'general',
    checklistId:cl.id,checklistNombre:cl.nombre,checklistVersion:cl.version||'',modo:cl.modo||'binario',
    auditor:state.auditor.trim(),fecha:w.fecha,tipoAuditoria:w.tipo,quincena:quincenaDe(w.fecha),

    secciones:r.secciones.map(s=>({codigo:s.codigo,nombre:s.nombre,pct:s.pct,fallas:s.fallas,evaluados:s.evaluados,total:s.total})),
    respuestas:w.resp,creado:new Date().toISOString()});
  if(!ok)return;
  let n=0;
  for(const s of (cl.secciones||[])){
    for(const it of (s.items||[])){
      const rr=w.resp[it.id];
      if(!rr||rr.v==null||rr.v==='na'||!esFalla(cl,rr.v))continue;
      const reinc=state.hallazgos.filter(h=>h.sectorId===sec.id&&h.itemId===it.id).length+1;
      let sev=it.severidad||'menor';if(reinc>=3)sev='critico';
      const B=(it.bloque||'A')==='B';
      await guardarDoc(COL.ha+'/'+uid('h-'),{
        auditoriaId:id,sitioId:sec.sitioId,sitioNombre:sec.sitioNombre,sectorId:sec.id,sectorNombre:sec.nombre,
        seccionCodigo:s.codigo,seccionNombre:s.nombre,itemId:it.id,item:it.texto,
        bloque:B?'B':'A',severidad:sev,reincidencia:reinc,escalado:reinc>=3,sinFoto:!!it.sinFoto,
        descripcion:(rr.obs||'').trim(),responsable:'',area:B?(it.area||'mantenimiento'):'sector',

async function guardarCarga(){
  const c=state.carga;if(!c)return;
  if(!state.auditor.trim()){toast('Completá el nombre del auditor');focoAuditor();return}
  const secs=todosSectores();
  const rows=Object.entries(c.rows).filter(([id,r])=>Number(r.e)>0&&r.c!=null&&r.c!=='');
  if(!rows.length){toast('No hay sectores con datos');return}
  let n=0;
  for(const [id,r] of rows){
    const s=secs.find(x=>x.id===id);if(!s)continue;
    const ev=Number(r.e),cu=Math.min(Number(r.c),ev);
    const aud=sectorDe(r.audita||'')||null;
    const did='a-'+c.fecha+'-'+c.tipo+'-'+id;
    const ok=await guardarDoc(COL.au+'/'+did,{
      sitioId:s.sitioId,sitioNombre:s.sitioNombre,sectorId:s.id,sectorNombre:s.nombre,
      zona:s.zona||'operativa',tipo:s.tipo||'general',
      checklistId:'',checklistNombre:'CAT 4S · planilla SI/NO',checklistVersion:'1.0',modo:'binario',
      auditor:state.auditor.trim(),fecha:c.fecha,tipoAuditoria:c.tipo,quincena:quincenaDe(c.fecha),
      estado:'pendiente',validadaPor:'',validadaEl:'',obsValidacion:'',
      auditorSector:aud?aud.id:'',auditorSectorNombre:aud?aud.nombre:'',
      pct:Math.round(cu/ev*1000)/10,cumple:cu,evaluados:ev,total:ev,fallas:ev-cu,fallasB:0,
      secciones:[],respuestas:{},creado:new Date().toISOString()});
    if(ok)n++;
  }
  state.carga=null;
  toast(`${n} sector${n===1?'':'es'} cargado${n===1?'':'s'} · quedan pendientes de validar`);
  go('validar');
}

/* ================= CSV ================= */
function csv(rows){return rows.map(r=>r.map(c=>{const s=String(c==null?'':c);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\r\n')}
async function bajar(nombre,texto){
  let dl=null;
  try{dl=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null}catch(e){}
  if(dl){
    try{await dl.save({filename:nombre,data:texto});toast('Archivo generado');return}
    catch(e){if(e&&e.code==='cancelled')return}
  }
  try{
    const blob=new Blob([texto],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
    toast('Archivo generado');
  }catch(e){toast('No se pudo generar el archivo')}
}

/* ================= eventos ================= */
function toast(msg){
  $$('.toast').forEach(x=>x.remove());
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),3400);
}
const tip=document.createElement('div');tip.className='tip';tip.hidden=true;document.body.appendChild(tip);
function placeTip(e){
  const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;
  if(x+r.width>innerWidth-10)x=e.clientX-r.width-14;
  if(y+r.height>innerHeight-10)y=e.clientY-r.height-14;
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';
}
document.addEventListener('mouseover',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');if(!t)return;
  tip.innerHTML='<b>'+esc(t.dataset.tip)+'</b>'+(t.dataset.tipd?'<br>'+esc(t.dataset.tipd):'');
  tip.hidden=false;placeTip(e);
});
document.addEventListener('mousemove',e=>{if(!tip.hidden)placeTip(e)});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('[data-tip]'))tip.hidden=true});
window.addEventListener('scroll',()=>{tip.hidden=true},{passive:true});

document.addEventListener('keydown',e=>{
  if(state.subida&&e.key==='Escape'){state.subida=null;render();return}
  if(state.tour!=null){
    if(e.key==='Escape'){state.tour=null;try{localStorage.setItem('cat.tour','1')}catch(err){}render()}
    else if(e.key==='ArrowRight'){state.tour=Math.min(TOUR.length-1,state.tour+1);render()}
    else if(e.key==='ArrowLeft'){state.tour=Math.max(0,state.tour-1);render()}
    return;
  }
  if(state.lightbox&&e.key==='Escape'){state.lightbox=null;render();return}
  if(!state.tv.on)return;
  if(e.key==='Escape'){tvOff()}
  else if(e.key===' '){e.preventDefault();state.tv.pausa=!state.tv.pausa;renderTV()}
  else if(e.key==='ArrowRight'){state.tv.i++;renderTV()}
  else if(e.key==='ArrowLeft'){const n=tvSlides().length;state.tv.i=(state.tv.i-1+n)%n;renderTV()}
});

document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.id==='btnTvExit'){tvOff();return}
  if(state.tv.on)return;
  const ck=t.closest('[data-ck]');
  if(ck){if(state.confirmKey!==ck.dataset.ck){state.confirmKey=ck.dataset.ck;render();return}state.confirmKey=null}
  else if(state.confirmKey){state.confirmKey=null}

  const nav=t.closest('.nav');if(nav){go(nav.dataset.view);return}
  if(t.closest&&t.closest('[data-miclave]')){go('manual');setTimeout(()=>{const n=$('#miclave');if(n)n.scrollIntoView({behavior:'smooth',block:'start'});const c=$('#cvNueva');if(c)c.focus()},120);return}
  const g=t.closest('[data-go]');if(g){go(g.dataset.go);return}
  const row=t.closest('[data-audit]');
  if(row&&!t.closest('button')&&!t.closest('input')&&!t.closest('select')){state.openAudit=row.dataset.audit;state.view='auditorias';window.scrollTo(0,0);render();return}
  const exp=t.closest('[data-exp]');

  const sb=t.closest('.scale button');

    const cur=state.draft.resp[it]||{};const nuevo=raw==='na'?'na':Number(raw);

    }
    return;
  }
  if(state.subida)return;
  const tb=t.closest('[data-tour]');
  if(tb){
    const v=tb.dataset.tour;
    if(v==='next')state.tour=Math.min(TOUR.length-1,state.tour+1);
    else if(v==='prev')state.tour=Math.max(0,state.tour-1);
    else if(v==='fin'){state.tour=null;try{localStorage.setItem('cat.tour','1')}catch(e){}}
    else if(v.indexOf('ir:')===0){const d=v.slice(3);state.tour=null;try{localStorage.setItem('cat.tour','1')}catch(e){}go(d);return}
    render();return;
  }
  if(state.tour!=null)return;
  if(t.id==='btnTour'){state.tour=0;render();return}
  if(t.id==='btnExport'){
    let dump;
    if(state.db&&state.db.exportar)dump=state.db.exportar();
    else{
      const S={};
      state.sitios.length&&(S['config/estructura']={sitios:state.sitios});
      S['config/pantalla']=state.pantalla;S['config/impacto']=state.impacto;
      state.checklists.forEach(c=>{const d=Object.assign({},c);delete d.id;S['checklists/'+c.id]=d});
      state.auditorias.forEach(c=>{const d=Object.assign({},c);delete d.id;S['auditorias/'+c.id]=d});
      state.hallazgos.forEach(c=>{const d=Object.assign({},c);delete d.id;S['hallazgos/'+c.id]=d});
      state.buenas.forEach(c=>{const d=Object.assign({},c);delete d.id;S['buenas/'+c.id]=d});
      state.evidencias.forEach(c=>{const d=Object.assign({},c);delete d.id;S['evidencias/'+c.id]=d});
      dump=JSON.stringify({app:'CAT 5S',version:1,exportado:new Date().toISOString(),datos:S},null,1);
    }

  }
  const ac=t.closest('[data-acc]');
  if(ac){const i=Number(ac.dataset.acc);state.acc=state.acc===i?-1:i;render();return}

  if(vb){accionValidacion(vb.dataset.val);return}
  const inf=t.closest('[data-inf]');
  if(inf){state.openInf=inf.dataset.inf;state.view='informe';window.scrollTo(0,0);render();return}
  const eo=t.closest('[data-exp-open]');
  if(eo){state.openExp=eo.dataset.expOpen;state.view='expedientes';window.scrollTo(0,0);render();return}
  const dexp=t.closest('[data-dl-exp]');
  if(dexp){descargarExpediente(dexp.dataset.dlExp);return}
  const dev=t.closest('[data-del-ev]');
  if(dev){await borrarDoc(COL.ev+'/'+dev.dataset.delEv);toast('Adjunto quitado del expediente');return}
  if(t.id==='btnCsvExp'){
    const rows=[['Fecha','Sitio','Sector','Zona','Tipo','Auditor','Audita','Puntaje %','Cumple','Evaluados','Hallazgos','Adjuntos','Fotos']];
    baseFiltro(state.auditorias).forEach(a=>{const ev=evidenciasDe(a.id);
      rows.push([a.fecha,a.sitioNombre,a.sectorNombre,a.zona,labelTipo(a),a.auditor,a.auditorSectorNombre||'',n1(a.pct),a.cumple!=null?a.cumple:'',a.evaluados,state.hallazgos.filter(h=>h.auditoriaId===a.id).length,ev.length,ev.filter(e=>e.esImagen).length]);});
    bajar('CAT-indice-de-auditorias-'+todayISO()+'.csv','﻿'+csv(rows));return;
  }
  const wsec=t.closest('[data-wsec]');
  if(wsec&&state.wiz){state.wiz.sectorId=wsec.dataset.wsec;state.wiz.checklistId='';state.wiz.resp={};state.wiz.idx=0;state.wiz.step=1;render();return}
  const wv=t.closest('[data-wv]');
  if(wv&&state.wiz){
    const w=state.wiz;
    const cl=state.checklists.find(c=>c.id===w.checklistId);
    const items=(cl.secciones||[]).flatMap(s=>s.items||[]);
    const it=items[w.idx];const raw=wv.dataset.wv;
    const nuevo=raw==='na'?'na':Number(raw);
    const cur=w.resp[it.id]||{};
    w.resp[it.id]=Object.assign({},cur,{v:cur.v===nuevo?null:nuevo});
    if(w.resp[it.id].v==null)delete w.resp[it.id];
    const sigue=w.resp[it.id]&&(w.resp[it.id].v===1||w.resp[it.id].v==='na');
    if(sigue&&w.idx<items.length-1)w.idx++;
    render();return;
  }
  const wgo=t.closest('[data-wgo]');
  if(wgo&&state.wiz){
    const cl=state.checklists.find(c=>c.id===state.wiz.checklistId);
    const n=(cl.secciones||[]).flatMap(s=>s.items||[]).length;
    state.wiz.idx=Math.max(0,Math.min(n-1,state.wiz.idx+Number(wgo.dataset.wgo)));render();return;
  }
  const wst=t.closest('[data-wstep]');
  if(wst&&state.wiz){state.wiz.step=Number(wst.dataset.wstep);window.scrollTo(0,0);render();return}
  if(t.id==='btnWizGuardar'){guardarWiz();return}
  if(t.id==='btnCargaGuardar'){guardarCarga();return}

  if(t.id==='btnGuardarPantalla'){
    state.pantalla=Object.assign({},state.pantalla,{
      foco:$('#pFoco').value.trim(),reconocimiento:$('#pRecon').value.trim(),
