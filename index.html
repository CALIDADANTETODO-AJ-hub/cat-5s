 {t:'Vista de Gerencia',c:`<p><b>Resumen ejecutivo</b>: decisiones pendientes y una fila por sector con puntaje, hallazgos, reincidencias y habilitación. Imprimible.</p>

 {t:'Pantalla del CD',c:`<ol><li>Abrir el sistema en el navegador del televisor o de la PC conectada.</li>

 {t:'Usuarios y roles',c:`<p>Cada persona ingresa con usuario y clave. La primera vez debe cambiar la clave inicial en <b>Mi clave</b>.</p>
 <ul><li><b>Calidad · administración</b>: acceso total a todos los sitios y configuración.</li>
 <li><b>Gerencia</b>: todos los sitios, solo lectura.</li>

 {t:'Etiqueta de pallet (plantas)',c:`<p>Menú: <b>CAT Industrias → Planta Itauguá → planta → Etiqueta de pallet</b>.</p>
 <ol><li>Escanear el código de barras del producto (cámara o lector) o seleccionarlo de la lista.</li>

 <li><b>Generar etiqueta</b>: el sistema calcula vencimiento, lote y paquetes, guarda el registro e imprime la etiqueta con QR.</li></ol>
 <p>Maestro de productos (código, vida útil, paquetes por caja): botón <b>Productos</b>, solo Administración.</p>`},
 {t:'Configuración inicial',c:`<ul>
 <li><b>Sitios y sectores</b>: nombre, tipo, zona (operativa o apoyo), líder 5S y dotación. Incluye la <b>habilitación</b>: seis condiciones para que el sector ingrese al puntaje oficial.</li>
 <li><b>Checklists</b>: ítems con bloque, severidad, peso y pilar al que impactan. Para modificar un instrumento usar <b>Duplicar como nueva versión</b>; el histórico se conserva.</li></ul>`},
 {t:'Preguntas frecuentes',c:`<ul>
 <li><b>¿El consolidado es el promedio de los porcentajes?</b> No. Se calcula ítems cumplidos ÷ ítems evaluados, igual que la planilla oficial.</li>
 <li><b>¿Cómo se trata un ítem que no aplica al sector?</b> Se marca <b>No aplica</b>; no computa a favor ni en contra.</li>
 <li><b>¿Por qué un sector aparece en rojo por infraestructura?</b> No debería: es bloque B. Verificar la clasificación del ítem en la checklist.</li>
 <li><b>¿Varias personas simultáneamente?</b> Sí. Todos ven la misma información al instante; cada acción queda registrada con su usuario.</li>
 <li><b>¿Se puede eliminar una auditoría?</b> Solo Administración, con registro en bitácora.</li></ul>`},
 {t:'BPM · Pilares CAT',c:`<p>La sección <b>Pilares</b> presenta los seis pilares (Seguridad · Calidad e Inocuidad · Mantenimiento · Gestión · Gente · Medio Ambiente) sobre la base 5S.</p>
 <ol><li><b>Nivel 1:</b> los 6 pilares con semáforo y ponderado global del mes.</li>
 <li><b>Nivel 2:</b> sub-auditorías de cada pilar con su peso (suman 100). Calidad define pesos, fuente y líder.</li>
 <li><b>Nivel 3:</b> puntaje por sector.</li>
 <li><b>Nivel 4:</b> el dato. Las sub-auditorías tipo checklist se auditan en "Auditar" y se calculan automáticamente; los ítems 5S marcados con un pilar impactan en ese pilar en toda auditoría, externa o interna. La carga manual queda solo para datos que no provienen de una auditoría.</li></ol>

/* comprime una imagen en el navegador hasta que entre en un documento de la base */
function comprimirImagen(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('No se pudo leer el archivo'));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>rej(new Error('El archivo no parece ser una imagen'));
      img.onload=()=>{
        const dims=[1400,1100,900,720],cals=[.72,.6,.5,.4,.32];
        for(const d of dims){
          const esc2=Math.min(1,d/Math.max(img.width,img.height));
          const cv=document.createElement('canvas');
          cv.width=Math.round(img.width*esc2);cv.height=Math.round(img.height*esc2);
          const cx=cv.getContext('2d');
          cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
          cx.drawImage(img,0,0,cv.width,cv.height);
          for(const q of cals){
            const url=cv.toDataURL('image/jpeg',q);
            if(url.length<=MAXB64)return res({data:url,w:cv.width,h:cv.height,bytes:Math.round(url.length*0.75)});
          }
        }
        rej(new Error('grande'));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function leerArchivo(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('No se pudo leer el archivo'));
    fr.onload=()=>{
      if(String(fr.result).length>MAXB64)return rej(new Error('grande'));
      res({data:fr.result,bytes:file.size});
    };
    fr.readAsDataURL(file);
  });
}
/* prepara los archivos y abre la ventana donde se escribe por qué se sacó cada foto */
async function prepararSubida(files,ctx){
  if(!state.auditor.trim()){toast('Poné tu nombre en el campo Auditor antes de subir');focoAuditor();return}
  toast((ctx.tipo==='correccion'?'Foto de corrección: preparando ':'Preparando ')+files.length+' archivo'+(files.length===1?'':'s')+'…');
  const items=[],grandes=[];
  for(const f of files){
    const esImg=/^image\//.test(f.type);
    let out=null;
    try{out=esImg?await comprimirImagen(f):await leerArchivo(f)}
    catch(e){grandes.push(f.name);continue}
    items.push({nombre:f.name,mime:f.type||'application/octet-stream',esImagen:esImg,
      data:out.data,bytes:out.bytes,ancho:out.w||0,alto:out.h||0,nota:'',hallazgoId:ctx.hallazgoId||'',tipo:ctx.tipo||''});
  }
  if(grandes.length)toast(`${grandes.length} archivo${grandes.length===1?'':'s'} muy grande${grandes.length===1?'':'s'}: guardalo en la carpeta de red y dejá la referencia`);
  if(!items.length)return;
  state.subida={ctx,items};render();
}

async function confirmarSubida(){
  const s=state.subida;if(!s)return;
  const ctx=s.ctx;let ok=0;
  for(const it of s.items){
    const id=uid('e-');
    const g=await guardarDoc(COL.ev+'/'+id,{
      auditoriaId:ctx.auditoriaId||'',hallazgoId:it.hallazgoId||'',tipo:it.tipo||'',
      sitioId:ctx.sitioId||'',sectorId:ctx.sectorId||'',sectorNombre:ctx.sectorNombre||'',
      fecha:ctx.fecha||todayISO(),nombre:it.nombre,mime:it.mime,
      esImagen:it.esImagen,bytes:it.bytes,ancho:it.ancho,alto:it.alto,
      data:it.data,url:'',nota:it.nota.trim(),subidoPor:state.auditor.trim(),creado:new Date().toISOString()});
    if(g)ok++;
  }
  state.subida=null;
  toast(`${ok} archivo${ok===1?'':'s'} guardado${ok===1?'':'s'} con su descripción`);
  render();
}

async function accionValidacion(cmd){
  const [op,id]=cmd.split(':');
  const a=state.auditorias.find(x=>x.id===id);if(!a)return;
  if(!state.auditor.trim()){toast('Poné tu nombre en el campo Auditor para dejar constancia de quién validó');focoAuditor();return}
  const obsEl=$('#valObs');const obs=obsEl?obsEl.value.trim():'';
  const d=Object.assign({},a);delete d.id;
  if(op==='validar'){
    const sin=$('#valSinDoc');
    if(!evidenciasDe(id).length&&!(sin&&sin.checked)){
      toast('Esta auditoría no tiene documento cargado: pedí la evidencia o marcá que no la requiere');return;
    }
    d.estado='validada';d.validadaPor=state.auditor.trim();d.validadaEl=new Date().toISOString();d.obsValidacion=obs;
    if(await guardarDoc(COL.au+'/'+id,d))toast('Puntaje validado: ya cuenta en el tablero y en el resumen');
  }else if(op==='devolver'){
    if(!obs){toast('Escribí qué falta antes de devolverla');if(obsEl)obsEl.focus();return}
    d.estado='devuelta';d.validadaPor=state.auditor.trim();d.validadaEl=new Date().toISOString();d.obsValidacion=obs;
    if(await guardarDoc(COL.au+'/'+id,d))toast('Devuelta al sector: el puntaje no cuenta');
  }else if(op==='pendiente'){
    d.estado='pendiente';d.validadaPor='';d.validadaEl='';
    if(await guardarDoc(COL.au+'/'+id,d))toast('Vuelve a quedar pendiente de validación');
  }
}

function ringHTML(pct){
  const nv=nivel(pct),R=54,C=2*Math.PI*R;
  const p=Math.max(0,Math.min(100,pct||0));
  return `<div class="ring"><svg width="140" height="140" viewBox="0 0 140 140">
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--surface-3)" stroke-width="13"/>
    <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--${nv.k==='na'?'ink-3':nv.k})" stroke-width="13" stroke-linecap="round"
      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p/100)).toFixed(1)}" transform="rotate(-90 70 70)"/>
    <text x="70" y="72" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)" font-family="Figtree,sans-serif">${pct==null?'—':n1(pct)}</text>
    <text x="70" y="92" text-anchor="middle" font-size="13" fill="var(--ink-3)" font-family="Figtree,sans-serif">por ciento</text>
  </svg></div>`;
}
function vPiso(){
  const secs=todosSectores();
  const cls=state.checklists.filter(c=>c.activa!==false);
  if(!secs.length||!cls.length)return `${avisoDb()}<div class="piso"><div class="head"><div><h1>Auditar en el piso</h1></div></div>
    <div class="panel"><div class="empty"><b>Falta configurar sectores o checklists</b><br><br><button class="btn primary" data-go="sectores">Ir a configuración</button></div></div></div>`;
  if(!state.wiz)state.wiz={step:0,sectorId:'',checklistId:'',tipo:'interna',fecha:todayISO(),idx:0,resp:{}};
  const w=state.wiz;
  if(!esAdmin())w.tipo='interna';

  /* paso 0: elegir el tipo de auditoría y después el sector */
  if(w.step===0){
    const R=resumen();
    const qw=quincenaDe(w.fecha);
    const rj={};rotacionJefes(qw).forEach(p=>rj[p.sector.id]=p.jefeId);
    const yo=miJefeId();
    const hechas={};
    state.auditorias.filter(a=>tipoAud(a)==='interna').forEach(a=>{hechas[(a.quincena!=null?a.quincena:quincenaDe(a.fecha))+'|'+a.sectorId]=a});
    return `${avisoDb()}<div class="piso">
      <h1>Auditar</h1>
      <div class="sub">Elegí el tipo de auditoría. Después los ítems se presentan uno por uno: Cumple o No cumple.</div>
      <div class="audtabs">
        <button class="audtab${w.tipo==='interna'?' on':''}" data-wtipo="interna">
          <b>Auditoría interna</b><span>Cruzada entre jefes · rota cada quincena</span></button>
        ${esAdmin()?`<button class="audtab${w.tipo!=='interna'?' on':''}" data-wtipo="externa">
          <b>Auditoría externa</b><span>La hace Calidad · es la que puntúa oficialmente</span></button>`:''}
      </div>
      <div class="grid g2" style="margin:16px 0">
        <div class="field"><label for="wFecha">Fecha de la auditoría</label><input id="wFecha" type="date" value="${esc(w.fecha)}"></div>
        <div class="field"><label>Quincena</label><div class="soft2">Q${qw+1}${w.tipo==='interna'?' · el auditor de cada sector lo designa el sistema':' · auditoría oficial de Calidad'}</div></div>
      </div>
      ${w.tipo==='interna'?`<div class="soft2" style="margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <span>${veRotacionCompleta()?'Cada jefe audita sectores que no son suyos. El reparto lo arma el sistema.':'El sistema te asigna los sectores que te tocan; están primero y marcados en verde. Quién audita los demás lo maneja Calidad.'}</span>
        <button class="btn sm" data-go="rotacion">${veRotacionCompleta()?'Ver el cronograma completo':'Ver lo que me toca'}</button></div>`:''}
      <div class="seccards">${(()=>{
        const lista=secs.slice();
        if(w.tipo==='interna'&&yo)lista.sort((x,y)=>((rj[y.id]===yo)-(rj[x.id]===yo))||x.nombre.localeCompare(y.nombre));
        return lista.map(s=>{
        const a=R.ult[s.id];const nv=nivel(a?a.pct:null);const jq=rj[s.id];const au=auditadoDe(s);
        const mia=yo&&jq===yo,hecha=hechas[qw+'|'+s.id];
        return `<button class="seccard${mia?' mio':''}" data-wsec="${esc(s.id)}">
          <b>${esc(s.nombre)}</b>
          <span class="sm2">${(s.zona||'operativa')==='apoyo'?'Zona de apoyo':'Zona operativa'}</span>
          ${w.tipo==='interna'?`<span class="rotl">${(veRotacionCompleta()||mia)?(jq?`<i>${esc(nombreJefe(jq))}</i> audita a <i>${esc(au.nombre||'—')}</i>`:'<i>sin auditor designado</i>')
            :(au.nombre?`<i>${esc(au.nombre)}</i>`:'<span class="rotr">Sin líder cargado</span>')}${au.nombre?`<br><span class="rotr">${esc(au.rol)} de ${esc(s.nombre)}</span>`:''}</span>`
            :`<span class="rotl">${au.nombre?`<i>${esc(au.nombre)}</i><br><span class="rotr">${esc(au.rol)}</span>`:'<span class="rotr">Sin líder cargado</span>'}</span>`}
          <span class="badge ${mia?'ok':(hecha&&w.tipo==='interna'?'':'')} dot" style="align-self:flex-start">${w.tipo==='interna'&&hecha?'Ya se hizo esta quincena':(mia?'Te toca a vos':(a&&a.pct!=null?'Última: '+n1(a.pct)+'%':'Sin puntaje'))}</span>
        </button>`;
      }).join('')})()}</div>
      ${esAdmin()?`<div class="soft2" style="margin-top:18px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <span>El puntaje se calcula solo al terminar. Otras dos formas de trabajar:</span>
        <button class="btn sm" data-go="auditar">Ver la checklist completa en una lista</button>
        <button class="btn sm" data-go="carga">La auditoría se hizo en papel</button>
      </div>`:''}
    </div>`;
  }

  const sec=sectorDe(w.sectorId)||secs[0];
  const aptas=checklistsAptas(cls,sec);
  const cl=(aptas.length?aptas:cls).find(c=>c.id===w.checklistId)||(aptas.length?aptas[0]:cls[0]);
  w.checklistId=cl.id;
  const items=(cl.secciones||[]).flatMap(s=>(s.items||[]).map(it=>Object.assign({},it,{sec:s})));
  const r=calcular(cl,w.resp);

  /* paso 2: resultado */
  if(w.step===2){

async function guardarWiz(){

  const id=uid('a-');
  const ok=await guardarDoc(COL.au+'/'+id,{
    sitioId:sec.sitioId,sitioNombre:sec.sitioNombre,sectorId:sec.id,sectorNombre:sec.nombre,
    zona:sec.zona||'operativa',tipo:sec.tipo||'general',

    secciones:r.secciones.map(s=>({codigo:s.codigo,nombre:s.nombre,pct:s.pct,fallas:s.fallas,evaluados:s.evaluados,total:s.total})),
    respuestas:w.resp,creado:new Date().toISOString()});

      await guardarDoc(COL.ha+'/'+hid,{
        auditoriaId:id,sitioId:sec.sitioId,sitioNombre:sec.sitioNombre,sectorId:sec.id,sectorNombre:sec.nombre,
        seccionCodigo:s.codigo,seccionNombre:s.nombre,itemId:it.id,item:it.texto,pilarId:it.pilar||'',
        bloque:B?'B':'A',severidad:sev,reincidencia:reinc,escalado:reinc>=3,sinFoto:!!it.sinFoto,
        descripcion:(rr.obs||'').trim(),responsable:'',area:B?(it.area||'mantenimiento'):'sector',
        fechaLimite:addDaysISO(SEV[sev].dias),estado:'abierto',causaRaiz:'',accionPreventiva:'',
        detectadoPor:state.auditor.trim(),fecha:w.fecha,creado:new Date().toISOString()});
      n++;
      const fotos=(w.fotos||{})[it.id]||[];
      for(const f of fotos){
        if(it.sinFoto)break;
        await guardarDoc(COL.ev+'/'+uid('e-'),{auditoriaId:id,hallazgoId:hid,sitioId:sec.sitioId,sectorId:sec.id,sectorNombre:sec.nombre,fecha:w.fecha,
          nombre:f.nombre||'foto.jpg',mime:f.mime,esImagen:true,bytes:f.bytes,ancho:f.ancho,alto:f.alto,data:f.data,url:'',
          nota:(rr.obs||'').trim()||it.texto,subidoPor:state.auditor.trim(),creado:new Date().toISOString()});
        nf++;

  }
  state.wiz=null;

        <td>${habOk(s)?'<span class="badge ok dot">Sí</span>':`<span class="badge warn">${habN(s)}/6</span>`}</td></tr>`;

    ${state.buenas.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha))).slice(0,5).map(b=>`<tr><td><b>${esc(b.sectorNombre)}</b></td><td>${esc(b.descripcion)}</td><td class="mono num">${fmtDate(b.fecha)}</td></tr>`).join('')}

}

/* ================= checklists ================= */
function vChecklists(){
  if(state.editCl)return editorChecklist(state.editCl);
  state.clf=state.clf||{g:'all',q:''};
  const grupoDe=c=>c.pilar?'pilar':((c.sectores&&c.sectores.length)?'sector':'tipo');
  const todas=state.checklists.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
  const q=state.clf.q.trim().toLowerCase();
  const cs=todas.filter(c=>{
    if(state.clf.g==='inactivas')return c.activa===false;
    if(state.clf.g!=='all'&&grupoDe(c)!==state.clf.g)return false;
    if(q&&String(c.nombre+' '+(c.sectores||[]).map(t=>(sectorDe(t)||{}).nombre||'').join(' ')).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  const nG=g=>todas.filter(c=>g==='inactivas'?c.activa===false:grupoDe(c)===g).length;
  return `${avisoDb()}
  <div class="head"><div><h1>Checklists</h1><p>El instrumento. Cada ítem lleva bloque (A puntúa, B es infraestructura), severidad y, si corresponde, la marca de registro sin fotografía. Las checklists <b>por sector</b> son las que usa el líder y la auditoría externa en ese sector; las <b>por tipo</b> quedan de respaldo para sectores nuevos.</p></div>
  <div class="headbtns">${esAdmin()&&Object.keys(SECTOR_5S_EXTRA).some(sid=>!state.checklists.some(c=>c.sectores&&c.sectores.indexOf(sid)>=0))?`<button class="btn" id="btnGenSector" title="Crea una checklist 5S propia por cada sector del plano">＋ Generar 5S por sector (${Object.keys(SECTOR_5S_EXTRA).filter(sid=>!state.checklists.some(c=>c.sectores&&c.sectores.indexOf(sid)>=0)).length})</button>`:''}<button class="btn" id="btnNuevaCl">＋ En blanco</button></div></div>
  <div class="filters">
    <div class="field"><label for="clfG">Ver</label><select id="clfG">${[['all','Todas ('+todas.length+')'],['sector','5S por sector ('+nG('sector')+')'],['tipo','5S por tipo ('+nG('tipo')+')'],['pilar','De pilares · Seguridad ('+nG('pilar')+')'],['inactivas','Inactivas ('+nG('inactivas')+')']].map(([v,l])=>`<option value="${v}"${state.clf.g===v?' selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field" style="min-width:220px"><label for="clfQ">Buscar sector o nombre</label><input type="search" id="clfQ" value="${esc(state.clf.q)}" placeholder="Ej.: comedor"></div>
  </div>
  ${cs.length?`<div class="grid g2">${cs.map(c=>{
    const items=(c.secciones||[]).flatMap(s=>s.items||[]);
    const nA=items.filter(i=>(i.bloque||'A')==='A').length,nB=items.length-nA;
    const usos=state.auditorias.filter(a=>a.checklistId===c.id).length;
    return `<section class="panel"><div class="body">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
        <h3 style="font-size:15px">${esc(c.nombre)}</h3>
        <div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">
          ${c.version?`<span class="badge">v${esc(c.version)}</span>`:''}
          <span class="badge a">${c.modo==='escala'?'Escala 0–4':'Binario'}</span>
          <span class="badge ${c.pilar?'warn':''}">${c.pilar?'P'+((pilarDe(c.pilar)||{}).num||'')+' '+esc((pilarDe(c.pilar)||{}).nombre||''):'Base 5S'}</span>
          <span class="badge ${c.activa===false?'':'ok'} dot">${c.activa===false?'Inactiva':'Activa'}</span></div></div>
      <p style="margin:8px 0 0;color:var(--ink-3);font-size:12.5px">${(c.secciones||[]).length} secciones · <b>${nA} ítems puntúan</b> · ${nB} de infraestructura · ${items.filter(i=>i.pilar).length} impactan en pilares · usada en ${usos} auditoría${usos===1?'':'s'}</p>
      ${(c.sectores&&c.sectores.length)?`<div class="chips" style="margin-top:9px">${c.sectores.map(t=>`<span class="chip" style="padding-right:9px;background:var(--accent-soft);color:var(--accent-2)">${esc((sectorDe(t)||{}).nombre||t)}</span>`).join('')}</div>`:((c.tipos&&c.tipos.length)?`<div class="chips" style="margin-top:9px">${c.tipos.map(t=>`<span class="chip" style="padding-right:9px">${esc((TIPOS.find(x=>x.v===t)||{}).l||t)}</span>`).join('')}</div>`:'')}
      <div style="display:flex;gap:6px;margin-top:14px;flex-wrap:wrap">
        <button class="btn sm" data-edit-cl="${esc(c.id)}">Editar</button>
        <button class="btn sm" data-dup-cl="${esc(c.id)}">Duplicar como nueva versión</button>
        <button class="btn sm" data-toggle-cl="${esc(c.id)}">${c.activa===false?'Activar':'Desactivar'}</button>
        ${usos?'':delBtn('c:'+c.id,`data-del-cl="${esc(c.id)}"`,'Eliminar')}
      </div></div></section>`;
  }).join('')}</div>`
  :'<div class="panel"><div class="empty"><b>No hay checklists</b>Creá una en blanco o duplicá una existente.</div></div>'}`;
}

/* ================= CSV ================= */
function csv(rows){return rows.map(r=>r.map(c=>{const s=String(c==null?'':c);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\r\n')}
async function bajar(nombre,texto){
  let dl=null;
  try{dl=(typeof claude!=='undefined'&&claude.use)?await claude.use('downloads'):null}catch(e){}
  if(dl){
    try{await dl.save({filename:nombre,data:texto});toast('Archivo generado');return}
    catch(e){if(e&&e.code==='cancelled')return}
  }
  try{
    const blob=new Blob([texto],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
    toast('Archivo generado');
  }catch(e){toast('No se pudo generar el archivo')}
}

/* ================= eventos ================= */
function toast(msg){
  $$('.toast').forEach(x=>x.remove());
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);setTimeout(()=>el.remove(),3400);
}
const tip=document.createElement('div');tip.className='tip';tip.hidden=true;document.body.appendChild(tip);
function placeTip(e){
  const r=tip.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;
  if(x+r.width>innerWidth-10)x=e.clientX-r.width-14;
  if(y+r.height>innerHeight-10)y=e.clientY-r.height-14;
  tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px';
}
document.addEventListener('mouseover',e=>{
  const t=e.target.closest&&e.target.closest('[data-tip]');if(!t)return;
  tip.innerHTML='<b>'+esc(t.dataset.tip)+'</b>'+(t.dataset.tipd?'<br>'+esc(t.dataset.tipd):'');
  tip.hidden=false;placeTip(e);
});
document.addEventListener('mousemove',e=>{if(!tip.hidden)placeTip(e)});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('[data-tip]'))tip.hidden=true});
window.addEventListener('scroll',()=>{tip.hidden=true},{passive:true});

document.addEventListener('keydown',e=>{
  if(state.subida&&e.key==='Escape'){state.subida=null;render();return}
  if(state.tour!=null){
    if(e.key==='Escape'){state.tour=null;try{localStorage.setItem('cat.tour','1')}catch(err){}render()}
    else if(e.key==='ArrowRight'){state.tour=Math.min(TOUR.length-1,state.tour+1);render()}
    else if(e.key==='ArrowLeft'){state.tour=Math.max(0,state.tour-1);render()}
    return;
  }
  if(state.lightbox&&e.key==='Escape'){state.lightbox=null;render();return}
  if(!state.tv.on)return;
  if(e.key==='Escape'){tvOff()}
  else if(e.key===' '){e.preventDefault();state.tv.pausa=!state.tv.pausa;renderTV()}
  else if(e.key==='ArrowRight'){state.tv.i++;renderTV()}
  else if(e.key==='ArrowLeft'){const n=tvSlides().length;state.tv.i=(state.tv.i-1+n)%n;renderTV()}
});

      pilCfg().pilares.map(p=>`<button class="nav sub" data-view="pilares" data-pilnav="${p.id}"${ds}><span class="pn">P${p.num}</span>${esc(p.nombre)}</button>`).join('');
    /* en las plantas, la etiqueta de pallet va directo, sin carpeta intermedia: es lo que más se usa */
    const prod=g.id==='industria'?navItem('etiquetas',ds):'';
    return prod+navFold('s:'+st.id+':5s','5S',m5,'lvl')+navFold('s:'+st.id+':pil','Pilares',pil,'lvl');
  };
  GRUPOS.forEach(g=>{
    const delGrupo=todos.filter(x=>x.grupo===g.id);
    const visible=x=>!soloSitio||x.id===soloSitio||delGrupo.some(c=>c.padre===x.id&&c.id===soloSitio);
    const raiz=delGrupo.filter(x=>!x.padre).filter(visible);
    if(!raiz.length)return;
    h+=navFold('g:'+g.id,g.nombre,raiz.map(st=>{
      const hijos=delGrupo.filter(c=>c.padre===st.id).filter(x=>!soloSitio||x.id===soloSitio);
      if(hijos.length){
        /* sitio con plantas adentro (Planta Itauguá): cada planta es su propia carpeta */
        const cuerpo=hijos.map(c=>navFold('s:'+c.id,c.corto,bloqueSitio(c,g),'site',` data-selsitio="${c.id}"`)).join('')
          +(soloSitio&&soloSitio!==st.id?'':navFold('s:'+st.id+':gen','Complejo · general',bloqueSitio(st,g),'lvl'));
        return navFold('s:'+st.id,st.corto,cuerpo,'site',` data-selsitio="${st.id}"`);
      }
      return navFold('s:'+st.id,st.corto,bloqueSitio(st,g),'site',` data-selsitio="${st.id}"`);
    }).join(''));
  });
  h+=`<div class="navlabel">Configuración</div>`+navItem('checklists')+navItem('sectores')+navItem('usuarios')+navItem('bitacora');
  return h;
}

/* los sitios del grupo existen siempre en la estructura, aunque todavía no tengan sectores */
async function asegurarSitios(){
  /* Antes de escribir se lee la versión más reciente de la base: así no se pisan
     sectores cargados desde otra pantalla o por una importación en curso. */
  const faltan=SITIOS_CAT.some(c=>!state.sitios.some(x=>x.id===c.id))||state.sitios.some(x=>!x.grupo);
  if(!faltan||!state.db)return;
  let base=state.sitios;
  try{const sn=await state.db.doc('config/estructura').get();const d=sn&&sn.exists?sn.data():null;if(d&&Array.isArray(d.sitios))base=d.sitios}catch(e){}
  base=JSON.parse(JSON.stringify(base||[]));
  let cambio=false;
  SITIOS_CAT.forEach(c=>{const x=base.find(x=>x.id===c.id);if(!x){base.push(Object.assign({id:c.id,nombre:c.nombre,ciudad:c.ciudad,grupo:c.grupo,sectores:[]},c.padre?{padre:c.padre}:{}));cambio=true}else if(!x.grupo){x.grupo=c.grupo;cambio=true}});
  /* nunca guardar una estructura con menos sectores que la que ya tiene la base */
  const nSect=l=>l.reduce((t,x)=>t+((x.sectores||[]).length),0);
  if(cambio&&nSect(base)>=nSect(state.sitios)){state.sitios=base;await guardarEstructura()}
}

/* ================= evolución por sector =================
   "Este sector está a tanto %, y subió tantos puntos respecto a su auditoría anterior." */
function sparkHTML(vals){
  if(vals.length<2)return '';
  const W=150,H=38,P=4;const x=i=>P+i*(W-2*P)/(vals.length-1),y=v=>H-P-(v/100)*(H-2*P);
  const d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true" style="display:block">
    <line x1="${P}" y1="${y(VERDE).toFixed(1)}" x2="${W-P}" y2="${y(VERDE).toFixed(1)}" stroke="var(--line-strong)" stroke-dasharray="3 3"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===vals.length-1?3.5:2.5}" fill="${i===vals.length-1?'var(--accent)':'var(--surface)'}" stroke="var(--accent)" stroke-width="1.5"/>`).join('')}
  </svg>`;
}
function evolucion(){
  const secs=todosSectores().filter(s=>state.f.sitio==='all'||s.sitioId===state.f.sitio).filter(s=>state.f.zona==='all'||s.zona===state.f.zona);
  const ext=state.auditorias.filter(a=>tipoAud(a)!=='interna'&&validada(a)&&es5S(a)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const per=state.pil.per;
  return secs.map(sec=>{
    const suyas=ext.filter(a=>a.sectorId===sec.id&&a.pct!=null);
    const ult=suyas[0]||null,prev=suyas[1]||null;
    const pct=ult?ult.pct:null,pctPrev=prev?prev.pct:null;
    const delta=(pct!=null&&pctPrev!=null)?Math.round((pct-pctPrev)*10)/10:null;
    const rel=(delta!=null&&pctPrev>0)?Math.round(delta/pctPrev*100):null;
    const serie=suyas.slice(0,8).reverse().map(a=>a.pct);
    const ab=state.hallazgos.filter(h=>h.sectorId===sec.id&&abierto(h)).length;
    const crit=criticosAbiertosDe(sec.id);
    const pil=pilCfg().pilares.map(p=>({p,v:pondPilarSector(p,sec.id,per).v})).filter(x=>x.v!=null);
    const pilProm=pil.length?Math.round(pil.reduce((s,x)=>s+x.v,0)/pil.length*10)/10:null;
    return{sec,ult,prev,pct,pctPrev,delta,rel,serie,ab,crit,pil,pilProm,n:suyas.length};
  });
}
function vEvolucion(){
  if(state.db&&!state.loaded.au)return `<div class="head"><div><h1>Evolución por sector</h1><p>Cargando datos…</p></div></div>`;
  let filas=evolucion();
  const mio=state.sesion&&state.sesion.rol==='sector'?state.sesion.sectorId:null;
  const orden=state.evoOrden||'mejora';
  filas.sort((a,b)=>{
    if(mio){if(a.sec.id===mio)return -1;if(b.sec.id===mio)return 1}
    if(orden==='mejora'){const da=a.delta==null?-1e9:a.delta,db=b.delta==null?-1e9:b.delta;return db-da||(b.pct||0)-(a.pct||0)}
    if(orden==='puntaje'){return (b.pct==null?-1:b.pct)-(a.pct==null?-1:a.pct)}
    return a.sec.nombre.localeCompare(b.sec.nombre);
  });
  const conD=filas.filter(f=>f.delta!=null);
  const mej=conD.filter(f=>f.delta>0),peor=conD.filter(f=>f.delta<0),igual=conD.filter(f=>f.delta===0);
  const top=mej.length?mej.slice().sort((a,b)=>b.delta-a.delta)[0]:null;
  const sinComp=filas.filter(f=>f.delta==null);
  const frase=f=>{
    if(f.pct==null)return 'Todavía no tiene auditoría 5S cargada.';
    if(f.delta==null)return `Primera auditoría (${fmtDate(f.ult.fecha)}). La próxima ya se compara con esta.`;
    const dir=f.delta>0?'subió':(f.delta<0?'bajó':'quedó igual');
    const pts=f.delta===0?'':` <b>${f.delta>0?'+':''}${n1(f.delta)} puntos</b>`;
    const relTxt=f.rel!=null&&f.delta!==0?` (${f.delta>0?'mejoró':'empeoró'} un ${Math.abs(f.rel)} %)`:'';
    return `Estaba en ${n1(f.pctPrev)} % el ${fmtDate(f.prev.fecha)} y ${dir}${pts}${relTxt}. Ahora está en <b>${n1(f.pct)} %</b>.`;
  };
  return `${avisoDb()}
  <div class="head"><div><div class="eyebrow2">${esc(sitioActual().corto)}</div><h1>Evolución por sector</h1><p>Dónde está cada sector hoy y cuánto se movió respecto a su auditoría 5S anterior. Solo cuentan las auditorías externas validadas.</p></div>
    <div class="headbtns"><div class="field" style="min-width:170px"><label for="evoOrden">Ordenar por</label><select id="evoOrden">
      <option value="mejora"${orden==='mejora'?' selected':''}>Mayor mejora</option><option value="puntaje"${orden==='puntaje'?' selected':''}>Puntaje actual</option><option value="nombre"${orden==='nombre'?' selected':''}>Nombre</option></select></div></div></div>
  ${filtrosHTML()}
  <div class="grid g4" style="margin-bottom:18px">
    <div class="kpi tintok"><div class="k">Mejoraron</div><div class="v">${mej.length}</div><div class="m">sectores con más puntos que en su auditoría anterior</div></div>
    <div class="kpi ${peor.length?'tint':''}"><div class="k">Bajaron</div><div class="v">${peor.length}</div><div class="m">${igual.length?igual.length+' quedaron igual · ':''}${sinComp.length} sin comparación todavía</div></div>
    <div class="kpi"><div class="k">Mayor mejora</div><div class="v" style="font-size:26px;margin-top:10px">${top?esc(top.sec.nombre):'—'}</div><div class="m">${top?`<span class="delta up">+${n1(top.delta)} puntos</span> · de ${n1(top.pctPrev)} % a ${n1(top.pct)} %`:'Se necesita una segunda auditoría por sector'}</div></div>
    <div class="kpi"><div class="k">Promedio del movimiento</div><div class="v">${conD.length?(conD.reduce((s,f)=>s+f.delta,0)/conD.length>=0?'+':'')+n1(conD.reduce((s,f)=>s+f.delta,0)/conD.length):'—'}</div><div class="m">puntos entre la anterior y la última, en ${conD.length} sector${conD.length===1?'':'es'}</div></div>
  </div>
  <div class="evogrid">${filas.map(f=>{const nv=nivel(f.pct);const esMio=mio&&f.sec.id===mio;
    return `<section class="evocard${esMio?' mio':''}" data-secjump="${esc(f.sec.id)}">
      <div class="et"><div><b>${esc(f.sec.nombre)}</b><span>${(f.sec.zona||'operativa')==='apoyo'?'Zona de apoyo':'Zona operativa'}${esMio?' · <b style="color:var(--accent)">tu sector</b>':''}</span></div>
        <span class="badge ${f.pct==null?'':nv.k+' dot'}">${f.pct==null?'sin dato':nv.l}</span></div>
      <div class="ev"><div class="evv">${f.pct==null?'—':n1(f.pct)+'<small>%</small>'}</div>
        <div class="evd">${f.delta==null?'<span class="delta eq">sin comparación</span>':`<span class="delta ${f.delta>0?'up':(f.delta<0?'dn':'eq')}">${f.delta>0?'▲ +':(f.delta<0?'▼ ':'= ')}${n1(Math.abs(f.delta))} pts</span>${f.rel!=null&&f.delta!==0?`<i>${f.delta>0?'+':'−'}${Math.abs(f.rel)} % vs. anterior</i>`:''}`}</div>
        ${sparkHTML(f.serie)}</div>
      <p class="ef">${frase(f)}</p>
      <div class="lidfila">${(()=>{const au=auditadoDe(f.sec);return au.nombre?`<span class="lr">${esc(au.rol)}</span><b>${esc(au.nombre)}</b>`:'<span class="lr">Líder 5S</span><i style="color:var(--warn);font-style:normal;font-weight:600">sin asignar</i>'})()}</div>
      <div class="em"><span>${f.n} auditoría${f.n===1?'':'s'}</span><span>${f.ab} hallazgo${f.ab===1?'':'s'} abierto${f.ab===1?'':'s'}${f.crit?` · <b style="color:var(--crit)">${f.crit} crítico${f.crit===1?'':'s'}</b>`:''}</span><span>${f.pilProm==null?'Pilares: sin dato':`Pilares ${esc(fmtMes(state.pil.per))}: <b>${n1(f.pilProm)} %</b>`}</span></div>
    </section>`}).join('')}</div>`;
}

 PILAR SEGURIDAD – CDSA</h3>\n<p>El pilar se gestiona mediante 5 componentes, alineados a ISO 45001 pero bajados a piso.</p>\n<h3>1️⃣ Identificación de Peligros y Evaluación de Riesgos (IPER)</h3>\n<h3>Qué involucra</h3>\n<ul>\n<li>Identificación de peligros por puesto y actividad:</p>\n<ul>\n<li><p>Uso de autoelevadores y transpaletas</li>\n<li>Carga y descarga de camiones</li>\n<li>Trabajo en racks y altura</li>\n<li>Tránsito interno peatón–vehículo</li>\n<li>Manipulación manual de cargas</li>\n</ul></li>\n<li>Evaluación del nivel de riesgo</li>\n<li>Priorización de riesgos críticos</li>\n</ul>\n<p>Obligatorio por Ley 5804/17 y eje central de ISO 45001.</p>\n<h3>Para qué se usa</h3>\n<ul>\n<li>Prevenir accidentes</li>\n<li>Definir controles y prioridades</li>\n<li>Tomar decisiones basadas en riesgo</li>\n</ul>\n<h3>Gestión CAT</h3>\n<ul>\n<li>Matriz de riesgos del CDSA</li>\n<li>Revisión periódica</li>\n<li>Actualización ante cambios operativos</li>\n</ul>\n<h3>2️⃣ Control Operacional y Medidas Preventivas</h3>\n<h3>Qué involucra</h3>\n<p>Aplicación de medidas de control sobre los riesgos identificados.</p>\n<p>Incluye:</p>\n<ul>\n<li>Procedimientos seguros de trabajo</li>\n<li>Señalización y demarcación interna</li>\n<li>Separación peatón / equipos móviles</li>\n<li>Gestión y uso de EPP</li>\n<li>Permisos de trabajo (altura, contratistas, tareas especiales)</li>\n<li>LOTO para mantenimiento de equipos logísticos</li>\n</ul>\n<p>Responde al Reglamento Técnico de Seguridad e Higiene y a ISO 45001 – Control Operacional.</p>\n<h3>3️⃣ Capacitación, Conciencia y Participación</h3>\n<h3>Qué involucra</h3>\n<ul>\n<li>Capacitación obligatoria (con cronograma y plan pre establecido) en:</p>\n<ul>\n<li><p>Seguridad básica</li>\n<li>Riesgos del puesto</li>\n<li>Uso de EPP</li>\n<li>Manejo seguro de equipos</li>\n</ul></li>\n<li>Inducción de personal nuevo</li>\n<li>Reinducciones periódicas</li>\n<li>Promoción de reporte de condiciones inseguras</li>\n</ul>\n<p>La participación de los trabajadores es obligatoria según la Ley 5804/17 e ISO 45001.</p>\n<h3>4️⃣ Gestión de Incidentes, Accidentes y Emergencias</h3>\n<h3>Qué involucra</h3>\n<ul>\n<li>Reporte de:</p>\n<ul>\n<li><p>Accidentes con y sin tiempo perdido</li>\n<li>Incidentes y cuasi accidentes</li>\n</ul></li>\n<li>Investigación de causas raíz</li>\n<li>Definición y seguimiento de acciones correctivas</li>\n<li>Preparación y respuesta ante emergencias:</p>\n<ul>\n<li><p>Incendio</li>\n<li>Derrames</li>\n<li>Accidentes graves</li>\n</ul></li>\n</ul>\n<p>Obligatorio por ley y clave en ISO 45001 (investigación y mejora).</p>\n<h3>Gestión CAT</h3>\n<ul>\n<li>5 Porqués obligatorio</li>\n<li>Registro y análisis mensual</li>\n<li>Mini proyectos de seguridad</li>\n</ul>\n<h3>5️⃣ Cumplimiento Legal, Seguimiento y Mejora Continua</h3>\n<h3>Qué involucra</h3>\n<ul>\n<li>Identificación y actualización de requisitos legales SST</li>\n<li>Seguimiento de inspecciones y fiscalizaciones</li>\n<li>Auditorías internas de seguridad</li>\n<li>Revisión periódica del desempeño</li>\n<li>Mejora continua del sistema</li>\n</ul>\n<p>ISO 45001 exige cumplimiento legal y mejora continua; la DSSO fiscaliza su aplicación.</p>\n<h3>📊 INDICADORES DEL PILAR (fase inicial)</h3>\n<ul>\n<li>Nº de accidentes con tiempo perdido</li>\n<li>Nº de incidentes / cuasi accidentes reportados</li>\n<li>% personal capacitado en seguridad</li>\n<li>% acciones de seguridad cerradas en plazo</li>\n<li>Nº de observaciones legales abiertas</li>\n</ul>\n<h3>🛠 HERRAMIENTAS CAT DEL PILAR</h3>\n<ul>\n<li>IPER / matriz de riesgos</li>\n<li>5 Porqués</li>\n<li>Mini Proyectos CAT de seguridad</li>\n<li>Observaciones de seguridad</li>\n<li>Gestión estructurada de acciones</li>\n</ul>", "calidad": "<h2>PILAR 2 – CALIDAD (Centro de Distribución)</h2>\n<h3>CALIDAD – PRODUCTO PROTEGIDO Y PEDIDO CONFIABLE</h3>\n<h3>Enfoque del pilar</h3>\n<p>Asegurar que los productos almacenados y distribuidos desde el Centro de Distribución se mantengan <strong>seguros, protegidos y conformes</strong>, cumpliendo:</p>\n<ul>\n<li>Cumplimiento sanitario y legal (DINAVISA)</li>\n<li>Control de inocuidad y calidad en almacenamiento y distribución (FSSC 22000).</li>\n<li>Exactitud del pedido y protección del producto hasta el cliente.</li>\n</ul>\n<h3>COMPONENTES DEL PILAR</h3>\n<h3>1️⃣ Buenas Prácticas de Almacenamiento y Distribución (BPA – CDSA)</h3>\n<h3>Qué involucra</h3>\n<h3>🔹 Infraestructura y condiciones generales</h3>\n<ul>\n<li>Limpieza y orden del depósito</li>\n<li>Pisos, paredes y techos en condiciones adecuadas</li>\n<li>Iluminación y ventilación</li>\n<li>Protección contra plagas</li>\n<li>Áreas definidas: recepción, almacenamiento, despacho, devoluciones</li>\n</ul>\n<h3>🔹 Almacenamiento correcto</h3>\n<ul>\n<li>Uso de tarimas</li>\n<li>Separación de paredes y piso</li>\n<li>Protección frente a humedad, calor y luz directa</li>\n<li>Apilado seguro y estable</li>\n</ul>\n<h3>🔹 Segregación por estado y tipo</h3>\n<ul>\n<li>Producto conforme</li>\n<li>Producto devuelto</li>\n<li>Producto dañado / vencido / retenido</li>\n<li>Separación por tipo de producto:</p>\n<ul>\n<li><p>Alimentos</li>\n<li>Cosméticos / higiene personal</li>\n</ul></li>\n</ul>\n<h3>🔹 Limpieza y control de plagas</h3>\n<ul>\n<li>Planes definidos</li>\n<li>Registros básicos</li>\n<li>Productos de limpieza separados del producto</li>\n</ul>\n<h3>🔹 Recepción y despacho</h3>\n<ul>\n<li>Control visual de envases</li>\n<li>Manipulación cuidadosa</li>\n<li>Prevención de golpes, caídas y mezclas indebidas</li>\n</ul>\n<h3>🔹 Productos no conformes</h3>\n<ul>\n<li>Área identificada</li>\n<li>Bloqueo de stock</li>\n<li>Definición de destino</li>\n</ul>\n<h3>Para qué se usa el BPA</h3>\n<ul>\n<li>Cumplir DINAVISA</li>\n<li>Proteger la calidad del producto</li>\n<li>Evitar sanciones y rechazos</li>\n<li>Asegurar condiciones estables de operación</li>\n</ul>\n<h3>Cómo se gestiona en CAT</h3>\n<ul>\n<li>Check list BPA</p>\n<ul>\n<li><p>con columnas: alimentos / gluten / cosméticos</li>\n</ul></li>\n<li>Auditorías internas CAT</li>\n<li>Gestión de desvíos y acciones</li>\n<li>Mini proyectos de orden, layout y segregación</li>\n</ul>\n<h3>2️⃣ Prevención de Contaminación</h3>\n<h3>Alérgenos y Gluten</h3>\n<h3>Qué involucra</h3>\n<p>Gestión específica del riesgo de <strong>contaminación cruzada</strong>, principalmente por:</p>\n<ul>\n<li>Alérgenos</li>\n<li>Gluten (alérgeno crítico)</li>\n</ul>\n<p>Incluye:</p>\n<ul>\n<li>Identificación de productos con alérgenos</li>\n<li>Mapa de alérgenos por zonas del CDSA</li>\n<li>Segregación física o por barreras</li>\n<li>Señalización clara</li>\n<li>Control de errores de picking</li>\n<li>Limpieza dirigida en zonas de riesgo</li>\n<li>Control de rotulación (evitar mix-up)</li>\n</ul>\n<h3>Para qué se usa</h3>\n<ul>\n<li>Proteger la salud del consumidor</li>\n<li>Evitar errores críticos</li>\n<li>Cumplir requisitos sanitarios y de cliente</li>\n</ul>\n<h3>Cómo se gestiona en CAT</h3>\n<ul>\n<li>Check list de control de contaminación</li>\n<li>5 Porqués para errores o eventos</li>\n<li>Mini proyectos CAT de segregación y orden</li>\n</ul>\n<h3>3️⃣ Gestión de Distribuidores (Cadena Extendida)</h3>\n<h3>Qué involucra</h3>\n<p>Control de las condiciones de almacenamiento y manejo del producto <strong>fuera del CDSA</strong>.</p>\n<p>Incluye:</p>\n<ul>\n<li>Requisitos documentales anuales</li>\n<li>Evaluación de BPA en distribuidores</li>\n<li>Visitas de inspección con check list</li>\n<li>Informes formales</li>\n<li>Seguimiento de acciones correctivas</li>\n</ul>\n<h3>Para qué se usa</h3>\n<ul>\n<li>Asegurar calidad más allá del CDSA</li>\n<li>Reducir reclamos</li>\n<li>Profesionalizar la red logística</li>\n</ul>\n<h3>Cómo se gestiona en CAT</h3>\n<ul>\n<li>Check list BPA distribuidores</li>\n<li>Informes y acciones</li>\n<li>Seguimiento estructurado</li>\n</ul>\n<h3>4️⃣ Gestión de Errores, Reclamos y Desvíos de Servicio <mark>VER METER LOS INDICADORES DE TIEMPO DE OPERACIONES. Ver con Wilson.</mark></h3>\n<h3>Qué involucra</h3>\n<p>Gestión estructurada de:</p>\n<ul>\n<li>Errores de picking</li>\n<li>Daños de producto</li>\n<li>Reclamos de clientes</li>\n<li>Desvíos operativos</li>\n</ul>\n<p>Incluye:</p>\n<ul>\n<li>Registro de eventos</li>\n<li>Análisis de causa raíz</li>\n<li>Acciones correctivas y preventivas</li>\n<li>Aprendizaje operativo</li>\n</ul>\n<h3>Cómo se gestiona en CAT</h3>\n<ul>\n<li>5 Porqués obligatorio</li>\n<li>Mini proyectos de mejora</li>\n<li>Gestión disciplinada de acciones</li>\n</ul>\n<h3>📊 INDICADORES (fase inicial)</h3>\n<ul>\n<li>% cumplimiento BPA CD</li>\n<li>Nº desvíos de almacenamiento</li>\n<li>Nº errores de despacho</li>\n<li>Nº eventos de contaminación / mezcla</li>\n<li>% distribuidores evaluados vs plan</li>\n<li>% acciones correctivas cerradas</li>\n</ul>\n<h3>🛠 HERRAMIENTAS CAT DEL PILAR</h3>\n<ul>\n<li>Check lists estructurados</li>\n<li>5 Porqués</li>\n<li>Mini Proyectos CAT (30–90 días)</li>\n<li>Gestión visual</li>\n<li>Gestión de acciones</li>\n</ul>", "mantenimiento": "<h2>PILAR MANTENIMIENTO – CAT</h2>\n<h3>Centro de Distribución CDSA</h3>\n<h3>1. Propósito del Pilar</h3>\n<p>Garantizar que <strong>todas las instalaciones, el perímetro y los equipos del CDSA</strong> se mantengan en condiciones <strong>seguras, operativas, higiénicas y confiables</strong>, asegurando:</p>\n<ul>\n<li>Cumplimiento de <strong>Buenas Prácticas de Almacenamiento (BPA)</strong></li>\n<li>Protección de la inocuidad de los productos</li>\n<li>Continuidad operativa</li>\n<li>Seguridad de las personas</li>\n<li>Preservación de los activos</li>\n</ul>\n<p>El Pilar Mantenimiento es un <strong>pilar habilitador</strong> del sistema CAT: sin mantenimiento adecuado, no hay calidad, seguridad ni eficiencia.</p>\n<h3>2. Alcance</h3>\n<p>Aplica a todo el CDSA, incluyendo:</p>\n<ul>\n<li>Infraestructura edilicia</li>\n<li>Perímetro y áreas externas</li>\n<li>Equipos de operación y soporte</li>\n<li>Áreas de alimentos y no alimentos</li>\n<li>Almacenamiento a temperatura ambiente y congelado</li>\n<li>Zonas de carga y descarga</li>\n</ul>\n<p>Incluye todos los productos almacenados en CDSA.</p>\n<h3>3. Principios CAT aplicados al Mantenimiento</h3>\n<p>Este pilar se basa en los siguientes principios:</p>\n<ul>\n<li><h3>Prevención antes que corrección</h3></li>\n<li><h3>Mantenimiento planificado y documentado</h3></li>\n<li><h3>Participación operativa</h3></li>\n<li><h3>Control de riesgos de contaminación</h3></li>\n<li><h3>Simplicidad y disciplina</h3></li>\n</ul>\n<h3>4. Estructura del Pilar Mantenimiento</h3>\n<p>El Pilar se organiza en <strong>tres subpilares</strong>:</p>\n<h3>4.1 Mantenimiento Edilicio</h3>\n<h3>4.2 Mantenimiento Perimetral</h3>\n<h3>4.3 Mantenimiento de Equipos</h3>\n<h3>5. Subpilar 1 – Mantenimiento Edilicio</h3>\n<h3>5.1 Objetivo</h3>\n<p>Mantener las instalaciones del CDSA en condiciones estructurales e higiénicas que <strong>eviten riesgos de contaminación, deterioro de productos y accidentes</strong>.</p>\n<h3>5.2 Alcance</h3>\n<p>Incluye:</p>\n<ul>\n<li>Pisos, paredes y zócalos</li>\n<li>Techos y estructuras en altura</li>\n<li>Canaletas y drenajes</li>\n<li>Iluminación</li>\n<li>Ventilación</li>\n<li>Cámaras de frío</li>\n<li>Oficinas, sanitarios y áreas comunes</li>\n<li>Compuertas de carga y descarga</li>\n</ul>\n<h3>5.3 Mantenimiento edilicio estándar</h3>\n<h3>Actividades:</h3>\n<ul>\n<li>Inspección visual de superficies</li>\n<li>Reparación de grietas, roturas o desprendimientos</li>\n<li>Mantenimiento de drenaje (con limpieza, adecuaciones y correcta protección)</li>\n<li>Revisión de iluminación y ventilación</li>\n</ul>\n<h3>Frecuencia:</h3>\n<ul>\n<li>Inspección: mensual</li>\n<li>Preventivo: semestral</li>\n<li>Correctivo: inmediato según criticidad</li>\n</ul>\n<h3>5.4 Mantenimiento edilicio especial</h3>\n<h3>(Limpieza de techos y estructuras en altura)</h3>\n<h3>a) Principio</h3>\n<p>Toda superficie elevada que pueda generar contaminación indirecta debe mantenerse bajo control, aunque no sea accesible en la operación diaria.</p>\n<h3>b) Alcance</h3>\n<ul>\n<li>Techos</li>\n<li>Vigas</li>\n<li>Canaletas</li>\n<li>Luminarias altas</li>\n<li>Estructuras metálicas</li>\n<li>Elementos elevados sobre áreas de almacenamiento</li>\n</ul>\n<h3>c) Modalidad</h3>\n<ul>\n<li>Actividad <strong>programada especial</strong></li>\n<li>Ejecución por:</p>\n<ul>\n<li><p>Empresa externa especializada, o</li>\n<li>Personal interno capacitado en trabajos en altura</li>\n</ul></li>\n<li>Sin presencia de producto expuesto debajo</li>\n</ul>\n<h3>d) Frecuencia orientativa</h3>\n<ul>\n<li>Áreas de alimentos: 1–2 veces al año</li>\n<li>Áreas no alimentarias: 1 vez al año</li>\n<li>Ajustable según inspección documentada</li>\n</ul>\n<h3>e) Registros obligatorios</h3>\n<ul>\n<li>Plan anual de limpieza de techos</li>\n<li>Orden de trabajo</li>\n<li>Checklist de ejecución</li>\n<li>Liberación del área</li>\n</ul>\n<h3>5.5 Mantenimiento de compuertas de carga y descarga</h3>\n<h3>a) Importancia</h3>\n<p>Las compuertas son puntos críticos de:</p>\n<ul>\n<li>Ingreso de polvo</li>\n<li>Ingreso de plagas</li>\n<li>Contaminación cruzada</li>\n<li>Riesgos de seguridad</li>\n</ul>\n<h3>b) Actividades mínimas</h3>\n<ul>\n<li>Limpieza de portones, guías y burletes</li>\n<li>Inspección de sellos y cierres</li>\n<li>Reparación de daños</li>\n<li>Verificación de funcionamiento seguro</li>\n</ul>\n<h3>c) Frecuencia</h3>\n<ul>\n<li>Limpieza básica: mensual</li>\n<li>Inspección técnica: trimestral</li>\n<li>Mantenimiento preventivo: semestral</li>\n</ul>\n<h3>d) Registros</h3>\n<ul>\n<li>Checklist de compuertas</li>\n<li>Registro de fallas</li>\n<li>Orden de trabajo</li>\n</ul>\n<h3>6. Subpilar 2 – Mantenimiento Perimetral</h3>\n<h3>6.1 Objetivo</h3>\n<p>Evitar riesgos externos que puedan afectar la seguridad, la inocuidad o la operación del CDSA.</p>\n<h3>6.2 Alcance</h3>\n<ul>\n<li>Cercos</li>\n<li>Portones externos</li>\n<li>Iluminación perimetral</li>\n<li>Drenajes externos</li>\n<li>Accesos vehiculares y peatonales</li>\n<li>Estacionamiento</li>\n<li>Patio</li>\n<li>Zonas de maniobra de camiones</li>\n</ul>\n<h3>6.3 Actividades</h3>\n<ul>\n<li>Recorridas de inspección</li>\n<li>Reparación de daños</li>\n<li>Control de acumulación de residuos</li>\n<li>Coordinación con control de plagas</li>\n</ul>\n<h3>6.4 Frecuencia</h3>\n<ul>\n<li>Inspección: semanal</li>\n<li>Mantenimiento preventivo: semestral</li>\n</ul>\n<h3>7. Subpilar 3 – Mantenimiento de Equipos</h3>\n<h3>7.1 Objetivo</h3>\n<p>Asegurar la confiabilidad, disponibilidad y seguridad de los equipos utilizados en el CDSA.</p>\n<h3>7.2 Alcance</h3>\n<ul>\n<li>Cámaras frigoríficas</li>\n<li>Equipos de movimiento (zorras, apiladores)</li>\n<li>Racks</li>\n<li>Equipos eléctricos</li>\n<li>Equipos de medición de temperatura</li>\n<li>Infraestructura asociada a equipos</li>\n</ul>\n<h3>7.3 Enfoque CAT</h3>\n<p>Se aplica un modelo con tres niveles:</p>\n<ol type=\"1\">\n<li><h3>Mantenimiento autónomo</h3>\n<ul>\n<li>Limpieza</li>\n<li>Inspección básica</li>\n<li>Detección temprana de fallas</li>\n</ul></li>\n<li><h3>Mantenimiento preventivo</h3>\n<ul>\n<li>Planificado</li>\n<li>Ejecutado por mantenimiento o proveedor</li>\n</ul></li>\n<li><h3>Mantenimiento correctivo</h3>\n<ul>\n<li>Registrado</li>\n<li>Analizado para evitar recurrencias</li>\n</ul></li>\n</ol>\n<h3>7.4 Registros</h3>\n<ul>\n<li>Plan de mantenimiento de equipos</li>\n<li>Historial por equipo</li>\n<li>Registros de temperatura</li>\n<li>Órdenes de trabajo</li>\n</ul>\n<h3>8. Roles y responsabilidades</h3>\n<table>\n<colgroup>\n<col style=\"width: 52%\" />\n<col style=\"width: 47%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Rol</strong></th>\n<th><strong>Responsabilidad</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Gerencia CDSA</td>\n<td>Aprobación y seguimiento</td>\n</tr>\n<tr class=\"even\">\n<td>Líder del Pilar Mantenimiento</td>\n<td>Gestión integral del pilar</td>\n</tr>\n<tr class=\"odd\">\n<td>Supervisores</td>\n<td>Verificación operativa</td>\n</tr>\n<tr class=\"even\">\n<td>Operarios</td>\n<td>Mantenimiento autónomo</td>\n</tr>\n<tr class=\"odd\">\n<td>Proveedores externos</td>\n<td>Servicios especializados</td>\n</tr>\n</tbody>\n</table>\n<h3>9. Indicadores del Pilar</h3>\n<p>Indicadores simples y visibles:</p>\n<ul>\n<li>% mantenimiento preventivo cumplido</li>\n<li>Nº de fallas edilicias críticas</li>\n<li>Nº de paradas por fallas de equipos</li>\n<li>% equipos con mantenimiento al día</li>\n<li>Incidentes asociados a infraestructura</li>\n</ul>\n<h3>10. Resultado esperado del Pilar</h3>\n<ul>\n<li>Instalaciones seguras y controladas</li>\n<li>Reducción de fallas y urgencias</li>\n<li>Cumplimiento de BPA y auditorías</li>\n<li>Mayor vida útil de activos</li>\n<li>Cultura de cuidado del CDSA</li>\n</ul>\n<h3>11. Mensaje clave para el equipo líder del Pilar</h3>\n<p><strong>El Pilar Mantenimiento CAT no es solo “arreglar cosas”.<br />\nEs proteger productos, personas y la operación, todos los días.</strong></p>", "gestion": "<h2>PILAR – GESTIÓN</h2><p><em>Borrador en construcción. Se escribe con Óscar Benítez (Gerente General) siguiendo la plantilla única de pilar CAT.</em></p><h3>1. Propósito del pilar</h3><p class=\"hint\">Qué busca el pilar en el CDSA, en dos o tres frases.</p><p class=\"todo\">Por escribir.</p><h3>2. Marco normativo de referencia</h3><p class=\"hint\">Ley paraguaya (lo obligatorio) + norma internacional (cómo lo ordenamos). Tabla: norma · qué exige · cómo lo cubre el pilar.</p><p class=\"todo\">Por escribir.</p><h3>3. Alcance</h3><p class=\"hint\">Áreas, procesos, productos y personas que abarca.</p><p class=\"todo\">Por escribir.</p><h3>4. Principios CAT aplicados al pilar</h3><p class=\"todo\">Por escribir.</p><h3>5. Componentes / subpilares</h3><p class=\"hint\">Para cada uno: qué involucra · para qué se usa · cómo se gestiona en CAT · registros · frecuencia.</p><p class=\"todo\">Por escribir.< function limpiarHTML(h){

  d.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n=>n.remove());

}

async function guardarManual(p){
  const ed=$('#manualEdit');if(!ed)return;
  const prev=manualDe(p.id);
  const v=prev.base?1:(Number(prev.version)||1)+1;
  const ok=await guardarDoc('pilarManuales/'+manKey(p.id),{html:limpiarHTML(ed.innerHTML),version:String(v),actualizado:new Date().toISOString(),actualizadoPor:state.auditor||'—'});
  if(ok){state.pil.editManual=null;toast('Manual guardado · versión '+v);render()}
}
document.addEventListener('mousedown',e=>{

  document.execCommand(cmd,false,arg||null);
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-man]');if(!b)return;
  const p=pilarDe(state.pil.id);if(!p)return;
  const a=b.dataset.man;
  if(a==='editar'&&esAdmin()){state.pil.editManual=manualDe(p.id).html;render();setTimeout(()=>{const x=$('#manualEdit');if(x)x.focus()},50)}

});

function periodos(){
  const out=[];const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);
  for(let i=0;i<10;i++){out.push(iso(d).slice(0,7));d.setMonth(d.getMonth()-1)}
  if(out.indexOf('2026-09')<0)out.push('2026-09');
  return out;
}
/* valor de una sub-auditoría para un sector en un mes */
/* ítems del checklist 5S marcados con un pilar: cada "no cumple" en una auditoría externa o interna baja ese pilar */
function itemsPilar(pid,secIds,per){
  let c=0,e=0;const secs=new Set();
  state.auditorias.forEach(a=>{
    if(secIds.indexOf(a.sectorId)<0||!validada(a)||String(a.fecha).slice(0,7)!==per||!a.respuestas)return;
    const cl=state.checklists.find(x=>x.id===a.checklistId);if(!cl)return;
    (cl.secciones||[]).forEach(sc=>(sc.items||[]).forEach(it=>{
      if(it.pilar!==pid||(it.bloque||'A')!=='A')return;
      const r=a.respuestas[it.id];if(!r||r.v==null||r.v==='na')return;
      e++;if(!esFalla(cl,r.v))c++;secs.add(a.sectorId);
    }));
  });
  return{c,e,n:secs.size,v:e?Math.round(c/e*1000)/10:null};
}
const audsChecklist=(sub,per,p)=>state.auditorias.filter(a=>{
  if(!validada(a)||String(a.fecha).slice(0,7)!==per)return false;
  const ok=sub.checklistId?a.checklistId===sub.checklistId:(p?pilarDeAudit(a)===p.id:false);
  if(!ok)return false;
  const t=tipoAud(a);
  return sub.tipoAud?t===sub.tipoAud:t!=='interna';
});
function valorSub(p,sub,secId,per){
  if(sub.fuente==='items')return itemsPilar(p.id,[secId],per).v;
  if(sub.fuente==='checklist'){
    const auds=audsChecklist(sub,per,p).filter(a=>a.sectorId===secId);
    return auds.length?pooled(auds):null;
  }
  if(sub.fuente==='5s'){
    const auds=state.auditorias.filter(a=>a.sectorId===secId&&tipoAud(a)!=='interna'&&validada(a)&&es5S(a)&&String(a.fecha).slice(0,7)===per);
    return auds.length?pooled(auds):null;
  }
  if(sub.fuente==='hallazgos'){
    const hs=state.hallazgos.filter(h=>h.sectorId===secId&&h.estado==='cerrado'&&String(h.cerrado||'').slice(0,7)===per);
    return hs.length?Math.round(hs.filter(cerradoEnPlazo).length/hs.length*1000)/10:null;
  }
  const d=state.pp.find(x=>x.id===ppId(p.id,sub.id,secId,per));
  return d&&d.valor!=null&&d.valor!==''?Number(d.valor):null;
}
function valorSubCD(p,sub,per,secs){
  if(sub.fuente==='5s'){const ss=(secs||todosSectores());const b=base5S(per,ss);return{v:b,n:ss.filter(s=>valorSub(p,sub,s.id,per)!=null).length}}
  if(sub.fuente==='items'){const r=itemsPilar(p.id,(secs||todosSectores()).map(x=>x.id),per);return{v:r.v,n:r.n}}

  const vs=(secs||todosSectores()).map(s=>valorSub(p,sub,s.id,per)).filter(v=>v!=null);
  return vs.length?{v:Math.round(vs.reduce((a,b)=>a+b,0)/vs.length*10)/10,n:vs.length}:{v:null,n:0};

/* ponderado: suma(valor×peso) / suma(pesos con dato) */
function ponderar(pares){
  const con=pares.filter(x=>x.v!=null);
  const w=con.reduce((s,x)=>s+Number(x.peso||0),0);
  return{v:w?Math.round(con.reduce((s,x)=>s+x.v*Number(x.peso||0),0)/w*10)/10:null,cobertura:w,total:pares.reduce((s,x)=>s+Number(x.peso||0),0)};
}
const pondPilarCD=(p,per,secs)=>ponderar(p.subs.map(sub=>Object.assign({peso:sub.peso},valorSubCD(p,sub,per,secs))));
const pondPilarSector=(p,secId,per)=>ponderar(p.subs.map(sub=>({peso:sub.peso,v:valorSub(p,sub,secId,per)})));
function base5S(per,secs){
  const ids=(secs||todosSectores()).map(s=>s.id);
  const auds=state.auditorias.filter(a=>ids.indexOf(a.sectorId)>=0&&tipoAud(a)!=='interna'&&validada(a)&&es5S(a)&&String(a.fecha).slice(0,7)===per);
  return auds.length?pooled(Object.values(ultimaPorSector(auds))):null;
}

  if(t.dataset.sf&&esAdmin()){const p=pilarDe(state.pil.id);const s=p&&p.subs.find(x=>x.id===t.dataset.sid);if(!s)return;
    s[t.dataset.sf]=t.dataset.sf==='peso'?Math.max(0,Math.min(100,Number(String(t.value).replace(/[^\d]/g,''))||0)):t.value;
    await guardarPilares();render();return}
  if(t.dataset.pp&&esAdmin()){const row=t.closest('[data-pprow]');if(!row)return;
    let v=t.value;if(t.dataset.pp==='valor'){v=String(v).replace(/[^\d.,]/g,'').replace(',','.');v=v===''?'':Math.max(0,Math.min(100,Number(v)||0))}
    await guardarPP(row.dataset.pprow,t.dataset.pp,v);render();return}
});


/* ================= etiqueta de pallet (planta) =================
   Reemplaza la planilla Excel de la planta: el operario escanea el código de barras
   del producto (o lo elige), carga cajas, pallet, turno, máquina y horas; el sistema
   calcula vencimiento, lote y paquetes, arma la etiqueta con un QR legible por
   cualquier celular, la imprime y guarda el registro para trazabilidad. */
const PRODUCTOS_DEF=[
  {id:'extracto-norte-140',ean:'',nombre:'EXTRACTO NORTE DOYPACK 140GR',marca:'Norte',vidaUtilDias:730,paquetesPorCaja:50,sitioId:'pl-tomatado',activo:true}
];
const TURNOS=['Mañana','Tarde','Noche'];
const productosCfg=()=>{const d=state.productos;return (d&&Array.isArray(d.productos))?d.productos:JSON.parse(JSON.stringify(PRODUCTOS_DEF))};
const productosDe=sitioId=>productosCfg().filter(p=>p.activo!==false&&(!sitioId||!p.sitioId||p.sitioId===sitioId));
const productoPorCodigo=code=>{const c=String(code||'').replace(/\D/g,'');if(!c)return null;
  return productosCfg().find(p=>p.ean&&(p.ean===c||('0'+p.ean)===c||p.ean==='0'+c))||null};
const sitioEtiquetas=()=>restringidoASitio()?state.sesion.sitioId:(state.sitioSel||'pl-tomatado');
const fmtCorta=d=>{if(!d)return '—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0].slice(2)}`:d};
const sumarDias=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+Number(n||0));return d.toISOString().slice(0,10)};
const hoyISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const horaAhora=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const turnoAhora=()=>{const h=new Date().getHours();return h<14?'Mañana':(h<22?'Tarde':'Noche')};

function etqNuevo(){
  const s=state.sesion||{};

function etqCalc(f){
  const p=productosCfg().find(x=>x.id===f.productoId)||null;
  const cajas=Number(f.cajas)||0;
  return {p,cajas,paquetes:p?cajas*(Number(p.paquetesPorCaja)||0):0,
    vencimiento:(p&&f.fechaProduccion)?sumarDias(f.fechaProduccion,p.vidaUtilDias):'',
    lote:f.fechaProduccion?fmtCorta(f.fechaProduccion):''};

/* contenido del QR: texto plano con campo=valor, legible en cualquier celular y fácil de importar */
function etqQRTexto(e){

function qrSVG(txt,size){
  try{const q=qrcode(0,'M');q.addData(txt,'Byte');q.make();const n=q.getModuleCount();const cs=Math.max(1,Math.floor(size/(n+4)));
    return q.createSvgTag({cellSize:cs,margin:2,scalable:true}).replace('<svg ','<svg class="qr" ');}

/* cámara: usa el lector de códigos del navegador (Chrome/Edge en Android y PC). Si no existe, se escribe el código o se usa un lector USB/Bluetooth. */
let etqStream=null,etqTimer=null;
async function etqCamOn(){
  if(!('BarcodeDetector' in window)){toast('Este navegador no lee códigos con la cámara: escribí el código, usá un lector, o abrí el sistema en Chrome');return}
  state.etq.scan=true;render();
  try{
    etqStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}}});
    const v=$('#etqVideo');if(!v){etqCamOff();return}v.srcObject=etqStream;
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
    const tick=async()=>{if(!etqStream)return;try{if(v.readyState>=2){const codes=await det.detect(v);if(codes.length){const raw=codes[0].rawValue;etqCodigo(raw);etqCamOff();toast('Código leído: '+raw);render();return}}}catch(e){}
      etqTimer=setTimeout(tick,250)};
    tick();
  }catch(e){etqCamOff();toast('No se pudo abrir la cámara: '+(e&&e.name==='NotAllowedError'?'permiso denegado':(e&&e.message||'error')));render()}
}
function etqCamOff(){if(etqTimer){clearTimeout(etqTimer);etqTimer=null}if(etqStream){etqStream.getTracks().forEach(t=>t.stop());etqStream=null}if(state.etq)state.etq.scan=false}
function etqCodigo(raw){
  const f=state.etq.f;f.codigo=String(raw||'').trim();

}
function etqCSV(){

  const cell=v=>{const s=String(v==null?'':v);return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const csv=[H.join(';')].concat(rows.map(x=>[x.id,x.creado,x.nombre,x.ean,x.fechaProduccion,x.fechaVencimiento,x.lote,x.cajas,x.paquetesPorCaja,x.paquetes,x.pallet,x.turno,x.maquina,x.horaInicio,x.horaFin,x.empaquetador,x.observacion,x.creadoPor].map(cell).join(';'))).join('\r\n');
  bajar('CAT-pallets-'+hoyISO()+'.csv','﻿'+csv);
}

  if(t.id==='btnSalir'){document.body.classList.remove('navopen');guardarSesion(null);state.gateDest='';state.gateErr='';render();return}
  if(t.id==='btnGuardarDest'){

    render();return;
  }
  if(t.id==='btnNuevaCl'){state.editCl={id:uid('c-'),nombre:'',version:'1.0',modo:'binario',activa:true,tipos:[],secciones:[],creado:new Date().toISOString()};render();return}
  const ec=t.closest('[data-edit-cl]');
  if(ec){state.editCl=JSON.parse(JSON.stringify(state.checklists.find(x=>x.id===ec.dataset.editCl)));render();return}
  const dc=t.closest('[data-dup-cl]');
  if(dc){
    const c=state.checklists.find(x=>x.id===dc.dataset.dupCl);
    const copia=JSON.parse(JSON.stringify(c));copia.id=uid('c-');
    const v=parseFloat(c.version||'1.0');copia.version=(isNaN(v)?1:v+1).toFixed(1);
    (copia.secciones||[]).forEach(s=>(s.items||[]).forEach(i=>i.id=uid('i-')));
    state.editCl=copia;render();toast('Copia creada como v'+copia.version+'. La original queda intacta para no romper el histórico.');return;
  }
  const tc=t.closest('[data-toggle-cl]');
  if(tc){const c=state.checklists.find(x=>x.id===tc.dataset.toggleCl);const d=Object.assign({},c);delete d.id;d.activa=c.activa===false;await guardarDoc(COL.cl+'/'+c.id,d);return}
  const dlc=t.closest('[data-del-cl]');if(dlc){await borrarDoc(COL.cl+'/'+dlc.dataset.delCl);toast('Checklist eliminada');return}
  if(t.id==='btnCerrarCl'){state.editCl=null;render();return}
  if(t.id==='btnAddSec'){
    const n=state.editCl.secciones.length+1;
    state.editCl.secciones.push({codigo:'S'+n,nombre:'Nueva sección',jp:'',items:[{id:uid('i-'),texto:'',peso:1,bloque:'A',severidad:'menor'}]});
    render();return;
  }
  const ai=t.closest('[data-add-it]');
  if(ai){state.editCl.secciones[+ai.dataset.addIt].items.push({id:uid('i-'),texto:'',peso:1,bloque:'A',severidad:'menor'});render();return}
  const di=t.closest('[data-del-it]');
  if(di){const si=+di.closest('[data-sec]').dataset.sec;state.editCl.secciones[si].items.splice(+di.dataset.delIt,1);render();return}
  const ds=t.closest('[data-del-sec]');
  if(ds){state.editCl.secciones.splice(+ds.dataset.delSec,1);render();return}
  if(t.id==='btnSaveCl'){
    const cl=state.editCl;
    if(!String(cl.nombre||'').trim()){toast('Ponele un nombre a la checklist');return}
    cl.secciones=(cl.secciones||[]).filter(s=>String(s.nombre||'').trim());
    cl.secciones.forEach(s=>s.items=(s.items||[]).filter(i=>String(i.texto||'').trim()));
    if(!cl.secciones.reduce((n,s)=>n+s.items.length,0)){toast('La checklist necesita al menos un ítem con texto');return}
    const d=Object.assign({},cl);delete d.id;d.actualizado=new Date().toISOString();
    if(await guardarDoc(COL.cl+'/'+cl.id,d)){state.editCl=null;toast('Checklist guardada');render()}
    return;
  }

  const dsec=t.closest('[data-del-sector]');
  if(dsec){const[pi,si]=dsec.dataset.delSector.split(':').map(Number);state.sitios[pi].sectores.splice(si,1);await guardarEstructura();render();return}
  const dst=t.closest('[data-del-sitio]');
  if(dst){state.sitios.splice(+dst.dataset.delSitio,1);await guardarEstructura();render();return}
});

document.addEventListener('submit',async e=>{
  const f=e.target;
  if(f.id==='formClave'){
    e.preventDefault();
    const a=String(($('#cvNueva')||{}).value||''),b=String(($('#cvRep')||{}).value||'');
    if(a.length<6){toast('La clave tiene que tener al menos 6 caracteres');return}
    if(a!==b){toast('Las dos claves no coinciden');return}
    const hashes=await hashesDe(a);
    const uDoc=state.sesion&&state.sesion.usuario&&state.sesion.usuario!=='admin'?usuarioDe(state.sesion.usuario):null;
    if(uDoc){
      const d=Object.assign({},uDoc,{hashes,debeCambiar:false,actualizado:new Date().toISOString()});delete d.id;
      if(await guardarDoc('usuarios/'+uDoc.id,d)){state.sesion.debeCambiar=false;guardarSesion(state.sesion);toast('Listo: tu clave quedó cambiada');render()}
    }else if(esAdmin()){
      const titular=(state.acceso&&state.acceso.titular)||state.auditor||'Calidad';
      const doc={hashes,titular,definidaPor:state.auditor||'Calidad',temporal:false,actualizado:new Date().toISOString()};
      if(await guardarDoc('config/acceso',doc)){state.acceso=doc;toast('Listo: tu clave de administración quedó cambiada');render()}
    }else{
      const sid=state.sesion.sectorId;
      const sec=sectorDe(sid)||{};
      if(await guardarDoc('claves/'+sid,{hashes,definidaPor:state.auditor||'',sectorNombre:sec.nombre||'',actualizado:new Date().toISOString()}))
        toast('Listo: la clave de '+(sec.nombre||'tu sector')+' quedó cambiada');
    }
    return;
  }
  if(f.id==='formSitio'){
    e.preventDefault();
    const nombre=f.nombre.value.trim();if(!nombre){toast('Poné el nombre del sitio');return}
    state.sitios.push({id:uid('p-'),nombre,ciudad:f.ciudad.value.trim(),sectores:[]});
    await guardarEstructura();render();toast('Sitio agregado');return;
  }
  if(f.id==='formJefe'){
    e.preventDefault();
    const nombre=f.nombre.value.trim();if(!nombre){toast('Poné el nombre del jefe');return}
    const cfg=jefesCfg();
    cfg.lista=cfg.lista.concat([{id:uid('j-'),nombre,cargo:f.cargo.value.trim(),activo:true}]);
    state.jefes=cfg;if(await guardarJefes(cfg))toast('Jefe agregado');render();return;
  }
  if(f.dataset&&f.dataset.addSector!=null){
    e.preventDefault();
    const nombre=f.sector.value.trim();if(!nombre){toast('Poné el nombre del sector');return}
    state.sitios[+f.dataset.addSector].sectores.push({id:uid('s-'),nombre,tipo:f.tipo.value,zona:f.zona.value,referente:'',habilitacion:{}});
    await guardarEstructura();render();return;
  }
  if(f.dataset&&f.dataset.refAud){
    e.preventDefault();
    const a=state.auditorias.find(x=>x.id===f.dataset.refAud);if(!a)return;
    const nombre=f.nombre.value.trim(),url=f.url.value.trim();
    if(!nombre&&!url){toast('Poné el nombre o el enlace del documento');return}
    const id=uid('e-');
    if(await guardarDoc(COL.ev+'/'+id,{
      auditoriaId:a.id,hallazgoId:'',sitioId:a.sitioId,sectorId:a.sectorId,sectorNombre:a.sectorNombre,
      fecha:a.fecha,nombre:nombre||url,mime:'',esImagen:false,bytes:0,data:'',url,nota:'',
      subidoPor:state.auditor||'',creado:new Date().toISOString()}))toast('Referencia agregada');
    return;
  }
  if(f.id==='formBuena'){
    e.preventDefault();
    const d=f.descripcion.value.trim();if(!d){toast('Escribí qué se hizo bien');return}
    const s=sectorDe(f.sectorId.value)||{};
    const id=uid('b-');
    if(await guardarDoc(COL.bu+'/'+id,{sectorId:s.id||'',sectorNombre:s.nombre||'—',sitioId:s.sitioId||'',descripcion:d,fecha:f.fecha.value||todayISO(),registradoPor:state.auditor||'',creado:new Date().toISOString()}))toast('Buena práctica registrada');
    return;
  }
});

document.addEventListener('input',e=>{
  const t=e.target;
  const cr=t.closest&&t.closest('[data-crow]');
  if(cr&&t.dataset.cf&&state.carga){
    const id=cr.dataset.crow;
    state.carga.rows[id]=Object.assign({},state.carga.rows[id]||{},{[t.dataset.cf]:t.dataset.cf==='audita'?t.value:String(t.value).replace(/[^\d]/g,'')});
    // recalcular solo los totales y el % de la fila, sin re-renderizar (para no perder el foco)
    const r=state.carga.rows[id];
    const cu=r.c===''||r.c==null?null:Number(r.c), ev=r.e===''||r.e==null?null:Number(r.e);
    const pct=(ev&&cu!=null&&ev>0)?Math.round(Math.min(cu,ev)/ev*1000)/10:null;
    const nv=nivel(pct);
    const cells=cr.querySelectorAll('td');
    const off=state.carga.tipo==='interna'?1:0;
    if(cells[3+off])cells[3+off].innerHTML=`<span class="badge ${pct==null?'':nv.k} ${pct==null?'':'dot'}">${pct==null?'—':n1(pct)+'%'}</span>`;
    if(cells[4+off])cells[4+off].innerHTML=pct==null?'<span style="color:var(--ink-3)">—</span>':`<span class="badge ${nv.k}">${nv.l}</span>`;
    let sc=0,se=0;
    Object.values(state.carga.rows).forEach(x=>{const c2=Number(x.c),e2=Number(x.e);if(e2>0&&!isNaN(c2)){sc+=Math.min(c2,e2);se+=e2}});
    const tot=se?Math.round(sc/se*1000)/10:null,nvT=nivel(tot);
    const tf=cr.closest('table').querySelector('tfoot tr');
    if(tf){const tds=tf.querySelectorAll('td');
      tds[1].innerHTML='<b>'+sc+'</b>';tds[2].innerHTML='<b>'+se+'</b>';
      tds[3].innerHTML=`<span class="badge ${nvT.k==='na'?'':nvT.k} ${nvT.k==='na'?'':'dot'}">${tot==null?'—':n1(tot)+'%'}</span>`;
      tds[4].innerHTML=tot==null?'':`<span class="badge ${nvT.k}">${nvT.l}</span>`;}
    const bg=$('#btnCargaGuardar');
    if(bg){const n=Object.values(state.carga.rows).filter(x=>Number(x.e)>0&&x.c!=null&&x.c!=='').length;
      bg.disabled=!n;bg.textContent='Guardar '+(n||'')+' '+(n===1?'sector':'sectores');}
    return;
  }
  if(t.dataset&&t.dataset.imp&&t.dataset.imp!=='escenario'){
    state.impacto=Object.assign({},state.impacto,{[t.dataset.imp]:Number(String(t.value).replace(/[^\d.-]/g,''))||0});
    return;
  }
  if(t.dataset&&t.dataset.wobs!=null&&state.wiz){
    const cl=state.checklists.find(c=>c.id===state.wiz.checklistId);
    const items=(cl.secciones||[]).flatMap(s=>s.items||[]);
    const it=items[state.wiz.idx];
    state.wiz.resp[it.id]=Object.assign({},state.wiz.resp[it.id]||{},{obs:t.value});
    return;
  }
  if(t.dataset&&t.dataset.subNota!=null&&state.subida){
    const i=Number(t.dataset.subNota);
    state.subida.items[i].nota=t.value;
    const s=state.subida,listos=s.items.filter(x=>x.nota.trim().length>=4).length;
    const c=document.querySelector('.upfoot .cnt');if(c)c.textContent=listos+' de '+s.items.length+' con descripción';
    const g=document.querySelector('[data-sub="guardar"]');if(g)g.disabled=listos!==s.items.length;
    return;
  }
  if(t.id==='feQ'){
    state.fe=t.value;render();
    const el=$('#feQ');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}
    return;
  }
  if(t.id==='auditorName'){state.auditor=t.value;try{localStorage.setItem('cat.auditor',t.value)}catch(err){}return}
  if(t.matches('[data-obs]')){const it=t.closest('[data-item]').dataset.item;state.draft.resp[it]=Object.assign({},state.draft.resp[it]||{},{obs:t.value});return}
  if(state.editCl){
    if(t.id==='clNombre'){state.editCl.nombre=t.value;return}
    if(t.id==='clVersion'){state.editCl.version=t.value;return}
    const sf=t.dataset.sf;
    if(sf){state.editCl.secciones[+t.closest('[data-sec]').dataset.sec][sf]=t.value;return}
    const iff=t.dataset.if;
    if(iff){
      const si=+t.closest('[data-sec]').dataset.sec,ii=+t.closest('[data-it]').dataset.it;
      const it=state.editCl.secciones[si].items[ii];
      it[iff]=iff==='peso'?Number(t.value):(iff==='sinFoto'?t.checked:t.value);
      if(iff==='bloque')render();
      return;
    }
  }
});

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='gDest'){state.gateDest=t.value;state.gateErr='';render();return}
  if(t.dataset&&t.dataset.subHall!=null&&state.subida){
    state.subida.items[Number(t.dataset.subHall)].hallazgoId=t.value;return;
  }
  if(t.id==='fileImport'&&t.files&&t.files.length){
    const f=t.files[0];t.value='';
    try{
      const txt=await f.text();
      if(state.nube&&!confirm('Esto sube todos los registros del respaldo a la base compartida y reemplaza los que tengan el mismo identificador. ¿Continuar?'))return;
      toast('Importando…');
      const n=await state.db.importar(txt);
      registrar('modificó','Importó un respaldo ('+n+' registros)','config/respaldo');
      toast(n+' registros importados');
    }catch(e){toast('El archivo no es un respaldo válido de CAT 5S')}
    return;
  }
  if(t.dataset&&t.dataset.wfoto!=null&&t.files&&t.files.length&&state.wiz){
    const w=state.wiz;const cl=state.checklists.find(c=>c.id===w.checklistId);
    const items=(cl.secciones||[]).flatMap(x=>x.items||[]);const it=items[w.idx];
    const files=Array.from(t.files);t.value='';
    w.fotos=w.fotos||{};w.fotos[it.id]=w.fotos[it.id]||[];
    toast('Guardando foto…');
    for(const f of files){try{const out=await comprimirImagen(f);w.fotos[it.id].push({nombre:f.name,mime:'image/jpeg',data:out.data,bytes:out.bytes,ancho:out.w||0,alto:out.h||0})}catch(err){toast('No se pudo procesar la foto')}}
    render();return;
  }
  if(t.dataset&&t.dataset.upAud!=null&&t.files&&t.files.length){
    const a=state.auditorias.find(x=>x.id===t.dataset.upAud);if(!a)return;
    const files=Array.from(t.files);t.value='';
    await prepararSubida(files,{auditoriaId:a.id,sitioId:a.sitioId,sectorId:a.sectorId,sectorNombre:a.sectorNombre,fecha:a.fecha});
    return;
  }
  if(t.dataset&&t.dataset.upHall!=null&&t.files&&t.files.length){
    const h=state.hallazgos.find(x=>x.id===t.dataset.upHall);if(!h)return;
    if(h.sinFoto){toast('Este hallazgo es de un espacio personal: por protocolo no se adjuntan fotos');t.value='';return}
    const files=Array.from(t.files);t.value='';
    await prepararSubida(files,{auditoriaId:h.auditoriaId,hallazgoId:h.id,sitioId:h.sitioId,sectorId:h.sectorId,sectorNombre:h.sectorNombre,fecha:h.fecha,tipo:t.dataset.tipo||''});
    return;
  }
  if(t.dataset&&t.dataset.evNota!=null){
    const ev=state.evidencias.find(x=>x.id===t.dataset.evNota);if(!ev)return;
    const d=Object.assign({},ev);delete d.id;d.nota=t.value;
    if(await guardarDoc(COL.ev+'/'+ev.id,d))toast('Nota guardada');
    return;
  }
  if(t.dataset&&t.dataset.imp){
    state.impacto=Object.assign({},state.impacto,{[t.dataset.imp]:t.dataset.imp==='escenario'?t.value:(Number(String(t.value).replace(/[^\d.-]/g,''))||0)});
    render();return;
  }
  if(t.id==='dAudSector'&&state.draft){state.draft.auditorSector=t.value;return}
  if(t.id==='wTipo'&&state.wiz){state.wiz.tipo=t.value;return}
  if(t.id==='wFecha'&&state.wiz){state.wiz.fecha=t.value;return}
  if(t.id==='cTipo'&&state.carga){state.carga.tipo=t.value;render();return}
  if(t.id==='cFecha'&&state.carga){state.carga.fecha=t.value;render();return}
  const cr2=t.closest&&t.closest('[data-crow]');
  if(cr2&&t.dataset.cf==='audita'&&state.carga){
    state.carga.rows[cr2.dataset.crow]=Object.assign({},state.carga.rows[cr2.dataset.crow]||{},{audita:t.value});return;
  }
  if(t.id==='feSector'){const v=t.value;t.value='';if(v)descargarInformesSector(v);return}
  if(t.id==='fSitio'){state.f.sitio=t.value;if(t.value!=='all')elegirSitio(t.value);render();return}
  if(t.id==='fZona'){state.f.zona=t.value;render();return}
  if(t.id==='fPeriodo'){state.f.periodo=t.value;render();return}
  if(t.id==='hSector'){state.fh.sector=t.value;render();return}
  if(t.id==='hArea'){state.fh.area=t.value;render();return}
  if(t.id==='hEstado'){state.fh.estado=t.value;render();return}
  if(state.editCl){
    if(t.id==='clActiva'){state.editCl.activa=t.value==='1';return}
    if(t.id==='clModo'){state.editCl.modo=t.value;render();return}
    if(t.id==='clPilar'){state.editCl.pilar=t.value;render();return}
    if(t.dataset.tipo!=null){
      const s=new Set(state.editCl.tipos||[]);t.checked?s.add(t.dataset.tipo):s.delete(t.dataset.tipo);
      state.editCl.tipos=Array.from(s);return;
    }
  }
  if(t.id==='layPlano'){state.lay=state.lay||{};state.lay.plano=t.value;state.lay.sel=null;render();return}
  if(t.id==='laySolo'){state.lay=state.lay||{};state.lay.solo=!!t.checked;render();return}
  if(t.id==='rotQ'){state.rot=state.rot||{};state.rot.q=Number(t.value);render();return}
  if(t.dataset&&t.dataset.rotj!=null){

    state.jefes=cfg;if(await guardarJefes(cfg))toast(t.value?'Auditor fijado para esta quincena':'Vuelve al reparto automático');
    render();return;
  }

    const [sid,jid]=t.dataset.sj.split('|');
    const sec=todosSectores().find(x=>x.id===sid);if(!sec)return;
    for(const p of state.sitios){const s=(p.sectores||[]).find(x=>x.id===sid);if(!s)continue;
      const l=Array.isArray(s.jefes)?s.jefes.slice():[];
      const i=l.indexOf(jid);if(t.checked&&i<0)l.push(jid);if(!t.checked&&i>=0)l.splice(i,1);

    return;

  if(state.draft){
    if(t.id==='dSector'){state.draft.sectorId=t.value;state.draft.checklistId='';state.draft.resp={};render();return}
    if(t.id==='dCl'){const tenia=Object.keys(state.draft.resp).length;state.draft.checklistId=t.value;state.draft.resp={};render();if(tenia)toast('Se reinició la carga: cambió la checklist');return}
    if(t.id==='dTipo'){state.draft.tipoAuditoria=t.value;render();return}
    if(t.id==='dAudJefe'){state.draft.auditorJefe=t.value;render();return}
    if(t.id==='dFecha'){state.draft.fecha=t.value;return}
  }
  const jr=t.closest('[data-jefe]');
  if(jr&&t.dataset.jf&&esAdmin()){
    const cfg=jefesCfg();
    cfg.lista=cfg.lista.map(x=>x.id===jr.dataset.jefe?Object.assign({},x,{[t.dataset.jf]:t.value}):x);
    state.jefes=cfg;if(await guardarJefes(cfg))toast('Jefe actualizado');
    return;
  }
  const tr=t.closest('[data-hall]');
  if(tr&&t.dataset.f){
    const h=state.hallazgos.find(x=>x.id===tr.dataset.hall);if(!h)return;
    const d=Object.assign({},h);delete d.id;d[t.dataset.f]=t.value;
    if(t.dataset.f==='area'){
      /* derivado a otra área: queda la fecha de la solicitud y pasa a "en proceso" */
      if(t.value!=='sector'){if(!d.fechaSolicitud)d.fechaSolicitud=todayISO();if(d.estado==='abierto')d.estado='proceso'}
      else d.fechaSolicitud='';
      state.openHab='h:'+h.id;
    }
    if(t.dataset.f==='estado'){
      if(t.value==='cerrado'){
        if(!String(d.accionCorrectiva||'').trim()){toast('Escribí la acción correctiva antes de cerrar: qué se hizo para corregirlo');state.openHab='h:'+h.id;render();return}
        if(!h.sinFoto&&!evidenciasHall(h.id).some(x=>x.tipo==='correccion')){toast('Falta la foto de corrección: subila con el botón "✔ foto de corrección" y después cerrá');state.openHab='h:'+h.id;render();return}
        if((h.reincidencia||1)>=2&&!String(h.causaRaiz||'').trim()){toast('Este hallazgo es reincidente: documentá la causa raíz antes de cerrarlo');state.openHab='h:'+h.id;render();return}
        d.cerrado=new Date().toISOString();
      }else d.cerrado='';
    }
    if(await guardarDoc(COL.ha+'/'+h.id,d))toast('Hallazgo actualizado');
    return;
  }
  const sc=t.closest('[data-sector]');
  if(sc){
    const[pi,si]=sc.dataset.sector.split(':').map(Number);
    const s=state.sitios[pi].sectores[si];
    if(t.dataset.xf){s[t.dataset.xf]=t.dataset.xf==='dotacion'?(Number(String(t.value).replace(/[^\d]/g,''))||0):t.value;await guardarEstructura();render();return}
    if(t.dataset.hab!=null){s.habilitacion=Object.assign({},s.habilitacion||{},{['h'+t.dataset.hab]:t.checked});await guardarEstructura();render();return}
  }
});

/* la sesión se recuerda solo en esta pestaña; al cerrarla se vuelve a pedir nombre y clave */
state.sesion=leerSesion();
if(state.sesion){state.auditor=state.sesion.nombre;
  state.gateDest=state.sesion.usuario||'';
  if(state.sesion.rol==='sector'&&state.sesion.sectorId)state.fh.sector=state.sesion.sectorId;
  if(state.sesion.rol==='gerencia')state.view='gerencia';else if(state.sesion.rol==='planta')state.view='etiquetas';else if(state.sesion.rol!=='admin')state.view='piso';}
/* la primera vez que alguien abre el sistema, arranca el recorrido guiado */
try{if(state.sesion&&!localStorage.getItem('cat.tour')){state.tour=0;state.view='manual'}}catch(e){}
document.addEventListener('submit',e=>{
  if(e.target&&e.target.id==='formGate'){e.preventDefault();entrarGate()}
},true);
conectar();
</script>

</body></html>
